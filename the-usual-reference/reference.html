        border-color: var(--border);
      }
      .filter-chip.secondary.active {
        background: var(--bg-sunken);
        color: var(--ink);
        border-color: var(--border-strong);
      }
      .filter-chip.clear-chip {
        border: 1px dashed var(--border-strong);
        color: var(--ink-soft);
        flex-shrink: 0;
        width: 30px;
        height: 30px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .filter-chip.clear-chip:active {
        background: var(--bg-sunken);
      }

      /* SECTION HEADER */
      .home-section {
        margin-top: 4px;
      }
      .section-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 0;
        padding: 16px 22px 8px;
        background: transparent;
        border: none;
        width: 100%;
        font-family: inherit;
        text-align: left;
        color: var(--ink);
        cursor: default;
      }
      .section-header.collapsible {
        cursor: pointer;
      }
      .section-header.collapsible:active {
        background: transparent;
      }
      .section-header-main {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
      }
      .section-header h2 {
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.01em;
        margin: 0;
        color: var(--ink);
      }
      .section-header .section-count {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 13px;
        color: var(--ink-muted);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .section-chev {
        display: inline-flex;
        align-items: center;
        color: var(--ink-muted);
        margin-left: 2px;
        transition: transform 0.32s var(--ease-out);
      }
      .section-chev.open {
        transform: rotate(180deg);
      }
      .section-preview {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 11.5px;
        color: var(--ink-muted);
        margin-left: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 50%;
      }

      .empty-action {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 16px;
        padding: 10px 16px;
      }

      /* iOS install banner */
      .install-hint {
        display: none;
        margin: 8px 22px 0;
        padding: 10px 14px;
        background: var(--bg-sunken);
        border: none;
        border-radius: 12px;
        font-size: 12px;
        color: var(--ink-soft);
        line-height: 1.4;
      }

      /* FOOTER CLUSTER — centered nav + FAB on a single row, fixed to
         viewport bottom. Each child is intrinsically sized so the cluster
         stays horizontally centered at any viewport width. */
      .footer-cluster {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom) + 14px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 16px;
        z-index: 50;
        pointer-events: none;
      }
      .footer-cluster > * {
        pointer-events: auto;
      }

      /* BOTTOM NAV */
      .bottom-nav {
        position: static;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 5px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        box-shadow:
          0 18px 40px rgba(26, 22, 20, 0.2),
          0 8px 18px rgba(26, 22, 20, 0.14),
          0 2px 4px rgba(26, 22, 20, 0.08);
        transition:
          transform 0.36s var(--ease-out),
          opacity 0.32s var(--ease-out);
        flex: 1 1 auto;
        max-width: 360px;
      }
      [data-theme="dark"] .bottom-nav {
        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.55),
          0 8px 18px rgba(0, 0, 0, 0.4),
          0 2px 4px rgba(0, 0, 0, 0.25);
      }
      /* Icons-only nav: labels hidden globally; aria-labels keep a11y. */
      .bottom-nav .nav-label {
        display: none;
      }
      .bottom-nav.hidden {
        transform: translateY(160%);
        opacity: 0;
        pointer-events: none;
      }

      /* Floating Action Button — Add */
      .fab-add {
        position: static;
        flex: 0 0 auto;
        width: 56px;
        height: 56px;
        border: none;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
        box-shadow:
          0 14px 32px rgba(184, 229, 50, 0.34),
          0 6px 14px rgba(0, 0, 0, 0.18);
        transition:
          transform 0.36s var(--ease-out),
          opacity 0.32s var(--ease-out),
          box-shadow 0.18s;
      }
      .fab-add:active {
        transform: scale(0.95);
        box-shadow:
          0 6px 14px rgba(184, 229, 50, 0.28),
          0 2px 6px rgba(0, 0, 0, 0.18);
      }
      .fab-add.hidden {
        transform: translateY(160%) scale(0.9);
        opacity: 0;
        pointer-events: none;
      }
      [data-theme="dark"] .fab-add {
        box-shadow:
          0 14px 32px rgba(184, 229, 50, 0.22),
          0 6px 14px rgba(0, 0, 0, 0.5);
      }
      .nav-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: transparent;
        border: none;
        padding: 11px 10px;
        border-radius: 999px;
        color: var(--ink-muted);
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: -0.005em;
        position: relative;
        transition:
          background 0.22s var(--ease-out),
          color 0.22s var(--ease-out),
          transform 0.12s var(--ease-out);
      }
      .nav-btn svg {
        width: 20px;
        height: 20px;
        transition: transform 0.32s var(--ease-out);
      }
      .nav-btn.active {
        color: var(--ink);
        background: var(--bg-sunken);
      }
      .nav-btn.active svg {
        transform: scale(1.05);
      }
      .nav-btn:active {
        transform: scale(0.94);
      }
      .nav-btn.cta {
        background: var(--primary);
        color: var(--primary-ink);
        box-shadow: var(--shadow-cta);
      }
      .nav-btn.cta:active {
        background: var(--primary-deep);
        transform: scale(0.94);
      }
      .nav-btn.cta svg {
        stroke-width: 2.5;
      }
      .nav-label {
        display: none;
      }
      @media (min-width: 380px) {
        .nav-label {
          display: inline;
        }
      }

      /* Misc helper utilities */
      .hint-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      /* ============================================================
         Telegram connect — input + verify button glued, status pill,
         bot handle inline pill. Matches existing field/btn language.
         ============================================================ */
      .input-attach {
        display: flex;
        gap: 8px;
        align-items: stretch;
      }
      .input-attach .field-input {
        flex: 1;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
      }
      .input-attach .field-input:focus {
        border-color: var(--ink);
      }
      .input-attach .input-attach-btn {
        flex-shrink: 0;
        padding: 0 18px;
        min-height: 50px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        font-family: inherit;
        border: none;
        background: var(--ink);
        color: var(--bg);
        letter-spacing: -0.01em;
        transition:
          background 0.18s,
          transform 0.12s var(--ease-out),
          opacity 0.18s;
      }
      .input-attach .input-attach-btn:active:not(:disabled) {
        transform: scale(0.97);
        background: var(--ink-soft);
      }
      .input-attach .input-attach-btn:disabled {
        background: var(--border-strong);
        color: var(--ink-muted);
        cursor: not-allowed;
      }

      .field-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 10px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--ink-muted);
      }
      .field-status::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.5;
      }
      .field-status.is-verified {
        color: var(--success);
      }
      .field-status.is-verified::before {
        opacity: 1;
      }
      .field-status.is-warn {
        color: var(--warning-ink);
      }
      .field-status.is-warn::before {
        opacity: 1;
      }

      .bot-handle {
        display: inline-flex;
        align-items: center;
        padding: 1px 8px;
        background: var(--bg-sunken);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--ink);
        font-weight: 600;
        font-size: 12.5px;
        text-decoration: none;
        transition:
          background 0.18s,
          border-color 0.18s;
      }
      .bot-handle:hover {
        background: var(--bg-elevated);
        border-color: var(--border-strong);
      }
      .bot-handle:active {
        transform: scale(0.97);
      }

      /* ============================================================
         Desktop adaptations (additive; mobile rendering unchanged at ≤480px).
         ============================================================ */

      /* ============================================================
         Desktop adaptations (additive; mobile rendering unchanged at ≤480px).
         ============================================================ */
      @media (min-width: 768px) {
        #app {
          max-width: 720px;
        }
        /* Bottom sheets become centered modal dialogs on tablet+. */
        .sheet-backdrop {
          align-items: center;
        }
        .sheet {
          max-width: 540px;
          margin: 0 auto;
          border-radius: var(--r-xl, 22px);
          border-bottom: 1.5px solid var(--border);
        }
        .sheet-handle {
          display: none;
        }
      }

      @media (min-width: 1100px) {
        #app {
          max-width: 1040px;
        }
        /* Calendar sheet gets extra room. */
        .sheet.calendar-sheet {
          max-width: 720px;
        }
      }

      @media (hover: hover) {
        .card:hover {
          background: var(--bg-elevated, var(--bg-sunken));
        }
        .icon-btn:hover,
        .menu-item:hover,
        .btn-secondary:hover,
        .btn-ghost:hover {
          background: var(--bg-sunken);
        }
        .btn-primary:hover {
          filter: brightness(1.05);
        }
        .segment:hover:not(.active) {
          background: var(--bg-sunken);
        }
      }
    </style>
  </head>

        return Promise.race([

              timeoutMs,

                DEPENDENCY_TIMEOUT_MS,

              withTimeout(

      function detectTimeZone() {

          return typeof tz === "string" && tz ? tz : "UTC";

      function id() {

      // ====================================================================
      // DATE UTILITIES
      // ====================================================================
      function startOfDay(d) {
        const x = new Date(d);
        x.setHours(0, 0, 0, 0);
        return x;
      }

      function addDays(date, days) {
        const d = new Date(date);
        d.setDate(d.getDate() + days);
        return d;
      }

      function daysDiff(from, to) {
        const a = startOfDay(from).getTime();
        const b = startOfDay(to).getTime();
        return Math.round((b - a) / MS_PER_DAY);
      }

      function isFutureDay(value) {
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return false;
        return startOfDay(d).getTime() > startOfDay(new Date()).getTime();
      }

      function addInterval(date, value, unit) {
        const d = new Date(date);
        switch (unit) {
          case "day":
            d.setDate(d.getDate() + value);
            break;
          case "week":
            d.setDate(d.getDate() + value * 7);
            break;
          case "month":
            d.setMonth(d.getMonth() + value);
            break;
          case "year":
            d.setFullYear(d.getFullYear() + value);
            break;
        }
        return d;
      }

      function intervalToDays(value, unit) {
        switch (unit) {
          case "day":
            return value;
          case "week":
            return value * 7;
          case "month":
            return value * 30;
          case "year":
            return value * 365;
        }
        return value;
      }

      function formatInterval(value, unit) {
        const singular = {
          day: "day",
          week: "week",
          month: "month",
          year: "year",
        }[unit];
        const plural = {
          day: "days",
          week: "weeks",
          month: "months",
          year: "years",
        }[unit];
        return `every ${value} ${value === 1 ? singular : plural}`;
      }

      function shiftSkipDays(date, skipDays, direction) {
        if (!skipDays || skipDays.length === 0) return new Date(date);
        if (skipDays.length >= 7) return new Date(date);
        const d = new Date(date);
        const isSkipped = (dt) => skipDays.includes(dt.getDay());
        if (!isSkipped(d)) return d;
        if (direction === "backward") {
          while (isSkipped(d)) d.setDate(d.getDate() - 1);
          return d;
        }
        if (direction === "nearest") {
          const fwd = new Date(d),
            bwd = new Date(d);
          let fwdSteps = 0,
            bwdSteps = 0;
          while (isSkipped(fwd)) {
            fwd.setDate(fwd.getDate() + 1);
            fwdSteps++;
          }
          while (isSkipped(bwd)) {
            bwd.setDate(bwd.getDate() - 1);
            bwdSteps++;
          }
          return bwdSteps <= fwdSteps ? bwd : fwd;
        }
        while (isSkipped(d)) d.setDate(d.getDate() + 1);
        return d;
      }

      function isShifted(originalDate, skipDays) {
        if (!skipDays || skipDays.length === 0) return false;
        return skipDays.includes(new Date(originalDate).getDay());
      }

      function colorForRoutine(rid) {
        let hash = 0;
        for (let i = 0; i < rid.length; i++)
          hash = (hash * 31 + rid.charCodeAt(i)) | 0;
        return ROUTINE_COLORS[Math.abs(hash) % ROUTINE_COLORS.length];
      }

      function formatDate(date, opts = {}) {
        const d = new Date(date);
        return d.toLocaleDateString(undefined, {
          weekday: opts.short ? "short" : "short",
          day: "numeric",
          month: "short",
          ...(opts.year ? { year: "numeric" } : {}),
        });
      }

      function formatRelative(date) {
        const d = daysDiff(new Date(), date);
        if (d === 0) return "today";
        if (d === 1) return "tomorrow";
        if (d === -1) return "yesterday";
        if (d > 0) return `in ${d}d`;
        return `${-d}d ago`;
      }

      function hhmmOf(date) {
        const d = new Date(date);
        if (Number.isNaN(d.getTime())) return null;
        return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      }

      // Absolute date+time for cards / details / calendar.
      //   time: optional "HH:MM" string to append. If null, time is omitted.
      //   todayShort: when true, today/tomorrow/yesterday render as words.
      function formatDateTime(date, { time = null, todayShort = false } = {}) {
        const d = new Date(date);
        if (Number.isNaN(d.getTime())) return "";
        const suffix = time ? `, ${time}` : "";
        if (todayShort) {
          const days = daysDiff(new Date(), d);
          if (days === 0) return `Today${suffix}`;
          if (days === 1) return `Tomorrow${suffix}`;
          if (days === -1) return `Yesterday${suffix}`;
        }
        const sameYear = d.getFullYear() === new Date().getFullYear();
        const datePart = d.toLocaleDateString(undefined, {
          weekday: "short",
          day: "numeric",
          month: "short",
          ...(sameYear ? {} : { year: "numeric" }),
        });
        return `${datePart}${suffix}`;
      }

      function toInputDate(date) {
        const d = new Date(date);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function fromInputDate(str) {
        const [y, m, d] = str.split("-").map(Number);
        return new Date(y, m - 1, d, 12, 0, 0); // noon to avoid timezone edge cases
      }

      // ====================================================================
      // ROUTINE CALCULATIONS
      // ====================================================================
      function getLastDone(routine) {
        if (!routine.history?.length) return null;
        const sorted = [...routine.history].sort(
          (a, b) => new Date(b.date) - new Date(a.date),
        );
        return sorted[0].date;
      }

      function getNextDue(item) {
        // Tasks have no scheduled date — never compute a "next due".
        if (item.type === "task") return null;
        if (item.type === "reminder") {
          if (item.completedAt) return null;
          return startOfDay(fromInputDate(item.dueDate));
        }
        if (item.pausedUntil && isFutureDay(item.pausedUntil)) {
          return startOfDay(item.pausedUntil);
        }
        if (item.snoozedUntil) {
          const snoozeDay = startOfDay(new Date(item.snoozedUntil));
          if (snoozeDay.getTime() >= startOfDay(new Date()).getTime()) {
            return snoozeDay;
          }
        }
        // Re-anchored cycle (set by snooze "apply to all future")
        if (item.cycleAnchorDate) {
          const anchor = startOfDay(new Date(item.cycleAnchorDate));
          if (anchor.getTime() >= startOfDay(new Date()).getTime()) {
            return anchor;
          }
          // Anchor in the past — treat it like "last done" so the cycle resumes from there
          const raw = addInterval(
            anchor,
            item.intervalValue,
            item.intervalUnit,
          );
          return shiftSkipDays(raw, item.skipDays, item.skipDirection);
        }
        const last = getLastDone(item);
        if (!last) return startOfDay(new Date());
        const raw = addInterval(
          new Date(last),
          item.intervalValue,
          item.intervalUnit,
        );
        return shiftSkipDays(raw, item.skipDays, item.skipDirection);
      }

      function getStatus(item) {
        if (item.type === "task") {
          // Tasks are date-less: they're either active or done.
          if (item.completedAt)
            return { state: "done", label: "DONE", days: 0 };
          return { state: "ok", label: "", days: 0 };
        }
        if (item.type === "reminder") {
          if (item.completedAt)
            return { state: "done", label: "DONE", days: 0 };
          const next = getNextDue(item);
          const days = daysDiff(new Date(), next);
          if (days < 0)
            return {
              state: "overdue",
              label: `${-days}D OVERDUE`,
              days: -days,
            };
          if (days === 0) return { state: "due", label: "DUE TODAY", days: 0 };
          if (days <= 3) return { state: "soon", label: `${days}D LEFT`, days };
          return { state: "ok", label: `${days}D LEFT`, days };
        }
        if (item.pausedUntil && isFutureDay(item.pausedUntil)) {
          return { state: "paused", label: "PAUSED", days: 0 };
        }
        const now = new Date();
        const next = getNextDue(item);
        const days = daysDiff(now, next);
        if (days < 0)
          return { state: "overdue", label: `${-days}D OVERDUE`, days: -days };
        if (days === 0) return { state: "due", label: "DUE TODAY", days: 0 };
        const intervalDays = intervalToDays(
          item.intervalValue,
          item.intervalUnit,
        );
        const soonThreshold = Math.max(2, Math.ceil(intervalDays * 0.15));
        if (days <= soonThreshold)
          return { state: "soon", label: `${days}D LEFT`, days };
        return { state: "ok", label: `${days}D LEFT`, days };
      }

      // Auto-archive past-due archive-type reminders (pure function)
      function runAutoArchive(items, now) {
        const today = startOfDay(now).getTime();
        let changed = 0;
        const out = items.map((it) => {
          if (it.type !== "reminder") return it;
          if (it.completedAt) return it;
          if (it.onOverdue !== "archive") return it;
          const due = startOfDay(fromInputDate(it.dueDate)).getTime();
          if (due >= today) return it;
          changed++;
          return {
            ...it,
            completedAt: fromInputDate(it.dueDate).toISOString(),
            completionType: "missed",
          };
        });
        return { items: out, changed };
      }

      function getStats(routine) {
        if (!routine.history || routine.history.length < 2) return null;
        const sorted = [...routine.history].sort(
          (a, b) => new Date(a.date) - new Date(b.date),
        );
        const intervals = [];
        for (let i = 1; i < sorted.length; i++) {
          intervals.push(daysDiff(sorted[i - 1].date, sorted[i].date));
        }
        const avg = intervals.reduce((s, v) => s + v, 0) / intervals.length;
        const intervalDays = intervalToDays(
          routine.intervalValue,
          routine.intervalUnit,
        );
        const consistency = Math.max(
          0,
          1 - Math.min(1, Math.abs(avg - intervalDays) / intervalDays),
        );
        return {
          avg: Math.round(avg * 10) / 10,
          consistency: Math.round(consistency * 100),
          total: sorted.length,
        };
      }

      function getSuggestion(routine) {
        if (routine.type !== "routine") return null;
        if (routine.dismissedSuggestion) return null;
        const stats = getStats(routine);
        if (!stats || stats.total < 5) return null;
        const intervalDays = intervalToDays(
          routine.intervalValue,
          routine.intervalUnit,
        );
        const diff = Math.abs(stats.avg - intervalDays);
        if (diff / intervalDays <= 0.2) return null;
        const unit = routine.intervalUnit;
        let suggestedValue;
        if (unit === "week") suggestedValue = Math.round(stats.avg / 7);
        else if (unit === "month") suggestedValue = Math.round(stats.avg / 30);
        else if (unit === "year") suggestedValue = Math.round(stats.avg / 365);
        else suggestedValue = Math.round(stats.avg);
        suggestedValue = Math.max(1, Math.min(999, suggestedValue));
        if (suggestedValue === routine.intervalValue) return null;
        return { suggestedValue, suggestedUnit: unit, avg: stats.avg };
      }

      function getItemDatesInRange(item, rangeStart, rangeEnd) {
        const out = [];
        const today = startOfDay(new Date());

        // Reminders: a single past entry (if completed in range) or future entry (if pending in range)
        if (item.type === "reminder") {
          if (item.completedAt) {
            const d = new Date(item.completedAt);
            if (d >= rangeStart && d <= rangeEnd) {
              out.push({ date: d, type: "past" });
            }
          } else {
            const d = fromInputDate(item.dueDate);
            if (d >= rangeStart && d <= rangeEnd) {
              const isPast = startOfDay(d).getTime() < today.getTime();
              out.push({ date: d, type: isPast ? "past" : "future" });
            }
          }
          return out;
        }

        // Routines: history entries in range + future projections
        for (const entry of item.history || []) {
          const d = new Date(entry.date);
          if (d >= rangeStart && d <= rangeEnd) {
            out.push({
              date: d,
              type: "past",
              note: entry.note,
              entryId: entry.id,
            });
          }
        }
        let cursor = getNextDue(item);
        if (!cursor) return out;
        let safety = 0;
        while (cursor <= rangeEnd && safety < 200) {
          if (
            startOfDay(cursor).getTime() >= today.getTime() &&
            cursor >= rangeStart
          ) {
            const inPause =
              item.pausedUntil && cursor < new Date(item.pausedUntil);
            if (!inPause) out.push({ date: new Date(cursor), type: "future" });
          }
          const raw = addInterval(
            cursor,
            item.intervalValue,
            item.intervalUnit,
          );
          cursor = shiftSkipDays(raw, item.skipDays, item.skipDirection);
          safety++;
        }
        return out;
      }

      // Back-compat alias
      const getRoutineDatesInRange = getItemDatesInRange;

      // ====================================================================
      // ICS CALENDAR EXPORT
      // ====================================================================
      function pad(n) {
        return String(n).padStart(2, "0");
      }

      // Build a Google Calendar event-create URL. 09:00 local time on the due
      // date, zero-length event, no alarm (Google's render URL has no alarm
      // parameter — user's GCal default reminders apply).
      function googleCalendarUrl(routine, dueDate) {
        const d = new Date(dueDate);
        d.setHours(9, 0, 0, 0);
        const p = (n) => String(n).padStart(2, "0");
        const stamp = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
        const params = new URLSearchParams({
          action: "TEMPLATE",
          text: routine.name,
          dates: `${stamp}/${stamp}`,
          details:
            "Routine reminder: " +
            routine.name +
            " is due. Open The Usual app to mark done.",
        });
        return `https://calendar.google.com/calendar/render?${params.toString()}`;
      }

      // ====================================================================
      // MARKDOWN-LITE — checkboxes / bullets / **bold** / ~~strike~~
      // ====================================================================
      // Storage format = source string. Display = parsed VNodes (Preact's
      // default escaping makes XSS a non-issue — we never use innerHTML).

      const CHECK_LINE_RE = /^\[( |x)\] /;
      const BULLET_LINE_RE = /^- /;

      function classifyLine(line) {
        const checkMatch = line.match(CHECK_LINE_RE);
        if (checkMatch) {
          return {
            type: "check",
            checked: checkMatch[1] === "x",
            text: line.slice(4),
          };
        }
        if (BULLET_LINE_RE.test(line)) {
          return { type: "bullet", text: line.slice(2) };
        }
        return { type: "p", text: line };
      }

      function parseDescription(source) {
        const lines = String(source || "").split("\n");
        return lines.map((line, idx) => ({
          ...classifyLine(line),
          lineIndex: idx,
        }));
      }

      // Inline parser: walk the string, emit text and **bold** / ~~strike~~
      // spans as Preact VNodes. Returns an array safe to render as children.
      function renderInline(text) {
        const out = [];
        let i = 0;
        let buf = "";
        while (i < text.length) {
          if (text[i] === "*" && text[i + 1] === "*") {
            const end = text.indexOf("**", i + 2);
            if (end > i + 2) {
              if (buf) {
                out.push(buf);
                buf = "";
              }
              out.push(html`<strong>${text.slice(i + 2, end)}</strong>`);
              i = end + 2;
              continue;
            }
          }
          if (text[i] === "~" && text[i + 1] === "~") {
            const end = text.indexOf("~~", i + 2);
            if (end > i + 2) {
              if (buf) {
                out.push(buf);
                buf = "";
              }
              out.push(html`<s>${text.slice(i + 2, end)}</s>`);
              i = end + 2;
              continue;
            }
          }
          buf += text[i];
          i++;
        }
        if (buf) out.push(buf);
        return out;
      }

      function checklistProgress(source) {
        if (typeof source !== "string" || source.length === 0) return null;
        let done = 0;
        let total = 0;
        for (const line of source.split("\n")) {
          const m = line.match(CHECK_LINE_RE);
          if (!m) continue;
          total++;
          if (m[1] === "x") done++;
        }
        return total > 0 ? { done, total } : null;
      }

      // Mutate the source: flip [ ] ↔ [x] on the given line index.
      function toggleCheckboxAt(source, lineIndex) {
        const lines = String(source || "").split("\n");
        if (lineIndex < 0 || lineIndex >= lines.length) return source;
        const line = lines[lineIndex];
        const m = line.match(CHECK_LINE_RE);
        if (!m) return source;
        lines[lineIndex] = (m[1] === "x" ? "[ ] " : "[x] ") + line.slice(4);
        return lines.join("\n");
      }

      // ====================================================================
      // STORAGE (with validation)
      // ====================================================================
      function safeParse(raw, fallback) {
        if (!raw) return fallback;
        try {
          return JSON.parse(raw);
        } catch {
          return fallback;
        }
      }

      function safeStorageGet(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function safeStorageSet(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch {
          return false;
        }
      }

      function safeStorageRemove(key) {
        try {
          localStorage.removeItem(key);
        } catch {}
      }

      function migrateLegacyStorage() {
        try {
          if (safeStorageGet(STORAGE_MIGRATION_KEY) === "1") return;

          const hasCurrentData = safeStorageGet(STORAGE_KEY) !== null;
          const hasCurrentSettings = safeStorageGet(SETTINGS_KEY) !== null;
          const legacyData = safeStorageGet(LEGACY_STORAGE_KEY);
          const legacySettings = safeStorageGet(LEGACY_SETTINGS_KEY);

          const dataCopied =
            hasCurrentData ||
            legacyData === null ||
            safeStorageSet(STORAGE_KEY, legacyData);
          const settingsCopied =
            hasCurrentSettings ||
            legacySettings === null ||
            safeStorageSet(SETTINGS_KEY, legacySettings);

          if (!dataCopied || !settingsCopied) return;

          if (legacyData !== null) safeStorageRemove(LEGACY_STORAGE_KEY);
          if (legacySettings !== null) safeStorageRemove(LEGACY_SETTINGS_KEY);

          safeStorageSet(STORAGE_MIGRATION_KEY, "1");
        } catch {}
      }

      migrateLegacyStorage();

      const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

      function sharedItemFields(r) {
        const desc =
          typeof r.description === "string"
            ? r.description.trim().slice(0, MAX_DESCRIPTION)
            : "";
        let skipDays, skipDirection;
        if (Array.isArray(r.skipDays)) {
          skipDays = Array.from(
            new Set(
              r.skipDays.filter((n) => Number.isInteger(n) && n >= 0 && n <= 6),
            ),
          ).sort();
          skipDirection = ["forward", "backward", "nearest"].includes(
            r.skipDirection,
          )
            ? r.skipDirection
            : "forward";
        } else if (typeof r.weekendSkip === "string") {
          if (r.weekendSkip === "monday") {
            skipDays = [0, 5, 6];
            skipDirection = "forward";
          } else if (r.weekendSkip === "friday") {
            skipDays = [0, 6];
            skipDirection = "backward";
          } else {
            skipDays = [];
            skipDirection = "forward";
          }
        } else {
          skipDays = [];
          skipDirection = "forward";
        }
        return {
          id: r.id,
          name: String(r.name).slice(0, 80),
          description: desc,
          icon:
            typeof r.icon === "string" ? normalizeRoutineIcon(r.icon) : "clock",
          skipDays,
          skipDirection,
          history: Array.isArray(r.history)
            ? r.history
                .filter((h) => h && typeof h.date === "string")
                .slice(0, 1000)
                .map((h) => ({
                  id: typeof h.id === "string" ? h.id : id(),
                  date: h.date,
                  note: typeof h.note === "string" ? h.note.slice(0, 200) : "",
                }))
            : [],
          muted: r.muted === true,
          notifyTime:
            typeof r.notifyTime === "string" && TIME_RE.test(r.notifyTime)
              ? r.notifyTime
              : DEFAULT_NOTIFY_TIME,
          tz: typeof r.tz === "string" && r.tz ? r.tz : detectTimeZone(),
          createdAt:
            typeof r.createdAt === "string"
              ? r.createdAt
              : new Date().toISOString(),
        };
      }

      function validateRoutineFields(r) {
        let intervalValue, intervalUnit;
        if (
          typeof r.intervalValue === "number" &&
          Number.isFinite(r.intervalValue) &&
          typeof r.intervalUnit === "string" &&
          ["day", "week", "month", "year"].includes(r.intervalUnit)
        ) {
          intervalValue = Math.max(
            1,
            Math.min(999, Math.floor(r.intervalValue)),
          );
          intervalUnit = r.intervalUnit;
        } else if (
          typeof r.interval === "number" &&
          Number.isFinite(r.interval)
        ) {
          const iv = Math.max(1, Math.floor(r.interval));
          if (iv <= 30) {
            intervalValue = iv;
            intervalUnit = "day";
          } else if (iv <= 90 && iv % 7 === 0) {
            intervalValue = iv / 7;
            intervalUnit = "week";
          } else {
            intervalValue = Math.min(iv, 999);
            intervalUnit = "day";
          }
        } else {
          return null;
        }
        return {
          type: "routine",
          ...sharedItemFields(r),
          intervalValue,
          intervalUnit,
          pausedUntil: typeof r.pausedUntil === "string" ? r.pausedUntil : null,
          snoozedUntil:
            typeof r.snoozedUntil === "string" ? r.snoozedUntil : null,
          snoozedTime:
            typeof r.snoozedTime === "string" && TIME_RE.test(r.snoozedTime)
              ? r.snoozedTime
              : null,
          cycleAnchorDate:
            typeof r.cycleAnchorDate === "string" ? r.cycleAnchorDate : null,
          dismissedSuggestion:
            typeof r.dismissedSuggestion === "number"
              ? r.dismissedSuggestion
              : null,
        };
      }

      function validateReminderFields(r) {
        if (typeof r.dueDate !== "string" || !DATE_RE.test(r.dueDate))
          return null;
        const onOverdue = ON_OVERDUE_OPTIONS.includes(r.onOverdue)
          ? r.onOverdue
          : "archive";
        const completedAt =
          typeof r.completedAt === "string" ? r.completedAt : null;
        const completionType = COMPLETION_TYPES.includes(r.completionType)
          ? r.completionType
          : null;
        return {
          type: "reminder",
          ...sharedItemFields(r),
          dueDate: r.dueDate,
          onOverdue,
          completedAt,
          completionType: completedAt ? completionType || "done" : null,
        };
      }

      function validateTaskFields(r) {
        const completedAt =
          typeof r.completedAt === "string" ? r.completedAt : null;
        const rank =
          Number.isInteger(r.rank) &&
          r.rank >= -2147483648 &&
          r.rank <= 2147483647
            ? r.rank
            : null;
        return {
          type: "task",
          ...sharedItemFields(r),
          rank,
          completedAt,
          priority: getPriority(r),
        };
      }

      function validateItem(r) {
        if (!r || typeof r !== "object") return null;
        if (typeof r.id !== "string" || typeof r.name !== "string") return null;
        const type = ITEM_TYPES.includes(r.type) ? r.type : "routine";
        if (type === "reminder") return validateReminderFields(r);
        if (type === "task") return validateTaskFields(r);
        return validateRoutineFields(r);
      }

      // Back-compat alias (used by import path)
      const validateRoutine = validateItem;

      function loadItems() {
        const raw = safeParse(safeStorageGet(STORAGE_KEY), null);
        let list;
        if (Array.isArray(raw)) list = raw;
        else if (raw && Array.isArray(raw.routines)) list = raw.routines;
        else return [];
        if (list.length === 0) return [];
        return list.map(validateItem).filter(Boolean);
      }

      function saveItems(items) {
        const payload = { version: SCHEMA_VERSION, routines: items };
        if (!safeStorageSet(STORAGE_KEY, JSON.stringify(payload))) {
          console.warn("Storage quota exceeded");
        }
      }

      // Back-compat aliases
      const loadRoutines = loadItems;
      const saveRoutines = saveItems;

      function migrateSettingsV1ToV3() {
        try {
          if (safeStorageGet(SETTINGS_KEY) !== null) return;
          const oldRaw = safeStorageGet(LEGACY_SETTINGS_KEY_V1);
          if (oldRaw === null) return;
          const old = safeParse(oldRaw, {});
          const next = {
            theme: ["light", "dark", "auto"].includes(old.theme)
              ? old.theme
              : "auto",
            chatId: "",
            notificationsEnabled: false,
            lastSyncedAt: null,
            compactMode: old.compactMode === true,
          };
          if (safeStorageSet(SETTINGS_KEY, JSON.stringify(next))) {
            safeStorageRemove(LEGACY_SETTINGS_KEY_V1);
          }
        } catch {}
      }

      function loadSettings() {
        migrateSettingsV1ToV3();
        const raw = safeParse(safeStorageGet(SETTINGS_KEY), {});
        const chatId =
          typeof raw.chatId === "string" && CHAT_ID_RE.test(raw.chatId)
            ? raw.chatId
            : "";
        return {
          theme: ["light", "dark", "auto"].includes(raw.theme)
            ? raw.theme
            : "auto",
          chatId,
          notificationsEnabled: raw.notificationsEnabled === true,
          lastSyncedAt:
            typeof raw.lastSyncedAt === "string" ? raw.lastSyncedAt : null,
          compactMode: raw.compactMode === true,
        };
      }

      function saveSettings(s) {
        safeStorageSet(SETTINGS_KEY, JSON.stringify(s));
      }

      // ====================================================================
      // CLOUDFLARE WORKER SYNC (multi-tenant, X-Chat-Id auth)
      // ====================================================================
      // Boot-scoped counter: increments on every fire-and-forget sync trigger.
      // If the cold-start GET /sync resolves with this > 0, the remote payload
      // is discarded — local edits made during the load window win.
      let localWritesSinceBoot = 0;

      function buildWorkerPayload(items, settings) {
        // Skip completed reminders so the worker stops referencing them.
        // Tasks (including completed ones) sync — Done state is part of the data.
        const active = items.filter(
          (it) => !(it.type === "reminder" && it.completedAt),
        );
        const routines = active.map((r) => {
          if (r.type === "task") {
            return {
              ...r,
              kind: "task",
              tz: typeof r.tz === "string" && r.tz ? r.tz : detectTimeZone(),
              description: r.description || "",
            };
          }
          const next = getNextDue(r);
          let kind = "routine";
          if (r.type === "reminder") {
            kind = r.onOverdue === "nag" ? "reminder-nag" : "reminder-once";
          }
          const snoozedActive =
            r.type !== "reminder" &&
            r.snoozedUntil &&
            isFutureDay(r.snoozedUntil);
          const effectiveNotifyTime =
            snoozedActive &&
            typeof r.snoozedTime === "string" &&
            TIME_RE.test(r.snoozedTime)
              ? r.snoozedTime
              : typeof r.notifyTime === "string" && TIME_RE.test(r.notifyTime)
                ? r.notifyTime
                : DEFAULT_NOTIFY_TIME;
          // Pass the full routine through; override cron-critical fields with
          // freshly-computed values so the cron sees current state.
          return {
            ...r,
            kind,
            nextDue: toInputDate(next || new Date()),
            muted: !!r.muted,
            notifyTime: effectiveNotifyTime,
            tz: typeof r.tz === "string" && r.tz ? r.tz : detectTimeZone(),
            description: r.description || "",
          };
        });
        return {
          routines,
          settings: {
            theme: settings.theme,
            notificationsEnabled: !!settings.notificationsEnabled,
          },
        };
      }

      async function syncToWorker(routines, settings) {
        if (!settings.chatId) return;
        const payload = buildWorkerPayload(routines, settings);
        const res = await fetch(`${WORKER_URL}/sync`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Chat-Id": settings.chatId,
          },
          body: JSON.stringify(payload),
        });
        if (res.status === 429) throw new Error("rate-limited");
        if (!res.ok) throw new Error(`http-${res.status}`);
        return res.json().catch(() => ({}));
      }

      async function loadFromWorker(chatId) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), COLD_START_LOAD_TIMEOUT_MS);
        try {
          const res = await fetch(`${WORKER_URL}/sync`, {
            headers: { "X-Chat-Id": chatId },
            signal: ctrl.signal,
          });
          if (!res.ok) throw new Error(`http-${res.status}`);
          return await res.json();
        } finally {
          clearTimeout(t);
        }
      }

      // ----- Persisted pending-write queue -----
      // Survives swipe-close / OS kill. Drained on next cold-start before
      // any GET /sync overwrites local. The presence of pendingSync also
      // gates the cold-start apply: while it's set, the server view is
      // assumed older than our unsynced edits.
      const PENDING_KEY = "pendingSync";
      const UPDATED_AT_KEY = "syncUpdatedAt";

      function readPending() {
        try {
          const raw = localStorage.getItem(PENDING_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }
      function writePending(p) {
        try {
          localStorage.setItem(PENDING_KEY, JSON.stringify(p));
        } catch (err) {
          console.warn("pendingSync write failed:", err && err.message);
        }
      }
      function clearPending() {
        try {
          localStorage.removeItem(PENDING_KEY);
        } catch {}
      }
      function readStoredUpdatedAt() {
        try {
          const raw = localStorage.getItem(UPDATED_AT_KEY);
          if (raw == null) return 0;
          const n = parseInt(raw, 10);
          return Number.isFinite(n) ? n : 0;
        } catch {
          return 0;
        }
      }
      function writeStoredUpdatedAt(n) {
        try {
          if (Number.isFinite(n))
            localStorage.setItem(UPDATED_AT_KEY, String(n));
        } catch {}
      }

      async function resolveChatId(chatId) {
        const res = await fetch(`${WORKER_URL}/resolve`, {
          headers: { "X-Chat-Id": chatId },
        });
        if (!res.ok) throw new Error(`http-${res.status}`);
        const body = await res.json();
        return {
          exists: !!body.exists,
          atCapacity: !!body.atCapacity,
        };
      }

      async function testNotification(chatId) {
        const res = await fetch(`${WORKER_URL}/test`, {
          method: "POST",
          headers: { "X-Chat-Id": chatId },
        });
        return res.ok;
      }

      // ----- Sync coordinator -----
      // Coalesces local mutations into a single worker write. Without this,
      // every checkbox toggle / keystroke would POST separately and quickly
      // exhaust the worker's per-user rate budget (60 writes/hour) on top
      // of triggering one toast per failed write.
      //
      // Strategy:
      //   - markDirty(routines, settings) replaces the queued payload with
      //     the latest snapshot (last-write-wins; the worker accepts a full
      //     state replacement, so a diff is unnecessary).
      //   - A trailing 5 s debounce decides when to actually POST.
      //   - A 60 s minimum gap between successful writes caps the steady-
      //     state rate at 60/hour, matching the worker's hourly limit.
      //   - On visibilitychange:hidden / pagehide / beforeunload, any
      //     queued payload is flushed immediately via fetch keepalive
      //     (sendBeacon would lose the X-Chat-Id header).
      //   - 429 responses trigger exponential backoff (1, 2, 4, 8, 16, 32,
      //     60, 60…s). A toast is surfaced only after ≥2 minutes of
      //     persistent failure, then suppressed for another 5 minutes.
      const SYNC_DEBOUNCE_MS = 5000;
      const SYNC_MIN_GAP_MS = 60000;
      const SYNC_429_TOAST_AFTER_MS = 120000;
      const SYNC_429_TOAST_SUPPRESS_MS = 300000;

      const syncState = {
        payload: null,
        chatId: null,
        timer: null,
        sending: false,
        lastWriteAt: 0,
        backoffAttempt: 0,
        firstFailureAt: 0,
        toastSuppressUntil: 0,
        showToast: null,
        // Used by 409 conflict path to apply server's canonical snapshot
        // back to React state before re-sending the merged payload.
        setRoutines: null,
        setSettings: null,
        conflictAttempt: 0,
      };

      function syncMarkDirty(routines, settings, showToast) {
        if (!settings || !settings.chatId) return;
        localWritesSinceBoot++;
        const payload = buildWorkerPayload(routines, settings);
        syncState.payload = payload;
        syncState.chatId = settings.chatId;
        syncState.showToast = showToast;
        // Persist immediately so a swipe-close before debounce/min-gap
        // expires doesn't lose the edit.
        writePending({
          chatId: settings.chatId,
          payload,
          baseUpdatedAt: readStoredUpdatedAt(),
          queuedAt: Date.now(),
        });
        syncScheduleFlush();
      }

      function syncScheduleFlush() {
        if (syncState.sending) return;
        if (!syncState.payload) return;
        const now = Date.now();
        const earliest = Math.max(
          now + SYNC_DEBOUNCE_MS,
          syncState.lastWriteAt + SYNC_MIN_GAP_MS,
        );
        const delay = Math.max(0, earliest - now);
        if (syncState.timer) clearTimeout(syncState.timer);
        syncState.timer = setTimeout(syncFlush, delay);
      }

      async function syncFlush() {
        if (syncState.sending) return;
        if (!syncState.payload || !syncState.chatId) return;
        syncState.sending = true;
        const payload = syncState.payload;
        const chatId = syncState.chatId;
        const baseUpdatedAt = readStoredUpdatedAt();
        // Clear queue *before* sending; if a new mutation arrives during
        // the request it'll repopulate state.payload and a follow-up
        // flush is scheduled in the finally block.
        syncState.payload = null;
        try {
          const headers = {
            "Content-Type": "application/json",
            "X-Chat-Id": chatId,
          };
          if (baseUpdatedAt > 0) headers["If-Match"] = String(baseUpdatedAt);
          const res = await fetch(`${WORKER_URL}/sync`, {
            method: "POST",
            headers,
            body: JSON.stringify(payload),
          });
          if (res.status === 429) throw new Error("rate-limited");
          if (res.status === 409) {
            await handleSyncConflict(res, payload);
            syncState.lastWriteAt = Date.now();
            syncState.backoffAttempt = 0;
            syncState.firstFailureAt = 0;
            return;
          }
          if (!res.ok) throw new Error(`http-${res.status}`);
          // Parse server's new updatedAt and persist it so subsequent
          // POSTs send the correct If-Match.
          const body = await res.json().catch(() => ({}));
          if (body && typeof body.updatedAt === "number") {
            writeStoredUpdatedAt(body.updatedAt);
          }
          // Only clear pending if it still represents the payload we just
          // sent (a newer edit may have replaced it during the request).
          const stillPending = readPending();
          if (stillPending && stillPending.queuedAt === undefined) {
            // legacy entry — best-effort clear
            clearPending();
          } else if (
            stillPending &&
            JSON.stringify(stillPending.payload) === JSON.stringify(payload)
          ) {
            clearPending();
          }
          syncState.lastWriteAt = Date.now();
          syncState.backoffAttempt = 0;
          syncState.firstFailureAt = 0;
          syncState.conflictAttempt = 0;
        } catch (err) {
          // Restore the latest payload — if a newer one arrived during
          // the request, prefer it; otherwise re-queue what we tried.
          if (!syncState.payload) syncState.payload = payload;
          if (err && err.message === "rate-limited") {
            if (!syncState.firstFailureAt)
              syncState.firstFailureAt = Date.now();
            const persistedFor = Date.now() - syncState.firstFailureAt;
            if (
              persistedFor >= SYNC_429_TOAST_AFTER_MS &&
              Date.now() >= syncState.toastSuppressUntil &&
              syncState.showToast
            ) {
              syncState.showToast("⏱ Sync paused — will retry");
              syncState.toastSuppressUntil =
                Date.now() + SYNC_429_TOAST_SUPPRESS_MS;
              syncState.firstFailureAt = 0;
            }
            const backoffSec = Math.min(
              60,
              Math.pow(2, syncState.backoffAttempt),
            );
            syncState.backoffAttempt++;
            syncState.timer = setTimeout(syncFlush, backoffSec * 1000);
          } else {
            console.warn("Worker sync failed:", err);
            // Generic failures: retry with the same backoff curve as 429
            // so a flaky network doesn't spin in a tight loop.
            const backoffSec = Math.min(
              60,
              Math.pow(2, syncState.backoffAttempt),
            );
            syncState.backoffAttempt++;
            syncState.timer = setTimeout(syncFlush, backoffSec * 1000);
          }
        } finally {
          syncState.sending = false;
          if (syncState.payload && !syncState.timer) {
            syncScheduleFlush();
          }
        }
      }

      // Handle a 409 version-mismatch: the server returns its current
      // snapshot. Apply it locally (overlaying any local-only routines
      // from the payload we just tried to send) and re-mark-dirty so
      // a fresh flush goes out with the new If-Match.
      async function handleSyncConflict(res, sentPayload) {
        let body = null;
        try {
          body = await res.json();
        } catch {
          body = null;
        }
        if (!body || typeof body.updatedAt !== "number") {
          // Malformed 409 — fall back to keeping pending and retrying.
          if (!syncState.payload) syncState.payload = sentPayload;
          syncState.timer = setTimeout(syncFlush, 5000);
          return;
        }
        writeStoredUpdatedAt(body.updatedAt);
        syncState.conflictAttempt = (syncState.conflictAttempt || 0) + 1;
        const serverRoutines = Array.isArray(body.routines)
          ? body.routines
          : [];
        const serverIds = new Set(
          serverRoutines.map((r) => r && r.id).filter(Boolean),
        );
        const sentRoutines = Array.isArray(sentPayload && sentPayload.routines)
          ? sentPayload.routines
          : [];
        const localOnly = sentRoutines.filter(
          (r) => r && r.id && !serverIds.has(r.id),
        );
        const merged = [...serverRoutines, ...localOnly];
        if (typeof syncState.setRoutines === "function") {
          syncState.setRoutines(merged);
        }
        if (
          typeof syncState.setSettings === "function" &&
          body.settings &&
          typeof body.settings === "object"
        ) {
          syncState.setSettings((s) => ({ ...s, ...body.settings }));
        }
        // Only clear pending if it still represents the payload that
        // got the 409 — a fresh edit may have arrived during the
        // request, and that newer payload must survive.
        const stillPending = readPending();
        if (
          stillPending &&
          JSON.stringify(stillPending.payload) === JSON.stringify(sentPayload)
        ) {
          clearPending();
        }
        if (syncState.conflictAttempt >= 3) {
          console.warn("sync: 409 conflict loop, giving up for this cycle");
          syncState.conflictAttempt = 0;
        }
      }

      function syncFlushOnHide() {
        if (!syncState.payload || !syncState.chatId) return;
        // keepalive lets the request outlive the page lifecycle (iOS
        // Safari 13.1+, Chrome, FF). Body cap is ~64 KB across all
        // keepalive requests in flight; our payload is well below that
        // for typical use.
        // We deliberately do NOT clear pendingSync here: keepalive may
        // still drop the request silently, and we can't observe the
        // response after the page unloads. The next cold-start will
        // drain pendingSync (idempotent under last-write-wins).
        const payload = syncState.payload;
        const chatId = syncState.chatId;
        const baseUpdatedAt = readStoredUpdatedAt();
        syncState.payload = null;
        try {
          const headers = {
            "Content-Type": "application/json",
            "X-Chat-Id": chatId,
          };
          if (baseUpdatedAt > 0) headers["If-Match"] = String(baseUpdatedAt);
          fetch(`${WORKER_URL}/sync`, {
            method: "POST",
            headers,
            body: JSON.stringify(payload),
            keepalive: true,
          }).catch(() => {});
          syncState.lastWriteAt = Date.now();
        } catch (err) {
          // If the browser refused keepalive (oversized body), put the
          // payload back so the next online debounce gets it.
          syncState.payload = payload;
        }
      }

      // Cold-start drain: POST any queued pending payload before the
      // GET /sync overwrites local state. Returns a promise that
      // resolves once the drain attempt completes (success or failure).
      async function syncDrainPendingBoot(chatId) {
        const pending = readPending();
        if (!pending || pending.chatId !== chatId) return;
        if (!pending.payload) {
          clearPending();
          return;
        }
        // Stage into syncState so syncFlush picks it up.
        syncState.payload = pending.payload;
        syncState.chatId = chatId;
        try {
          await syncFlush();
        } catch (err) {
          console.warn("boot drain failed:", err && err.message);
        }
      }

      // Public name kept for compatibility with existing call sites.
      function syncFireAndForget(routines, settings, _setSettings, showToast) {
        syncMarkDirty(routines, settings, showToast);
      }

      // Wire hide-time flush exactly once. visibilitychange catches the
      // common "switched apps / locked phone" case on iOS; pagehide and
      // beforeunload are the safety net for true unloads.

      function RoutineIcon({ slug, size = 22, stroke = 1.6 }) {
        const path = ROUTINE_ICON_PATHS[slug] || ROUTINE_ICON_PATHS.clock;
        return html`
          <svg
            width=${size}
            height=${size}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width=${stroke}
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            dangerouslySetInnerHTML=${{ __html: path }}
          ></svg>
        `;
      }

      function normalizeRoutineIcon(raw) {
        if (typeof raw !== "string") return "clock";
        if (ROUTINE_ICON_PATHS[raw]) return raw;
        if (EMOJI_TO_SLUG[raw]) return EMOJI_TO_SLUG[raw];
        // Try base emoji without variation selector
        const stripped = raw.replace(/️/g, "");
        if (EMOJI_TO_SLUG[stripped]) return EMOJI_TO_SLUG[stripped];
        return "clock";
      }

      function Icon({ name, size = 20, stroke = 1.6, className }) {
        const pathHTML = ICON_PATHS[name];
        if (!pathHTML) return null;
        return html`
          <svg
            class=${className}
            width=${size}
            height=${size}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width=${stroke}
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            dangerouslySetInnerHTML=${{ __html: pathHTML }}
          ></svg>
        `;
      }

      // ====================================================================
      // SHEET — swipe-down-to-dismiss from top handle, smooth open/close
      // ====================================================================
      function Sheet({ title, children, onClose, headerLeft }) {
        const [closing, setClosing] = useState(false);
        const [opened, setOpened] = useState(false);
        const sheetRef = useRef(null);
        const dragRef = useRef({
          active: false,
          startY: 0,
          startedAtTop: false,
        });

        const requestClose = useCallback(() => {
          if (closing) return;
          setClosing(true);
          window.setTimeout(() => onClose(), 360);
        }, [closing, onClose]);

        useEffect(() => {
          requestAnimationFrame(() => setOpened(true));
          const onKey = (e) => {
            if (e.key === "Escape") requestClose();
          };
          document.addEventListener("keydown", onKey);
          document.body.style.overflow = "hidden";
          return () => {
            document.removeEventListener("keydown", onKey);
            document.body.style.overflow = "";
          };
        }, [requestClose]);

        function applyTransform(dy, withTransition) {
          const el = sheetRef.current;
          if (!el) return;
          el.style.transition = withTransition ? "" : "none";
          el.style.transform = dy > 0 ? `translate3d(0, ${dy}px, 0)` : "";
          // Backdrop opacity follows drag
          const back = el.parentElement;
          if (back && back.classList.contains("sheet-backdrop")) {
            back.style.opacity = dy > 0 ? Math.max(0.2, 1 - dy / 320) : "";
          }
        }

        function onPointerDown(e) {
          if (closing) return;
          if (e.pointerType === "mouse" && e.button !== 0) return;
          // Only start drag from a non-scrolled sheet (or pointer started above any scroll body).
          const sheetEl = sheetRef.current;
          const scrollTop = sheetEl ? Math.max(0, sheetEl.scrollTop) : 0;
          const startedAtTop = scrollTop <= 0;
          dragRef.current.active = true;
          dragRef.current.startY = e.clientY;
          dragRef.current.startedAtTop = startedAtTop;
          if (e.currentTarget.setPointerCapture) {
            try {
              e.currentTarget.setPointerCapture(e.pointerId);
            } catch (_) {}
          }
          e.stopPropagation();
        }
        function onPointerMove(e) {
          const st = dragRef.current;
          if (!st.active) return;
          const dy = e.clientY - st.startY;
          if (!st.startedAtTop && dy < 6) return; // allow native scroll until at top
          if (dy <= 0) {
            applyTransform(0, false);
            return;
          }
          applyTransform(dy, false);
          e.stopPropagation();
        }
        function onPointerEnd(e) {
          const st = dragRef.current;
          if (!st.active) return;
          st.active = false;
          const dy = Math.max(0, e.clientY - st.startY);
          if (dy > 90) {
            // Animate from the dragged position straight off-screen.
            // The drag wrote inline `transform` + `transition: none`, which would
            // otherwise override the .closing CSS rule and freeze the sheet in place.
            const el = sheetRef.current;
            if (el) {
              el.style.transition = "transform 0.32s var(--ease-out)";
              // Force layout flush so the new transform animates from the current dy.
              void el.offsetHeight;
              el.style.transform = "translate3d(0, 100%, 0)";
            }
            const back = el && el.parentElement;
            if (back && back.classList.contains("sheet-backdrop")) {
              back.style.opacity = "";
            }
            requestClose();
          } else {
            applyTransform(0, true);
          }
        }

        const cls = `sheet-backdrop ${opened && !closing ? "open" : ""} ${closing ? "closing" : ""}`;

        return html`
          <div
            class=${cls}
            onClick=${(e) => e.target === e.currentTarget && requestClose()}
            onPointerDown=${(e) => e.stopPropagation()}
          >
            <div class="sheet" role="dialog" aria-modal="true" ref=${sheetRef}>
              <div
                class="sheet-drag-area"
                onPointerDown=${onPointerDown}
                onPointerMove=${onPointerMove}
                onPointerUp=${onPointerEnd}
                onPointerCancel=${onPointerEnd}
                aria-label="Drag down to close"
              >
                <div class="sheet-handle"></div>
              </div>
              <div
                class="sheet-header"
                onPointerDown=${onPointerDown}
                onPointerMove=${onPointerMove}
                onPointerUp=${onPointerEnd}
                onPointerCancel=${onPointerEnd}
              >
                ${headerLeft || null}
                <h2 class="sheet-title">${title}</h2>
                <button
                  class="sheet-close"
                  onClick=${requestClose}
                  aria-label="Close"
                >
                  <${Icon} name="x" size=${16} stroke=${2.25} />
                </button>
              </div>
              ${children}
            </div>
          </div>
        `;
      }

      function Toast({ msg }) {
        return html`<div class="toast">${msg}</div>`;
      }

      // Smooth controlled accordion (grid-template-rows trick)
      function Accordion({ title, children, defaultOpen = false }) {
        const [open, setOpen] = useState(defaultOpen);
        return html`

      // ----- Filter Chips -----
      function FilterChips({
        typeFilter,
        setTypeFilter,
        statusFilters,
        toggleStatus,
        onClearAll,
      }) {
        const types = [
          ["all", "All"],
          ["routine", "Routines"],
          ["reminder", "Reminders"],
        ];
        // "Today" merged into Overdue (same DUE TODAY pill semantics)
        const statuses = [
          ["overdue", "Overdue"],
          ["soon", "Soon"],
          ["paused", "Paused"],
          ["muted", "Muted"],
        ];
        const hasFilters = typeFilter !== "all" || statusFilters.size > 0;
        return html`
          <div class="home-filter-bar">
            <div
              class="filter-segments segments"
              role="group"
              aria-label="Filter by type"
            >
              ${types.map(
                ([k, label]) => html`
                  <button
                    key=${k}
                    type="button"
                    class=${`segment ${typeFilter === k ? "active" : ""}`}
                    onClick=${() => setTypeFilter(k)}
                    aria-pressed=${typeFilter === k ? "true" : "false"}
                  >
                    ${label}
                  </button>
                `,
              )}
            </div>
            <div class="filter-status">
              <div
                class="filter-status-row"
                role="group"
                aria-label="Filter by status"
              >
                ${statuses.map(
                  ([k, label]) => html`
                    <button
                      key=${k}
                      type="button"
                      class=${`filter-chip secondary ${statusFilters.has(k) ? "active" : ""}`}
                      onClick=${() => toggleStatus(k)}
                      aria-pressed=${statusFilters.has(k) ? "true" : "false"}
                    >
                      ${label}
                    </button>
                  `,
                )}
              </div>
              ${hasFilters &&
              html`
                <button
                  type="button"
                  class="filter-chip clear-chip"
                  onClick=${onClearAll}
                  aria-label="Clear filters"
                  title="Clear filters"
                >
                  <${Icon} name="x" size=${14} stroke=${2.25} />
                </button>
              `}
            </div>
          </div>
        `;
      }

      // ----- Home Header (uses shared PageTitle) -----
      function HomeHeader({ overdueCount, onBell }) {
        const label =
          overdueCount > 0
            ? `Show overdue (${overdueCount})`
            : "Open notifications settings";
        const bell = html`
          <button
            class="home-header-icon"
            onClick=${onBell}
            aria-label=${label}
          >
            <${Icon} name="bell" size=${22} />
            ${overdueCount > 0 &&
            html`<span class="home-header-dot" aria-hidden="true"></span>`}
          </button>
        `;
        return html`<${PageTitle} right=${bell}>The Usual</${PageTitle}>`;
      }

      // ----- Bottom Nav (3 tabs) + floating Add FAB -----
      function BottomNav({ view, onView, hidden }) {
        return html`

            aria-label="Primary"
          >
            <button

              <span class="nav-label">Home</span>

      function FabAdd({ onAdd, hidden }) {
        return html`
          <button
            class=${`fab-add ${hidden ? "hidden" : ""}`}
            onClick=${onAdd}
            aria-label="Add"
          >
