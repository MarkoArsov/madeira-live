      // ====================================================================
      // MAIN APP
      // ====================================================================
      function App() {
        // Initial load with auto-archive
        const [routines, setRoutines] = useState(() => {
          const loaded = loadItems();
          const { items, changed } = runAutoArchive(loaded, new Date());
          if (changed) console.warn(`auto-archived ${changed} reminder(s)`);
          return items;
        });
        const [settings, setSettings] = useState(() => loadSettings());
        const [modal, setModal] = useState(null);
        const [toast, setToast] = useState(null);
        const [calendarMonth, setCalendarMonth] = useState(() => {
          const d = new Date();
          return new Date(d.getFullYear(), d.getMonth(), 1);
        });

        // Home filter state
        const [homeTypeFilter, setHomeTypeFilter] = useState("all");
        const [homeStatusFilters, setHomeStatusFilters] = useState(
          () => new Set(),
        );

        // Persist routines
        useEffect(() => {
          saveItems(routines);
          updateAppBadge(routines);
        }, [routines]);

        // Cold-start: drain any pending write FIRST (so a swipe-close
        // during the previous session doesn't get lost), then pull from
        // worker. Apply remote only if its updatedAt is strictly newer
        // than what we last stored locally and there are no fresh local
        // edits queued during the load window.
        useEffect(() => {
          if (!settings.chatId) return;
          let cancelled = false;
          // Register state setters so 409 conflict path can apply server
          // snapshots back to React.
          syncState.setRoutines = setRoutines;
          syncState.setSettings = setSettings;
          (async () => {
            await syncDrainPendingBoot(settings.chatId);
            if (cancelled) return;
            try {
              const remote = await loadFromWorker(settings.chatId);
              if (cancelled) return;
              if (readPending()) return; // queue refilled mid-flight
              if (localWritesSinceBoot > 0) return;
              const remoteUpdatedAt =
                remote && typeof remote.updatedAt === "number"
                  ? remote.updatedAt
                  : null;
              const localUpdatedAt = readStoredUpdatedAt();
              const shouldApply =
                remoteUpdatedAt === null
                  ? // Server pre-upgrade (no updatedAt yet): preserve
                    // today's behaviour — apply when remote has data.
                    Array.isArray(remote && remote.routines) &&
                    remote.routines.length > 0
                  : remoteUpdatedAt > localUpdatedAt;
              if (!shouldApply) return;
              if (
                remote &&
                Array.isArray(remote.routines) &&
                remote.routines.length > 0
              ) {
                setRoutines(remote.routines);
              }
              if (
                remote &&
                remote.settings &&
                typeof remote.settings === "object" &&
                Object.keys(remote.settings).length > 0
              ) {
                setSettings((s) => ({ ...s, ...remote.settings }));
              }
              if (remoteUpdatedAt !== null) {
                writeStoredUpdatedAt(remoteUpdatedAt);
              }
            } catch {
              // network/timeout: keep local cache
            }
          })();
          return () => {
            cancelled = true;
          };
          // Only on mount: deliberately empty deps.
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        // Persist settings + apply theme
        useEffect(() => {
          saveSettings(settings);
          applyTheme(settings.theme);
        }, [settings]);

        // Re-apply theme when system pref changes (auto mode)
        useEffect(() => {
          if (settings.theme !== "auto") return;
          const mq = window.matchMedia("(prefers-color-scheme: dark)");
          const onChange = () => applyTheme("auto");
          if (typeof mq.addEventListener === "function") {
            mq.addEventListener("change", onChange);
            return () => mq.removeEventListener("change", onChange);
          }
          if (typeof mq.addListener === "function") {
            mq.addListener(onChange);
            return () => mq.removeListener(onChange);
          }
          return undefined;
        }, [settings.theme]);

        // Refresh status when day changes (e.g. PWA was open through midnight)
        // Also auto-archive any reminders whose due date passed.
        useEffect(() => {
          let lastDayKey = toInputDate(new Date());
          const interval = window.setInterval(() => {
            const now = new Date();
            const todayKey = toInputDate(now);
            if (todayKey !== lastDayKey) {
              lastDayKey = todayKey;
              setRoutines((prev) => {
                const { items, changed } = runAutoArchive(prev, now);
                if (changed) {
                  console.warn(`auto-archived ${changed} reminder(s)`);
                  // sync removal so worker stops firing
                  syncFireAndForget(items, settings, setSettings, showToast);
                }
                return items;
              });
            } else {
              setRoutines((prev) => [...prev]); // re-render for "days left"
            }
          }, 60_000);
          return () => window.clearInterval(interval);
        }, [settings]);

        function showToast(msg) {
          setToast(msg);
          window.clearTimeout(window.__rtToast);
          window.__rtToast = window.setTimeout(() => setToast(null), 2800);
        }

        const closeModal = useCallback(() => setModal(null), []);

        const activeRoutine = useMemo(
          () =>
            modal?.routineId
              ? routines.find((r) => r.id === modal.routineId)
              : null,
          [modal, routines],
        );

        // ----- Routine ops -----
        function updateRoutine(updated) {
          let nextRoutines;
          setRoutines((prev) => {
            nextRoutines = prev.map((r) => (r.id === updated.id ? updated : r));
            return nextRoutines;
          });
          syncFireAndForget(nextRoutines, settings, setSettings, showToast);
        }

        function markDone(item, date, note) {
          if (item.type === "reminder") {
            const updated = {
              ...item,
              completedAt: date.toISOString(),
              completionType: "done",
              history: [
                ...(item.history || []),
                { id: id(), date: date.toISOString(), note: note || "" },
              ],
            };
            updateRoutine(updated);
            // Completed reminder is filtered out by buildWorkerPayload, so the
            // sync triggered by updateRoutine is enough to remove it server-side.
            showToast("✓ Marked done");
            closeModal();
            return;
          }
          const updated = {
            ...item,
            snoozedUntil: null,
            cycleAnchorDate: null,
            history: [
              ...item.history,
              { id: id(), date: date.toISOString(), note: note || "" },
            ],
          };
          updateRoutine(updated);
          const next = shiftSkipDays(
            addInterval(date, item.intervalValue, item.intervalUnit),
            item.skipDays,
            item.skipDirection,
          );
          showToast(`✓ Next: ${formatDate(next)}`);
          closeModal();
        }

        function cancelReminder(item) {
          if (!confirm("Cancel this reminder? It will be deleted.")) return;
          let nextRoutines;
          setRoutines((prev) => {
            nextRoutines = prev.filter((r) => r.id !== item.id);
            return nextRoutines;
          });
          syncFireAndForget(nextRoutines, settings, setSettings, showToast);
          showToast("Reminder cancelled");
          setModal(null);
        }

        function addRoutine(data) {
          const isReminder = data.type === "reminder";
          const isTask = data.type === "task";
          let r;
          if (isTask) {
            // Place new tasks at the top of the active list.
            const minRank = routines
              .filter((x) => x.type === "task" && !x.completedAt)
              .reduce(
                (acc, t) =>
                  Math.min(acc, Number.isInteger(t.rank) ? t.rank : 0),
                0,
              );
            r = {
              id: id(),
              ...data,
              type: "task",
              history: [],
              completedAt: data.completedAt || null,
              rank: Number.isInteger(data.rank)
                ? data.rank
                : minRank - RANK_STEP,
              createdAt: new Date().toISOString(),
            };
          } else if (isReminder) {
            r = {
              id: id(),
              ...data,
              history: [],
              completedAt: null,
              completionType: null,
              muted: false,
              createdAt: new Date().toISOString(),
            };
          } else {
            r = {
              id: id(),
              ...data,
              history: [],
              pausedUntil: null,
              snoozedUntil: null,
              dismissedSuggestion: null,
              muted: false,
              createdAt: new Date().toISOString(),
            };
            // If the very first computed due date already lies in the past
            // (e.g. cycleAnchorDate landed in the past after skip-day shift),
            // log a synthetic completion so the cycle advances forward
            // instead of dumping the new routine into Overdue.
            const firstNext = getNextDue(r);
            if (firstNext && daysDiff(new Date(), firstNext) < 0) {
              r.history = [
                {
                  id: id(),
                  date: firstNext.toISOString(),
                  completionType: "missed",
                  note: null,
                },
              ];
              r.cycleAnchorDate = null;
            }
          }
          let nextRoutines;
          setRoutines((prev) => {
            nextRoutines = [...prev, r];
            return nextRoutines;
          });
          syncFireAndForget(nextRoutines, settings, setSettings, showToast);
          showToast(`Added — ${data.name}`);
          closeModal();
        }

        function editRoutine(id_, data) {
          let nextRoutines;
          setRoutines((prev) => {
            nextRoutines = prev.map((r) =>
              r.id === id_ ? { ...r, ...data } : r,
            );
            return nextRoutines;
          });
          syncFireAndForget(nextRoutines, settings, setSettings, showToast);
          showToast("Updated");
          closeModal();
        }

        function deleteRoutine(id_) {
          const item = routines.find((r) => r.id === id_);
          const message =
            item?.type === "task"
              ? "Delete this task?"
              : item?.type === "reminder"
                ? "Delete this reminder?"
                : "Delete this routine and all its history?";
          if (!confirm(message)) return;
          let nextRoutines;
          setRoutines((prev) => {
            nextRoutines = prev.filter((r) => r.id !== id_);
            return nextRoutines;
          });
          syncFireAndForget(nextRoutines, settings, setSettings, showToast);
          showToast("Deleted");
          closeModal();
        }

        function snoozeRoutine(routine, until) {
          updateRoutine({ ...routine, snoozedUntil: until.toISOString() });
          showToast(`Snoozed → ${formatDate(until)}`);
          closeModal();
        }

        // Unified snooze applier from ItemDetailsSheet — handles routines & reminders.
        function applySnooze(routine, opts) {
          const { date, time, applyDateFuture, applyTimeFuture } = opts;
          const dateIso = date.toISOString();
          if (routine.type === "reminder") {
            // Reminders just update dueDate + notifyTime in place.
            const updated = {
              ...routine,
              dueDate: toInputDate(date),
              notifyTime: time || routine.notifyTime,
            };
            updateRoutine(updated);
            showToast(`Reminder → ${formatDate(date)}`);
            return;
          }
          // Routines:
          let updated = { ...routine };
          if (applyDateFuture) {
            updated.cycleAnchorDate = dateIso;
            updated.snoozedUntil = null;
            updated.snoozedTime = null;
          } else {
            updated.snoozedUntil = dateIso;
            // Per-occurrence time when user changed time without applying to future
            if (!applyTimeFuture && time && time !== routine.notifyTime) {
              updated.snoozedTime = time;
            } else {
              updated.snoozedTime = null;
            }
          }
          if (applyTimeFuture && time) {
            updated.notifyTime = time;
          }
          updateRoutine(updated);
          showToast(`Snoozed → ${formatDate(date)}`);
        }

        function pauseRoutine(routine, until) {
          updateRoutine({ ...routine, pausedUntil: until.toISOString() });
          showToast(`Paused → ${formatDate(until)}`);
          closeModal();
        }

        function resumeRoutine(routine) {
          updateRoutine({ ...routine, pausedUntil: null });
          showToast("Resumed");
          closeModal();
        }

        function toggleMute(routine) {
          const updated = { ...routine, muted: !routine.muted };
          updateRoutine(updated);
          showToast(updated.muted ? "🔕 Muted" : "🔔 Unmuted");
        }

        // Inspect both sides at verify time, then choose how to reconcile.
        // Returns { ok: true } on success, or { ok: false, reason } where
        // reason is 'capacity' | 'not-found' | 'cancelled' | 'error'.
        async function verifyChatId(newId) {
          let resolved;
          try {
            resolved = await resolveChatId(newId);
          } catch {
            return { ok: false, reason: "error" };
          }
          if (resolved.atCapacity) return { ok: false, reason: "capacity" };
          if (!resolved.exists) return { ok: false, reason: "not-found" };

          let remote;
          try {
            remote = await loadFromWorker(newId);
          } catch {
            return { ok: false, reason: "error" };
          }
          const serverRoutines = Array.isArray(remote?.routines)
            ? remote.routines
            : [];
          const serverSettings =
            remote?.settings && typeof remote.settings === "object"
              ? remote.settings
              : {};
          const localHasData = routines.length > 0;
          const serverHasData = serverRoutines.length > 0;

          if (!localHasData && !serverHasData) {
            setSettings((s) => ({ ...s, ...serverSettings, chatId: newId }));
            showToast("✓ Chat ID verified");
            return { ok: true };
          }
          if (!localHasData && serverHasData) {
            adoptServer(
              newId,
              serverRoutines,
              serverSettings,
              remote?.updatedAt,
            );
            return { ok: true };
          }
          if (localHasData && !serverHasData) {
            adoptLocal(newId);
            return { ok: true };
          }

          // Both sides have data — let the user decide.
          return await new Promise((resolve) => {
            setModal({
              type: "verify-conflict",
              newId,
              serverRoutines,
              serverSettings,
              localCount: routines.length,
              serverCount: serverRoutines.length,
              onChoose: (choice) => {
                setModal(null);
                if (choice === "server") {
                  adoptServer(
                    newId,
                    serverRoutines,
                    serverSettings,
                    remote?.updatedAt,
                  );
                  resolve({ ok: true });
                } else if (choice === "local") {
                  adoptLocal(newId);
                  resolve({ ok: true });
                } else {
                  resolve({ ok: false, reason: "cancelled" });
                }
              },
            });
          });
        }

        function adoptServer(
          newId,
          serverRoutines,
          serverSettings,
          remoteUpdatedAt,
        ) {
          // Switching to an account whose data we're adopting: drop any
          // pending queue from the prior chatId and treat the server's
          // updatedAt as our new baseline.
          clearPending();
          if (typeof remoteUpdatedAt === "number") {
            writeStoredUpdatedAt(remoteUpdatedAt);
          } else {
            writeStoredUpdatedAt(0);
          }
          setRoutines(serverRoutines);
          setSettings((s) => ({ ...s, ...serverSettings, chatId: newId }));
          showToast("✓ Restored from account");
        }

        function adoptLocal(newId) {
          // Pushing local state up to the new account: clear any
          // pending queue from a prior chatId and reset the version
          // baseline (server response will provide a fresh updatedAt).
          clearPending();
          writeStoredUpdatedAt(0);
          const next = { ...settings, chatId: newId };
          setSettings(next);
          syncToWorker(routines, next)
            .then((res) => {
              if (res && typeof res.updatedAt === "number") {
                writeStoredUpdatedAt(res.updatedAt);
              }
            })
            .catch((err) => console.warn("post-verify sync failed:", err));
          showToast("✓ Chat ID verified");
        }

        function toggleNotifications(enabled) {
          if (!settings.chatId) return;
          const next = { ...settings, notificationsEnabled: enabled };
          setSettings(next);
          syncFireAndForget(routines, next, setSettings, showToast);
        }

        async function testNotificationNow() {
          if (!settings.chatId) {
            showToast("Verify your chat ID first");
            return;
          }
          try {
            const ok = await testNotification(settings.chatId);
            if (ok) showToast("Test sent — check Telegram");
            else showToast("Test failed — try again");
          } catch {
            showToast("Test failed — network error");
          }
        }

        function forgetChatId() {
          setSettings((s) => ({
            ...s,
            chatId: "",
            notificationsEnabled: false,
          }));
          showToast("Chat ID forgotten");
        }

        function acceptSuggestion(routine) {
          const sug = getSuggestion(routine);
          if (!sug) return;
          updateRoutine({
            ...routine,
            intervalValue: sug.suggestedValue,
            intervalUnit: sug.suggestedUnit,
            dismissedSuggestion: null,
          });
          showToast(
            `Interval → ${formatInterval(sug.suggestedValue, sug.suggestedUnit)}`,
          );
        }

        function dismissSuggestion(routine) {
          updateRoutine({ ...routine, dismissedSuggestion: Date.now() });
        }

        // ----- Settings ops -----
        function exportData() {
          const data = JSON.stringify(
            {
              version: SCHEMA_VERSION,
              routines,
              exported: new Date().toISOString(),
            },
            null,
            2,
          );
          const blob = new Blob([data], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `the-usual-${toInputDate(new Date())}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast("Exported");
        }

        function importData(e) {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              const list = Array.isArray(parsed) ? parsed : parsed.routines;
              if (!Array.isArray(list)) throw new Error("Invalid format");
              const valid = list.map(validateRoutine).filter(Boolean);
              if (valid.length === 0) throw new Error("No valid routines");
              if (
                !confirm(
                  `Replace current data with ${valid.length} imported routines?`,
                )
              )
                return;
              setRoutines(valid);
              showToast(`Imported ${valid.length} routines`);
              closeModal();
            } catch (err) {
              const msg = err instanceof Error ? err.message : String(err);
              alert("Could not import file: " + msg);
            }
          };
          reader.readAsText(file);
          e.target.value = ""; // reset
        }

        function resetAll() {
          if (
            !confirm(
              "Delete every routine and its history? This cannot be undone.",
            )
          )
            return;
          if (!confirm("Are you absolutely sure? Last chance.")) return;
          setRoutines(seedRoutines());
          showToast("Reset complete");
          closeModal();
        }

        // ----- Sorting -----
        const sortedRoutines = useMemo(() => {
          const order = { overdue: 0, due: 1, soon: 2, ok: 3, paused: 4 };
          return [...routines].sort((a, b) => {
            const aS = getStatus(a);
            const bS = getStatus(b);
            const aO = order[aS.state] ?? 5;
            const bO = order[bS.state] ?? 5;
            if (aO !== bO) return aO - bO;
            if (aS.state === "overdue") return bS.days - aS.days;
            return aS.days - bS.days;
          });
        }, [routines]);

        // ----- Suggestions to surface -----
        const suggestions = useMemo(
          () =>
            routines
              .map((r) => ({ routine: r, suggestion: getSuggestion(r) }))
              .filter((x) => x.suggestion)
              .slice(0, 1),
          [routines],
        );

        // ----- View state (Home / Calendar / Settings as horizontal pages) -----
        const [view, setView] = useState("home");
        const pageTrackRef = useRef(null);
        const pageDragRef = useRef({
          active: false,
          startX: 0,
          startY: 0,
          locked: null,
          width: 0,
          pointerId: null,
          pendingDx: 0,
          rafQueued: false,
          samples: [],
        });

        const VIEW_INDEX = { home: 0, tasks: 1, calendar: 2, settings: 3 };
        const VIEW_ORDER = ["home", "tasks", "calendar", "settings"];
        const viewIndex = VIEW_INDEX[view];

        function navTo(target) {
          setView(target);
        }

        // Asymptotic rubber-band: at edges the visual drift caps at ~MAX_RUBBER px.
        // r(dx) = sign(dx) * (|dx| / (1 + |dx| / MAX_RUBBER))
        const MAX_RUBBER = 56;
        function rubberBand(dx) {
          const a = Math.abs(dx);
          return Math.sign(dx) * (a / (1 + a / MAX_RUBBER));
        }

        function flushTrackTransform() {
          const st = pageDragRef.current;
          st.rafQueued = false;
          // If the drag already ended (release/cancel), don't write a stale value.
          if (!st.active || st.locked !== "x") return;
          const el = pageTrackRef.current;
          if (!el) return;
          el.style.transition = "none";
          el.style.transform = `translate3d(calc(${-viewIndex * 25}% + ${st.pendingDx}px), 0, 0)`;
        }

        function onPagePointerDown(e) {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          const st = pageDragRef.current;
          st.active = true;
          st.startX = e.clientX;
          st.startY = e.clientY;
          st.locked = null;
          st.width = e.currentTarget.getBoundingClientRect().width;
          st.pointerId = e.pointerId;
          st.pendingDx = 0;
          st.samples = [{ x: e.clientX, t: performance.now() }];
        }
        function onPagePointerMove(e) {
          const st = pageDragRef.current;
          if (!st.active) return;
          const dx = e.clientX - st.startX;
          const dy = e.clientY - st.startY;
          if (st.locked === null) {
            if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return;
            if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) >= 14) {
              st.locked = "x";
              if (e.currentTarget.setPointerCapture) {
                try {
                  e.currentTarget.setPointerCapture(st.pointerId);
                } catch (_) {}
              }
              if (pageTrackRef.current)
                pageTrackRef.current.classList.add("dragging");
            } else {
              st.locked = "y";
            }
          }
          if (st.locked === "x") {
            if (e.cancelable) e.preventDefault();
            const atLeftEdge = view === "home" && dx > 0;
            const atRightEdge = view === "settings" && dx < 0;
            // (settings remains the rightmost tab.)
            const val = atLeftEdge || atRightEdge ? rubberBand(dx) : dx;
            st.pendingDx = val;
            // Sample for velocity (last ~120 ms)
            const now = performance.now();
            st.samples.push({ x: e.clientX, t: now });
            while (st.samples.length > 1 && now - st.samples[0].t > 120)
              st.samples.shift();
            if (!st.rafQueued) {
              st.rafQueued = true;
              requestAnimationFrame(flushTrackTransform);
            }
          }
        }
        function snapTrackToView() {
          const el = pageTrackRef.current;
          if (!el) return;
          el.style.transition = "";
          el.style.transform = `translate3d(${-viewIndex * 25}%, 0, 0)`;
        }
        function onPagePointerEnd(e) {
          const st = pageDragRef.current;
          if (!st.active) return;
          const wasX = st.locked === "x";
          st.active = false;
          st.locked = null;
          if (pageTrackRef.current)
            pageTrackRef.current.classList.remove("dragging");
          if (!wasX) {
            return;
          }
          const dx = e.clientX - st.startX;
          const w = st.width || 320;
          // Velocity (px/ms) over last samples
          let velocity = 0;
          if (st.samples.length >= 2) {
            const first = st.samples[0];
            const last = st.samples[st.samples.length - 1];
            const dt = Math.max(1, last.t - first.t);
            velocity = (last.x - first.x) / dt;
          }
          const flick = Math.abs(velocity) > 0.4;
          const threshold = w * 0.22;
          let nextView = view;
          if (
            (dx < -threshold || (flick && velocity < 0)) &&
            viewIndex < VIEW_ORDER.length - 1
          )
            nextView = VIEW_ORDER[viewIndex + 1];
          else if ((dx > threshold || (flick && velocity > 0)) && viewIndex > 0)
            nextView = VIEW_ORDER[viewIndex - 1];
          if (nextView !== view) {
            setView(nextView);
          } else {
            // Snap back to current view (covers edge rubber-band releases too)
            snapTrackToView();
          }
        }

        // Reset inline style after view changes so the natural CSS transition takes over
        useEffect(() => {
          const el = pageTrackRef.current;
          if (!el) return;
          el.style.transition = "";
          el.style.transform = `translate3d(${-viewIndex * 25}%, 0, 0)`;
        }, [viewIndex]);

        // ----- Render -----
        return html`
    <div
      class="pages"
      onPointerDown=${onPagePointerDown}
      onPointerMove=${onPagePointerMove}
      onPointerUp=${onPagePointerEnd}
      onPointerCancel=${onPagePointerEnd}
    >
      <div ref=${(el) => {
        pageTrackRef.current = el;
      }} class="pages-track">
        <!-- Home page -->
        <div class="page">
          <${HomeView}
            routines=${routines.filter((r) => r.type !== "task")}
            suggestions=${suggestions}
            typeFilter=${homeTypeFilter}
            setTypeFilter=${setHomeTypeFilter}
            statusFilters=${homeStatusFilters}
            toggleStatus=${(k) =>
              setHomeStatusFilters((s) => {
                const next = new Set(s);
                if (next.has(k)) next.delete(k);
                else next.add(k);
                return next;
              })}
            onDone=${(rt) => setModal({ type: "done", routineId: rt.id })}
            onMenu=${(rt) => setModal({ type: "details", routineId: rt.id })}
            onSnooze=${(rt) => setModal({ type: "details", routineId: rt.id, subview: "snooze" })}
            onAccept=${acceptSuggestion}
            onDismiss=${dismissSuggestion}
            onBell=${(overdueCount) => {
              if (overdueCount === 0) {
                setView("settings");
                return;
              }
              const onlyOverdueActive =
                homeTypeFilter === "all" &&
                homeStatusFilters.size === 1 &&
                homeStatusFilters.has("overdue");
              if (onlyOverdueActive) {
                setHomeStatusFilters(new Set());
              } else {
                setHomeStatusFilters((prev) => {
                  if (prev.has("overdue")) return prev;
                  const next = new Set(prev);
                  next.add("overdue");
                  return next;
                });
              }
              const target =
                document.scrollingElement || document.documentElement;
              if (target && typeof target.scrollTo === "function") {
                target.scrollTo({ top: 0, behavior: "smooth" });
              } else {
                window.scrollTo({ top: 0, behavior: "smooth" });
              }
            }}
          />
        </div>
        <!-- Tasks page -->
        <div class="page">
          <${TasksView}
            tasks=${routines.filter((r) => r.type === "task")}
            onCreate=${(task) => {
              setRoutines((prev) => {
                const next = [...prev, task];
                syncFireAndForget(next, settings, setSettings, showToast);
                return next;
              });
            }}
            onUpdate=${updateRoutine}
            onOpen=${(t) => setModal({ type: "details", routineId: t.id })}
            onReorder=${(updatedTasks) => {
              setRoutines((prev) => {
                const map = new Map(updatedTasks.map((t) => [t.id, t]));
                const next = prev.map((r) =>
                  map.has(r.id) ? map.get(r.id) : r,
                );
                syncFireAndForget(next, settings, setSettings, showToast);
                return next;
              });
            }}
          />
        </div>
        <!-- Calendar page -->
        <div class="page">
          <${PageTitle} icon=${html`<${PageIcon} name="calendar" />`}>Calendar</${PageTitle}>
          <div style="padding: 7px 22px">
            <${CalendarView}
              routines=${routines.filter((r) => r.type !== "task")}
              month=${calendarMonth}
              setMonth=${setCalendarMonth}
              onOpenItem=${(rid) => setModal({ type: "details", routineId: rid })}
            />
          </div>
        </div>
        <!-- Settings page -->
        <div class="page">
          <${SettingsView}
            settings=${settings}
            routines=${routines}
            onChangeTheme=${(t) => setSettings((s) => ({ ...s, theme: t }))}
            onExport=${exportData}
            onImport=${importData}
            onReset=${resetAll}
            onVerifyChatId=${verifyChatId}
            onToggleNotifications=${toggleNotifications}
            onTestNotification=${testNotificationNow}
            onForgetChatId=${forgetChatId}
          />
        </div>
      </div>
    </div>

    <div class="footer-cluster">
      <${BottomNav}
        view=${view}
        onView=${navTo}
        hidden=${!!modal}
      />
      <${FabAdd}
        onAdd=${() => {
          // Always open the creation modal with the kind-tabs at the top
          // — no separate chooser sheet. The default tab is biased to the
          // current page so the most likely kind is preselected.
          const defaultType =
            view === "tasks"
              ? "task"
              : view === "calendar"
                ? "reminder"
                : "routine";
          setModal({ type: "add", initialType: defaultType });
        }}
        hidden=${!!modal}
      />
    </div>

    ${
      modal?.type === "add" &&
      html`
        <${RoutineFormModal}
          onClose=${closeModal}
          onSave=${addRoutine}
          initialType=${modal.initialType}
        />
      `
    }
    ${
      modal?.type === "kindChooser" &&
      html`
        <${KindChooserSheet}
          onClose=${closeModal}
          kinds=${modal.kinds}
          onChoose=${(kind) => setModal({ type: "add", initialType: kind })}
        />
      `
    }
    ${
      modal?.type === "done" &&
      activeRoutine &&
      html`
        <${DoneModal}
          routine=${activeRoutine}
          onClose=${closeModal}
          onConfirm=${(date, note) => markDone(activeRoutine, date, note)}
        />
      `
    }
    ${
      (modal?.type === "menu" || modal?.type === "details") &&
      activeRoutine &&
      html`
        <${ItemDetailsSheet}
          key=${activeRoutine.id}
          routine=${activeRoutine}
          initialSubview=${modal.subview || "home"}
          onClose=${closeModal}
          onUpdate=${updateRoutine}
          onSaveEdit=${(data) => {
            setRoutines((prev) => {
              const next = prev.map((r) =>
                r.id === activeRoutine.id ? { ...r, ...data } : r,
              );
              syncFireAndForget(next, settings, setSettings, showToast);
              return next;
            });
            showToast("Updated");
          }}
          onDelete=${() => deleteRoutine(activeRoutine.id)}
          onCancelReminder=${() => cancelReminder(activeRoutine)}
          onToggleMute=${(rt) => {
            toggleMute(rt);
          }}
          onAddGoogleCalendar=${(rt) => {
            window.open(
              googleCalendarUrl(rt, getNextDue(rt)),
              "_blank",
              "noopener",
            );
            showToast("Opening Google Calendar");
          }}
          onSnoozeApply=${applySnooze}
          onPause=${(rt, date) => {
            updateRoutine({ ...rt, pausedUntil: date.toISOString() });
            showToast(`Paused → ${formatDate(date)}`);
          }}
          onResume=${(rt) => {
            updateRoutine({ ...rt, pausedUntil: null });
            showToast("Resumed");
          }}
          onConvertToReminder=${(rt, date, time) => {
            const updated = {
              ...rt,
              type: "reminder",
              dueDate: date,
              notifyTime: time,
              onOverdue: rt.onOverdue || "archive",
              completedAt: null,
              completionType: null,
              muted: !!rt.muted,
              rank: undefined,
            };
            updateRoutine(updated);
            showToast("Now a reminder");
          }}
          onConvertToTask=${(rt) => {
            // Compute end-of-active rank.
            const maxRank = routines
              .filter(
                (x) => x.type === "task" && !x.completedAt && x.id !== rt.id,
              )
              .reduce(
                (acc, t) =>
                  Math.max(acc, Number.isInteger(t.rank) ? t.rank : 0),
                0,
              );
            const updated = {
              ...rt,
              type: "task",
              rank: maxRank + RANK_STEP,
              completedAt: null,
              completionType: null,
              dueDate: undefined,
              notifyTime: undefined,
              onOverdue: undefined,
            };
            updateRoutine(updated);
            showToast("Now a task");
          }}
        />
      `
    }
    ${
      modal?.type === "verify-conflict" &&
      html`
        <${VerifyConflictModal}
          localCount=${modal.localCount}
          serverCount=${modal.serverCount}
          onChoose=${modal.onChoose}
        />
      `
    }
    ${toast && html`<${Toast} msg=${toast} />`}
  `;
      }

      // Apply theme immediately to avoid flash
      applyTheme(loadSettings().theme);

      render(html`<${App} />`, document.getElementById("app"));

      // Register service worker (optional, for offline)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
