      // ----- Calendar View (inline, single popup, internal nav) -----
      // Monday-first column index helper. Sunday=0 → col 6; Monday=1 → col 0; etc.
      const CAL_DOW_HEADERS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      function colIndex(date) {
        return (date.getDay() + 6) % 7;
      }

      function buildMonthCells(monthStart) {
        const monthEnd = new Date(
          monthStart.getFullYear(),
          monthStart.getMonth() + 1,
          0,
        );
        monthEnd.setHours(23, 59, 59, 999);
        const firstCol = colIndex(monthStart);
        const daysInMonth = monthEnd.getDate();
        const arr = [];
        for (let i = 0; i < firstCol; i++) arr.push(null);
        for (let d = 1; d <= daysInMonth; d++)
          arr.push(
            new Date(monthStart.getFullYear(), monthStart.getMonth(), d),
          );
        while (arr.length % 7 !== 0) arr.push(null);
        return { cells: arr, monthEnd };
      }

      function MonthGrid({
        monthStart,
        datesByDay,
        todayKey,
        selectedKey,
        onPick,
      }) {
        const { cells } = useMemo(
          () => buildMonthCells(monthStart),
          [monthStart],
        );
        return html`
          <div class="cal-grid">
            ${cells.map((d, i) => {
              if (!d)
                return html`<div key=${`e${i}`} class="cal-cell empty"></div>`;
              const key = toInputDate(d);
              const items = datesByDay.get(key) || [];
              const isToday = key === todayKey;
              const isSelected = key === selectedKey;
              return html`
                <button
                  key=${key}
                  type="button"
                  class=${`cal-cell ${isToday ? "today" : ""} ${isSelected ? "selected" : ""} ${items.length ? "has-items" : ""}`}
                  onClick=${() => onPick(d)}
                  aria-label=${`${formatDate(d)}${items.length ? `, ${items.length} item${items.length === 1 ? "" : "s"}` : ""}`}
                  aria-pressed=${isSelected ? "true" : "false"}
                >
                  <span class="cal-num">${d.getDate()}</span>
                  ${items.length > 0 &&
                  html`
                    <div class="cal-dots">
                      ${items.slice(0, 3).map((it, idx) => {
                        const c = colorForRoutine(it.routine.id);
                        const style =
                          it.type === "past"
                            ? `background:${c}; border-color:${c}`
                            : `background:${c}; border-color:${c}; opacity:0.5`;
                        return html`<span
                          key=${idx}
                          class=${`cal-d ${it.type}`}
                          style=${style}
                        ></span>`;
                      })}
                      ${items.length > 3 &&
                      html`<span class="cal-more">+${items.length - 3}</span>`}
                    </div>
                  `}
                </button>
              `;
            })}
          </div>
        `;
      }

      const ONLY_THIS_MONTH_KEY = "calendarOnlyThisMonth";
      function CalendarView({ routines, month, setMonth, onOpenItem }) {
        const [hidden, setHidden] = useState(() => new Set());
        const [selectedKey, setSelectedKey] = useState(null);
        const [dragX, setDragX] = useState(0);
        const [dragging, setDragging] = useState(false);
        const [committing, setCommitting] = useState(false); // animating to ±w before swap
        const [panelOpen, setPanelOpen] = useState(false);
        const [onlyThisMonth, setOnlyThisMonth] = useState(
          () => safeStorageGet(ONLY_THIS_MONTH_KEY) === "1",
        );
        function toggleOnlyThisMonth() {
          setOnlyThisMonth((prev) => {
            const next = !prev;
            safeStorageSet(ONLY_THIS_MONTH_KEY, next ? "1" : "0");
            return next;
          });
        }
        const dragRef = useRef({
          active: false,
          startX: 0,
          startY: 0,
          locked: null,
          width: 0,
          captured: null,
        });
        const trackRef = useRef(null);
        const viewportRef = useRef(null);
        const activeMonthRef = useRef(null);

        // Lock the viewport's height to the active month's grid so that
        // months with fewer weeks don't reserve a phantom row of empty space.
        // Measure `.cal-grid` directly — `.cal-month` is a flex child and
        // stretches to the tallest sibling, so its height is misleading.
        useEffect(() => {
          const measure = () => {
            const m = activeMonthRef.current;
            const v = viewportRef.current;
            if (!m || !v) return;
            const grid = m.querySelector(".cal-grid");
            if (!grid) return;
            const h = grid.offsetHeight;
            if (h > 0) v.style.height = h + "px";
          };
          // Two rAFs — first lets layout flush, second runs after styles applied.
          let raf1 = requestAnimationFrame(() => {
            raf1 = requestAnimationFrame(measure);
          });
          window.addEventListener("resize", measure);
          return () => {
            cancelAnimationFrame(raf1);
            window.removeEventListener("resize", measure);
          };
        }, [month, routines]);

        // Pre-compute three months: prev, current, next, for swipe paging
        const months = useMemo(
          () => [
            new Date(month.getFullYear(), month.getMonth() - 1, 1),
            month,
            new Date(month.getFullYear(), month.getMonth() + 1, 1),
          ],
          [month],
        );

        const visibleIds = routines
          .filter((r) => !hidden.has(r.id))
          .map((r) => r.id)
          .join(",");

        const datesByDay = useMemo(() => {
          const map = new Map();
          const rangeStart = new Date(
            months[0].getFullYear(),
            months[0].getMonth(),
            1,
          );
          const rangeEnd = new Date(
            months[2].getFullYear(),
            months[2].getMonth() + 1,
            0,
          );
          rangeEnd.setHours(23, 59, 59, 999);
          for (const r of routines) {
            if (hidden.has(r.id)) continue;
            const dates = getRoutineDatesInRange(r, rangeStart, rangeEnd);
            for (const d of dates) {
              const key = toInputDate(d.date);
              if (!map.has(key)) map.set(key, []);
              map.get(key).push({ ...d, routine: r });
            }
          }
          return map;
        }, [months, visibleIds, routines]);

        // Items that have at least one occurrence within the active month.
        const monthlyVisibleIds = useMemo(() => {
          const start = new Date(month.getFullYear(), month.getMonth(), 1);
          const end = new Date(month.getFullYear(), month.getMonth() + 1, 0);
          end.setHours(23, 59, 59, 999);
          const set = new Set();
          for (const r of routines) {
            if (getItemDatesInRange(r, start, end).length > 0) set.add(r.id);
          }
          return set;
        }, [month, routines]);

        // Active items (exclude completed reminders) for legend + panel listing.
        const activeRoutines = useMemo(
          () =>
            routines.filter((r) => !(r.type === "reminder" && r.completedAt)),
          [routines],
        );
        const legendItems = useMemo(
          () =>
            onlyThisMonth
              ? activeRoutines.filter((r) => monthlyVisibleIds.has(r.id))
              : activeRoutines,
          [activeRoutines, monthlyVisibleIds, onlyThisMonth],
        );

        const allHidden =
          legendItems.length > 0 && legendItems.every((r) => hidden.has(r.id));
        const noneHidden = legendItems.every((r) => !hidden.has(r.id));
        function showAll() {
          setHidden((prev) => {
            const next = new Set(prev);
            for (const r of legendItems) next.delete(r.id);
            return next;
          });
        }
        function hideAll() {
          setHidden((prev) => {
            const next = new Set(prev);
            for (const r of legendItems) next.add(r.id);
            return next;
          });
        }

        const todayKey = toInputDate(new Date());
        const monthLabel = month.toLocaleDateString(undefined, {
          month: "long",
          year: "numeric",
        });

        const selectedDate = selectedKey ? fromInputDate(selectedKey) : null;
        const selectedItems = selectedKey
          ? datesByDay.get(selectedKey) || []
          : [];

        function toggleFilter(rid) {
          setHidden((h) => {
            const next = new Set(h);
            if (next.has(rid)) next.delete(rid);
            else next.add(rid);
            return next;
          });
        }
        function pickDay(d) {
          const k = toInputDate(d);
          setSelectedKey((prev) => (prev === k ? null : k));
        }

        // Animated commit: slide track to ±w, then swap month and snap back without animation
        const commitShift = useCallback(
          (delta) => {
            if (committing) return;
            const w =
              dragRef.current.width ||
              (trackRef.current
                ? trackRef.current.parentElement.getBoundingClientRect().width
                : 320);
            dragRef.current.width = w;
            setCommitting(true);
            setSelectedKey(null);
            // Animate to the target offset
            setDragX(delta < 0 ? w : -w); // delta = -1 means show prev month (slide right), so track goes to +w
            window.setTimeout(() => {
              // Swap month, then immediately disable transition and snap drag offset to 0
              setDragging(true); // turns off transition for the snap
              setMonth(
                (m) => new Date(m.getFullYear(), m.getMonth() + delta, 1),
              );
              setDragX(0);
              // Re-enable transition next frame
              requestAnimationFrame(() =>
                requestAnimationFrame(() => {
                  setDragging(false);
                  setCommitting(false);
                }),
              );
            }, 420);
          },
          [committing],
        );

        function shiftMonth(delta) {
          commitShift(delta);
        }
        function toToday() {
          const d = new Date();
          const target = new Date(d.getFullYear(), d.getMonth(), 1);
          if (target.getTime() === month.getTime()) return;
          const diff =
            (target.getFullYear() - month.getFullYear()) * 12 +
            (target.getMonth() - month.getMonth());
          if (Math.abs(diff) === 1) {
            commitShift(diff);
          } else {
            setSelectedKey(null);
            setMonth(target);
          }
        }

        // Swipe handlers — defer pointer capture until x lock so cell clicks still fire.
        // Stop propagation so page-level swipe never sees these events.
        function onPointerDown(e) {
          if (committing) return;
          if (e.pointerType === "mouse" && e.button !== 0) return;
          e.stopPropagation();
          const target = e.currentTarget;
          dragRef.current.active = true;
          dragRef.current.startX = e.clientX;
          dragRef.current.startY = e.clientY;
          dragRef.current.locked = null;
          dragRef.current.width = target.getBoundingClientRect().width;
          dragRef.current.captured = null;
          dragRef.current.pointerId = e.pointerId;
          dragRef.current.target = target;
        }
        function onPointerMove(e) {
          if (!dragRef.current.active) return;
          const dx = e.clientX - dragRef.current.startX;
          const dy = e.clientY - dragRef.current.startY;
          if (dragRef.current.locked === null) {
            if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
              dragRef.current.locked = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
              if (dragRef.current.locked === "x") {
                // Now hijack pointer: capture, prevent click, start dragging visuals
                if (dragRef.current.target.setPointerCapture) {
                  try {
                    dragRef.current.target.setPointerCapture(
                      dragRef.current.pointerId,
                    );
                    dragRef.current.captured = true;
                  } catch (_) {}
                }
                setDragging(true);
              }
            }
          }
          if (dragRef.current.locked === "x") {
            e.stopPropagation();
            if (e.cancelable) e.preventDefault();
            setDragX(dx);
          }
        }
        function onPointerEnd(e) {
          if (!dragRef.current.active) return;
          const wasX = dragRef.current.locked === "x";
          const dx = e.clientX - dragRef.current.startX;
          dragRef.current.active = false;
          e.stopPropagation();
          if (!wasX) {
            return;
          }
          setDragging(false);
          const w = dragRef.current.width || 320;
          const threshold = w * 0.22;
          if (dx > threshold) {
            // Animate the rest of the way then commit
            setDragX(w);
            window.setTimeout(() => {
              setDragging(true);
              setMonth((m) => new Date(m.getFullYear(), m.getMonth() - 1, 1));
              setSelectedKey(null);
              setDragX(0);
              requestAnimationFrame(() =>
                requestAnimationFrame(() => setDragging(false)),
              );
            }, 320);
          } else if (dx < -threshold) {
            setDragX(-w);
            window.setTimeout(() => {
              setDragging(true);
              setMonth((m) => new Date(m.getFullYear(), m.getMonth() + 1, 1));
              setSelectedKey(null);
              setDragX(0);
              requestAnimationFrame(() =>
                requestAnimationFrame(() => setDragging(false)),
              );
            }, 320);
          } else {
            setDragX(0);
          }
        }

        // Track is centered at translateX(-100%); during drag we offset by dragX px.
        const trackStyle = `transform: translate3d(calc(-100% + ${dragX}px), 0, 0)`;

        const dayHeading = selectedDate
          ? selectedDate.toLocaleDateString(undefined, {
              weekday: "long",
              month: "long",
              day: "numeric",
            })
          : "";

        return html`
          <div>
            <div class="cal-nav">
              <button
                class="cal-nav-btn"
                onClick=${() => shiftMonth(-1)}
                aria-label="Previous month"
              >
                <${Icon} name="chevLeft" size=${18} />
              </button>
              <div class="cal-nav-month">${monthLabel}</div>
              <button class="cal-nav-today" onClick=${toToday}>Today</button>
              <button
                class="cal-nav-btn"
                onClick=${() => shiftMonth(1)}
                aria-label="Next month"
              >
                <${Icon} name="chevRight" size=${18} />
              </button>
            </div>
            ${activeRoutines.length > 0 &&
            html`
              <div class="cal-legend-wrap">
                <div
                  class="cal-legend"
                  onPointerDown=${(e) => e.stopPropagation()}
                >
                  ${legendItems.map(
                    (r) => html`
                      <button
                        key=${r.id}
                        type="button"
                        class=${`cal-chip ${hidden.has(r.id) ? "off" : ""}`}
                        onClick=${() => toggleFilter(r.id)}
                        aria-pressed=${hidden.has(r.id) ? "false" : "true"}
                      >
                        <span
                          class="cal-dot"
                          style=${`background:${colorForRoutine(r.id)}`}
                        ></span>
                        <span
                          style="display:inline-flex; align-items:center; gap:6px"
                        >
                          ${r.type === "reminder"
                            ? html`<${Icon} name="calendar" size=${12} />`
                            : html`<${RoutineIcon}
                                slug=${r.icon}
                                size=${14}
                              />`}
                          ${r.name}
                        </span>
                      </button>
                    `,
                  )}
                  <button
                    type="button"
                    class=${`cal-chip cal-legend-more ${panelOpen ? "open" : ""}`}
                    onClick=${() => setPanelOpen((o) => !o)}
                    aria-expanded=${panelOpen ? "true" : "false"}
                    aria-label="More legend options"
                  >
                    <span class="cal-legend-more-chev">
                      <${Icon} name="chevDown" size=${12} stroke=${2} />
                    </span>
                    More
                  </button>
                </div>
                <div class=${`cal-legend-panel ${panelOpen ? "open" : ""}`}>
                  <div class="cal-legend-panel-inner">
                    <div class="cal-legend-panel-card">
                      <div class="cal-legend-panel-actions">
                        <button
                          type="button"
                          class="cal-legend-action"
                          onClick=${showAll}
                          disabled=${noneHidden}
                        >
                          Show all
                        </button>
                        <button
                          type="button"
                          class="cal-legend-action"
                          onClick=${hideAll}
                          disabled=${allHidden}
                        >
                          Hide all
                        </button>
                      </div>
                      ${legendItems.length === 0
                        ? html`
                            <div class="cal-legend-empty">
                              No items due this month.
                            </div>
                          `
                        : html`
                            <div class="cal-legend-rows">
                              ${legendItems.map((r) => {
                                const visible = !hidden.has(r.id);
                                return html`
                                  <div key=${r.id} class="legend-row">
                                    <span
                                      class="legend-row-icon"
                                      style=${`background:${colorForRoutine(r.id)}`}
                                    >
                                      ${r.type === "reminder"
                                        ? html`<${Icon}
                                            name="calendar"
                                            size=${14}
                                          />`
                                        : html`<${RoutineIcon}
                                            slug=${r.icon}
                                            size=${16}
                                          />`}
                                    </span>
                                    <span class="legend-row-name"
                                      >${r.name}</span
                                    >
                                    <button
                                      class=${`toggle-switch ${visible ? "on" : ""}`}
                                      role="switch"
                                      aria-checked=${visible ? "true" : "false"}
                                      aria-label=${`Toggle ${r.name}`}
                                      onClick=${() => toggleFilter(r.id)}
                                    ></button>
                                  </div>
                                `;
                              })}
                            </div>
                          `}
                      <div class="setting-row cal-legend-only-month">
                        <div>
                          <div class="setting-label">Only this month</div>
                          <div class="setting-sub">
                            Limit the legend to items due in ${monthLabel}
                          </div>
                        </div>
                        <button
                          class=${`toggle-switch ${onlyThisMonth ? "on" : ""}`}
                          role="switch"
                          aria-checked=${onlyThisMonth ? "true" : "false"}
                          aria-label="Only this month"
                          onClick=${toggleOnlyThisMonth}
                        ></button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            `}
            <div class="cal-grid-head">
              ${CAL_DOW_HEADERS.map(
                (d) => html`<div key=${d} class="cal-dow">${d}</div>`,
              )}
            </div>
            <div
              class="cal-viewport"
              ref=${(el) => {
                viewportRef.current = el;
              }}
              onPointerDown=${onPointerDown}
              onPointerMove=${onPointerMove}
              onPointerUp=${onPointerEnd}
              onPointerCancel=${onPointerEnd}
            >
              <div
                ref=${(el) => {
                  trackRef.current = el;
                }}
                class=${`cal-track ${dragging ? "dragging" : ""}`}
                style=${trackStyle}
              >
                ${months.map(
                  (m, i) => html`
                    <div
                      key=${`${m.getFullYear()}-${m.getMonth()}`}
                      class="cal-month"
                      ref=${i === 1
                        ? (el) => {
                            activeMonthRef.current = el;
                          }
                        : null}
                    >
                      <${MonthGrid}
                        monthStart=${m}
                        datesByDay=${datesByDay}
                        todayKey=${todayKey}
                        selectedKey=${i === 1 ? selectedKey : null}
                        onPick=${i === 1 ? pickDay : () => {}}
                      />
                    </div>
                  `,
                )}
              </div>
            </div>

            <div class=${`cal-day-panel ${selectedKey ? "open" : ""}`}>
              <div class="cal-day-panel-inner">
                <div class="cal-day-panel-head">
                  <div class="cal-day-panel-title">${dayHeading}</div>
                  <button
                    class="btn-ghost"
                    onClick=${() => setSelectedKey(null)}
                    aria-label="Close day"
                  >
                    <${Icon} name="x" size=${14} stroke=${2.25} />
                  </button>
                </div>
                ${selectedItems.length === 0
                  ? html`<div class="cal-day-empty">Nothing on this day.</div>`
                  : html`
                      <div class="menu">
                        ${selectedItems.map(
                          (it, i) => html`
                            <button
                              type="button"
                              key=${i}
                              class="menu-item"
                              style="align-items:flex-start; text-align:left; width:100%;"
                              onClick=${() => onOpenItem(it.routine.id)}
                            >
                              <span class="menu-item-icon">
                                <${RoutineIcon}
                                  slug=${it.routine.icon}
                                  size=${20}
                                />
                              </span>
                              <div class="menu-item-text">
                                ${it.routine.name}
                                <div class="menu-item-sub">
                                  ${(() => {
                                    const timePart =
                                      it.type === "past"
                                        ? hhmmOf(it.date)
                                        : it.routine.notifyTime || null;
                                    const when = formatDateTime(it.date, {
                                      time: timePart,
                                      todayShort: true,
                                    });
                                    const prefix =
                                      it.routine.type === "reminder"
                                        ? it.type === "past"
                                          ? it.routine.completedAt
                                            ? "logged"
                                            : "past"
                                          : "reminder"
                                        : it.type === "past"
                                          ? "logged"
                                          : "predicted";
                                    return `${prefix} · ${when}`;
                                  })()}
                                </div>
                                ${it.note &&
                                html`<div
                                  class="history-note"
                                  style="margin-top:4px"
                                >
                                  "${it.note}"
                                </div>`}
                              </div>
                              <span class="menu-item-chev"
                                ><${Icon} name="chevRight" size=${16}
                              /></span>
                            </button>
                          `,
                        )}
                      </div>
                    `}
              </div>
            </div>

            <div
              class="field-helper"
              style="margin-top:14px; text-align:center"
            >
              Solid dot = logged · Translucent dot = predicted · Swipe to change
              month
            </div>
          </div>
        `;
      }

      // ----- Home View (active items list with filters, sectioning) -----
      // Buckets: Overdue, Today (due), This week (soon), Later (ok), Paused
      const HOME_SECTIONS = [
        { key: "overdue", label: "Overdue", states: ["overdue"] },
        { key: "today", label: "Today", states: ["due"] },
        { key: "week", label: "This week", states: ["soon"] },
        { key: "later", label: "Later", states: ["ok"] },
        { key: "paused", label: "Paused", states: ["paused"] },
      ];

      const LATER_COLLAPSE_KEY = "homeLaterCollapsed";

      function HomeView({
        routines,
        suggestions,
        typeFilter,
        setTypeFilter,
        statusFilters,
        toggleStatus,
        onDone,
        onMenu,
        onSnooze,
        onAccept,
        onDismiss,
        onBell,
      }) {
        // Active items only — exclude completed reminders from home
        const activeItems = useMemo(
          () =>
            routines.filter((r) => !(r.type === "reminder" && r.completedAt)),
          [routines],
        );

        // Status filter chip → list of getStatus().state values
        const statusChipMatches = (chip, item) => {
          if (chip === "muted") return !!item.muted;
          if (chip === "overdue") {
            const s = getStatus(item).state;
            return s === "overdue" || s === "due";
          }
          if (chip === "soon") return getStatus(item).state === "soon";
          if (chip === "paused") return getStatus(item).state === "paused";
          return false;
        };

        // Apply filters (AND across both rows)
        const filtered = useMemo(() => {
          return activeItems.filter((item) => {
            if (typeFilter === "routine" && item.type !== "routine")
              return false;
            if (typeFilter === "reminder" && item.type !== "reminder")
              return false;
            if (statusFilters.size > 0) {
              let matches = false;
              for (const chip of statusFilters) {
                if (statusChipMatches(chip, item)) {
                  matches = true;
                  break;
                }
              }
              if (!matches) return false;
            }
            return true;
          });
        }, [activeItems, typeFilter, statusFilters]);

        // Group by section
        const sections = useMemo(() => {
          const out = HOME_SECTIONS.map((s) => ({ ...s, items: [] }));
          for (const item of filtered) {
            const state = getStatus(item).state;
            const section = out.find((s) => s.states.includes(state));
            if (section) section.items.push(item);
          }
          for (const s of out) {
            s.items.sort((a, b) => {
              const aS = getStatus(a),
                bS = getStatus(b);
              if (s.key === "overdue") return bS.days - aS.days;
              if (s.key === "today") {
                return (a.notifyTime || "").localeCompare(b.notifyTime || "");
              }
              return aS.days - bS.days;
            });
          }
          return out;
        }, [filtered]);

        // Persisted collapse state per section
        const SECTION_KEYS = {
          overdue: "homeOverdueCollapsed",
          week: "homeThisWeekCollapsed",
          later: LATER_COLLAPSE_KEY,
          paused: "homePausedCollapsed",
        };
        const [collapsedMap, setCollapsedMap] = useState(() => ({
          overdue: safeStorageGet(SECTION_KEYS.overdue) === "1",
          week: safeStorageGet(SECTION_KEYS.week) === "1",
          later: safeStorageGet(SECTION_KEYS.later) === "1",
          paused: safeStorageGet(SECTION_KEYS.paused) === "1",
        }));
        function toggleSection(key) {
          setCollapsedMap((prev) => {
            const next = { ...prev, [key]: !prev[key] };
            safeStorageSet(SECTION_KEYS[key], next[key] ? "1" : "0");
            return next;
          });
        }

        const hasFiltersOrQuery =
          typeFilter !== "all" || statusFilters.size > 0;
        const totalShown = filtered.length;
        const overdueCount =
          sections.find((s) => s.key === "overdue")?.items.length || 0;

        const clearAllFilters = () => {
          setTypeFilter("all");
          Array.from(statusFilters).forEach((s) => toggleStatus(s));
        };

        return html`
          <${HomeHeader}
            overdueCount=${overdueCount}
            onBell=${() => onBell(overdueCount)}
          />
          ${suggestions.map(
            ({ routine }) => html`
              <${SuggestionBanner}
                key=${routine.id}
                routine=${routine}
                onAccept=${() => onAccept(routine)}
                onDismiss=${() => onDismiss(routine)}
              />
            `,
          )}
          <${FilterChips}
            typeFilter=${typeFilter}
            setTypeFilter=${setTypeFilter}
            statusFilters=${statusFilters}
            toggleStatus=${toggleStatus}
            onClearAll=${clearAllFilters}
          />
          ${routines.length === 0
            ? html`
                <div class="empty">
                  <div class="empty-art">"empty"</div>
                  <div class="empty-text">
                    Tap <strong>+</strong> to add your first routine.
                  </div>
                </div>
              `
            : totalShown === 0
              ? html`
                  <div class="empty">
                    <div class="empty-art">"empty"</div>
                    <div class="empty-text">
                      No routines match these filters.
                    </div>
                    ${hasFiltersOrQuery &&
                    html`
                      <button
                        class="btn-ghost empty-action"
                        onClick=${clearAllFilters}
                      >
                        <${Icon} name="x" size=${14} stroke=${2.25} />
                        Clear filters
                      </button>
                    `}
                  </div>
                `
              : html`
                  ${sections.map((section) => {
                    if (section.items.length === 0) return null;
                    // Later auto-collapses by default if 4+ items AND user hasn't explicitly toggled.
                    const stored = collapsedMap[section.key];
                    const collapsed =
                      section.key === "later"
                        ? stored === undefined
                          ? section.items.length >= 4
                          : stored
                        : !!stored;
                    const previewItem = collapsed ? section.items[0] : null;
                    const previewLabel = previewItem
                      ? `next: ${previewItem.name} · ${formatRelative(getNextDue(previewItem))}`
                      : "";
                    return html`
                      <div key=${section.key} class="home-section">
                        <button
                          class="section-header collapsible"
                          onClick=${() => toggleSection(section.key)}
                          aria-expanded=${collapsed ? "false" : "true"}
                          type="button"
                        >
                          <span class="section-header-main">
                            <h2>${section.label}</h2>
                            <span class="section-count"
                              >· ${section.items.length}</span
                            >
                            <span
                              class=${`section-chev ${collapsed ? "" : "open"}`}
                              ><${Icon} name="chevDown" size=${14}
                            /></span>
                          </span>
                          ${collapsed &&
                          previewLabel &&
                          html`<span class="section-preview"
                            >${previewLabel}</span
                          >`}
                        </button>
                        ${!collapsed &&
                        html`
                          <div class="cards">
                            ${section.items.map(
                              (r) => html`
                                <${ItemCard}
                                  key=${r.id}
                                  routine=${r}
                                  onDone=${onDone}
                                  onMenu=${onMenu}
                                  onSnooze=${onSnooze}
                                />
                              `,
                            )}
                          </div>
                        `}
                      </div>
                    `;
                  })}
                `}
        `;
      }

      // ----- Verify-conflict modal -----
      function VerifyConflictModal({ localCount, serverCount, onChoose }) {
        return html`
          <${Sheet} title="Choose your data" onClose=${() => onChoose("cancel")}>
            <p
              style="margin:0 0 16px; color: var(--ink-soft); font-size: 14px; line-height: 1.5;"
            >
              This chat ID already has
              <strong style="color:var(--ink)">${serverCount}</strong>
              ${serverCount === 1 ? "routine" : "routines"} saved on your
              account. This device has
              <strong style="color:var(--ink)">${localCount}</strong>
              ${localCount === 1 ? "routine" : "routines"} locally. Pick which
              to keep — the other side will be replaced.
            </p>
            <div
              style="display:flex; flex-direction:column; gap:10px; margin-bottom:14px;"
            >
              <button
                class="btn btn-primary"
                onClick=${() => onChoose("server")}
              >
                Use account data (${serverCount}
                ${serverCount === 1 ? "routine" : "routines"})
              </button>
              <button
                class="btn btn-secondary"
                onClick=${() => onChoose("local")}
              >
                Keep this device (${localCount}
                ${localCount === 1 ? "routine" : "routines"}, replaces account)
              </button>
            </div>
            <div class="btn-row">
              <button
                class="btn btn-secondary"
                style="width:100%"
                onClick=${() => onChoose("cancel")}
              >
                Cancel
              </button>
            </div>
          </${Sheet}>
        `;
      }

      // ----- Tasks View -----
      // Pure-rank helpers: tasks order by ascending `rank`. Missing ranks
      // sort last (treated as +∞) until next renumber pass.
      function rankOrInfinity(t) {
        return Number.isInteger(t.rank) ? t.rank : Number.MAX_SAFE_INTEGER;
      }
      function compareByRank(a, b) {
        return rankOrInfinity(a) - rankOrInfinity(b);
      }

      function QuickAddTask({ onAdd }) {
        const [open, setOpen] = useState(false);
        const [text, setText] = useState("");
        const inputRef = useRef(null);

        useEffect(() => {
          if (open && inputRef.current) inputRef.current.focus();
        }, [open]);

        function submit() {
          const t = text.trim();
          if (!t) return;
          onAdd(t);
          setText("");
          // Keep open + focused for fast successive entry.
          requestAnimationFrame(() => {
            if (inputRef.current) inputRef.current.focus();
          });
        }

        if (!open) {
          return html`
            <button
              type="button"
              class="quick-add-pill"
              onClick=${() => setOpen(true)}
            >
              <span class="quick-add-plus">
                <${Icon} name="plus" size=${14} stroke=${2.75} />
              </span>
              <span>Add a task</span>
            </button>
          `;
        }

        return html`
          <div class="quick-add-row">
            <input
              ref=${inputRef}
              class="field-input"
              type="text"
              placeholder="What needs doing?"
              value=${text}
              maxlength="80"
              onInput=${(e) => setText(e.target.value)}
              onKeyDown=${(e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  submit();
                } else if (e.key === "Escape") {
                  setText("");
                  setOpen(false);
                }
              }}
              onBlur=${() => {
                // Brief delay to let the Add button register a click first.
                setTimeout(() => {
                  if (!text.trim()) setOpen(false);
                }, 150);
              }}
            />
            <button
              type="button"
              class="quick-add-go"
              onMouseDown=${(e) => e.preventDefault()}
              onClick=${submit}
              disabled=${!text.trim()}
            >
              Add
            </button>
          </div>
        `;
      }

      function TaskRow({ task, onToggleDone, onOpen, rowProps }) {

      function TasksView({ tasks, onCreate, onUpdate, onOpen, onReorder }) {
        const active = tasks
          .filter((t) => !t.completedAt)
          .slice()
          .sort(compareByRank);
        const done = tasks
          .filter((t) => t.completedAt)
          .slice()
          .sort((a, b) =>
            (b.completedAt || "").localeCompare(a.completedAt || ""),
          );

        // Group active tasks by priority, preserving rank order within
        // each group. The flat render order is High → Medium → Low so
        // the drag hook's absolute index works directly.
        const grouped = { high: [], medium: [], low: [] };
        for (const t of active) grouped[getPriority(t)].push(t);
        const flatActive = [...grouped.high, ...grouped.medium, ...grouped.low];
        // Where each section's rows START in the flat array. Used both
        // for sectionResolver lookups and as the drop landing index when
        // the user releases over a section header (incl. empty/collapsed).
        const sectionStartIndex = {
          high: 0,
          medium: grouped.high.length,
          low: grouped.high.length + grouped.medium.length,
        };
        function resolveSection(idx) {
          if (idx < sectionStartIndex.medium) return "high";
          if (idx < sectionStartIndex.low) return "medium";
          return "low";
        }

        const [doneOpen, setDoneOpen] = useState(() => {
          try {
            return safeStorageGet("tasksDoneOpen") === "1";
          } catch {
            return false;
          }
        });
        function toggleDone() {
          setDoneOpen((prev) => {
            const next = !prev;
            try {
              safeStorageSet("tasksDoneOpen", next ? "1" : "0");
            } catch {}
            return next;
          });
        }

        // Per-priority collapse state, persisted as a single JSON blob.
        // Default: all three sections open.
        const [sectionsOpen, setSectionsOpen] = useState(() => {
          try {
            const raw = safeStorageGet("tasksPrioOpen");
            const parsed = raw ? JSON.parse(raw) : null;
            if (parsed && typeof parsed === "object") {
              return {
                high: parsed.high !== false,
                medium: parsed.medium !== false,
                low: parsed.low !== false,
              };
            }
          } catch {}
          return { high: true, medium: true, low: true };
        });
        function toggleSection(section) {
          setSectionsOpen((prev) => {
            const next = { ...prev, [section]: !prev[section] };
            try {
              safeStorageSet("tasksPrioOpen", JSON.stringify(next));
            } catch {}
            return next;
          });
        }
        // Imperative refs to each section header element so the drag
        // hook can snapshot their positions for header drop-targets.
        const headerRefs = useRef({ high: null, medium: null, low: null });

        const { rowProps } = useDraggableList(
          flatActive.length,
          (from, to, fromSection, toSection) => {
            if (from === to && fromSection === toSection) return;
            // Build the post-move flat list, preserving order within each
            // section. Then renumber ranks within the *target* section so
            // ranks remain monotonic per group.
            const list = flatActive.slice();
            const [movedRaw] = list.splice(from, 1);
            // Apply priority change to the moved task (writes the field
            // even when fromSection === toSection so a no-op section
            // change is still safe).
            const moved = { ...movedRaw, priority: toSection || "medium" };
            list.splice(to, 0, moved);

            // Within the (post-move) target section, recompute ranks for
            // every member so the new ordering sticks. Other sections are
            // untouched. This is simpler and more robust than mid-point
            // ranks for cross-section moves, and we already do a "renumber
            // when gaps tighten" path.
            const targetSection = toSection || "medium";
            const targetMembers = list.filter(
              (t) => getPriority(t) === targetSection,
            );
            const renumbered = targetMembers.map((t, i) => ({
              ...t,
              rank: (i + 1) * RANK_STEP,
            }));
            onReorder(renumbered);

            // Auto-expand the target section so the user sees where the
            // task landed (especially relevant for previously-collapsed
            // empty sections).
            if (!sectionsOpen[targetSection]) {
              setSectionsOpen((prev) => {
                const next = { ...prev, [targetSection]: true };
                try {
                  safeStorageSet("tasksPrioOpen", JSON.stringify(next));
                } catch {}
                return next;
              });
            }
          },
          {
            sectionResolver: resolveSection,
            sectionHeaders: () =>
              PRIORITIES.map((p) => ({
                section: p,
                el: headerRefs.current[p],
                sectionStartIndex: sectionStartIndex[p],
              })).filter((h) => !!h.el),
          },
        );

        function handleQuickAdd(name) {
          // Quick-add lands at the top of the Medium section (the
          // default priority). Rank is one step below the smallest
          // existing rank among Medium tasks (or 0 if none).
          const mediumTasks = grouped.medium;
          const minRank = mediumTasks.reduce(
            (acc, t) => Math.min(acc, rankOrInfinity(t)),
            0,
          );
          const newRank =
            (minRank === Number.MAX_SAFE_INTEGER ? 0 : minRank) - RANK_STEP;
          onCreate({
            id: id(),
            type: "task",
            name,
            icon: "check",
            description: "",
            skipDays: [],
            skipDirection: "forward",
            history: [],
            priority: "medium",
            rank: newRank,
            completedAt: null,
            createdAt: new Date().toISOString(),
          });
          // If the Medium section is currently collapsed, expand it so
          // the user immediately sees the task they just added.
          if (!sectionsOpen.medium) {
            setSectionsOpen((prev) => {
              const next = { ...prev, medium: true };
              try {
                safeStorageSet("tasksPrioOpen", JSON.stringify(next));
              } catch {}
              return next;
            });
          }
        }

        return html`
          <div class="tasks-page">
            <${PageTitle}
              icon=${html`<${PageIcon} name="clipboardList" />`}
            >Tasks</${PageTitle}>
            <div style="padding: 0 22px 22px">
              <${QuickAddTask} onAdd=${handleQuickAdd} />
              ${
                active.length === 0 && done.length === 0
                  ? html`
                      <div
                        class="tasks-empty"
                        style="padding: 32px 8px; text-align:center; color: var(--ink-soft);"
                      >
                        No tasks yet — tap + to add one.
                      </div>
                    `
                  : null
              }
              ${
                active.length > 0 &&
                html`
                  <div class="task-list">
                    ${PRIORITIES.flatMap((p) => {
                      const items = grouped[p];
                      const open = sectionsOpen[p];
                      const headerNode = html`
                        <button
                          key=${`hdr-${p}`}
                          ref=${(el) => {
                            headerRefs.current[p] = el;
                          }}
                          type="button"
                          class="tasks-section-header"
                          data-priority=${p}
                          aria-expanded=${open ? "true" : "false"}
                          onClick=${() => toggleSection(p)}
                        >
                          <span class="label-wrap">
                            <span class=${`priority-dot prio-${p}`}></span>
                            ${PRIORITY_LABELS[p]}
                            <span class="count">· ${items.length}</span>
                          </span>
                          <span class="chev">
                            <${Icon} name="chevDown" size=${16} />
                          </span>
                        </button>
                      `;
                      if (!open) return [headerNode];
                      return [
                        headerNode,
                        ...items.map(
                          (t) => html`
                            <${TaskRow}
                              key=${t.id}
                              task=${t}
                              onToggleDone=${(task) =>
                                onUpdate({
                                  ...task,
                                  completedAt: new Date().toISOString(),
                                })}
                              onOpen=${onOpen}
                              rowProps=${rowProps(
                                flatActive.findIndex((x) => x.id === t.id),
                              )}
                            />
                          `,
                        ),
                      ];
                    })}
                  </div>
                `
              }
              ${
                done.length > 0 &&
                html`
                  <div class="done-section">
                    <button
                      type="button"
                      class="done-header"
                      onClick=${toggleDone}
                      aria-expanded=${doneOpen ? "true" : "false"}
                    >
                      <span>Done · ${done.length}</span>
                      <span class="done-chev">${doneOpen ? "▾" : "▸"}</span>
                    </button>
                    ${doneOpen &&
                    html`
                      <div class="task-list task-list-done">
                        ${done.map(
                          (t) => html`
                            <${TaskRow}
                              key=${t.id}
                              task=${t}
                              onToggleDone=${(task) =>
                                onUpdate({ ...task, completedAt: null })}
                              onOpen=${onOpen}
                              rowProps=${{ class: "draggable-row is-done-row" }}
                            />
                          `,
                        )}
                      </div>
                    `}
                  </div>
                `
              }
            </div>
          </div>
        `;
      }

      // ----- Settings View (inline page) -----
      function SettingsView({

        const overdueCount = routines.filter((r) => {

        const [chatIdInput, setChatIdInput] = useState(settings.chatId || "");
        const [verifyState, setVerifyState] = useState("idle"); // idle | verifying | verified | not-found | capacity | error
        const isVerified = !!settings.chatId && verifyState !== "not-found";
        // If user types a value different from saved chatId, drop verified visual until re-verified.
        const inputMatchesSaved =
          chatIdInput.trim() === (settings.chatId || "");
        const showVerifiedBadge =
          isVerified && inputMatchesSaved && settings.chatId;

        async function handleVerify() {
          const id = chatIdInput.trim();
          if (!CHAT_ID_RE.test(id)) {
            setVerifyState("error");
            return;
          }
          setVerifyState("verifying");
          try {
            const result = await onVerifyChatId(id);
            if (result.ok) setVerifyState("verified");
            else if (result.reason === "capacity") setVerifyState("capacity");
            else if (result.reason === "not-found") setVerifyState("not-found");
            else if (result.reason === "cancelled") setVerifyState("idle");
            else setVerifyState("error");
          } catch {
            setVerifyState("error");
          }
        }

        function handleForget() {
          if (
            !confirm(
              "Forget this chat ID? Notifications will stop. Your routines stay on the server tied to this chat ID — re-enter it any time to restore them.",
            )
          )
            return;
          setChatIdInput("");
          setVerifyState("idle");
          onForgetChatId();

        const fileInputRef = (el) => {

        return html`

        <div class="settings-card">

            <label class="field-label">Telegram chat ID</label>
            <div class="input-attach">
              <input
                type="text"
                inputmode="numeric"
                class="field-input"
                value=${chatIdInput}
                placeholder="e.g. 8157194133"
                maxlength="20"
                onInput=${(e) => {
                  setChatIdInput(e.target.value);
                  if (verifyState !== "idle") setVerifyState("idle");
                }}
              />
              <button

              >
                ${

                      : "Verify"
                }

            </div>
            ${
              showVerifiedBadge
                ? html`<div class="field-status is-verified">Verified</div>`
                : verifyState === "not-found"
                  ? html`<div class="field-status is-warn">

                    </div>`
                  : verifyState === "capacity"
                    ? html`<div class="field-status is-warn">

                      </div>`
                    : verifyState === "error"
                      ? html`<div class="field-status is-warn">

                      : html`<div class="field-helper" style="margin-top:10px">

          </div>

            <div>

          ${

      <div class="settings-section">

          <button class="menu-item" onClick=${() => window.__rtFileInput?.click()}>

          <button class="menu-item danger" onClick=${onReset}>

            <div class="menu-item-text">

      </div>
      <div style="text-align:center; color:var(--ink-muted); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; margin-top:8px;">
