      // ----- Kind chooser sheet -----
      function KindChooserSheet({ onClose, onChoose, kinds }) {
        const ks =
          kinds && kinds.length ? kinds : ["routine", "reminder", "task"];
        const labels = {
          routine: "Routine — recurring, with notification",
          reminder: "Reminder — one-shot, with date",
          task: "Task — todo, no date",
        };
        return html`
          <${Sheet} title="Create" onClose=${onClose}>
            <p
              style="margin:0 0 16px; color: var(--ink-soft); font-size: 14px; line-height: 1.5;"
            >
              What would you like to add?
            </p>
            <div style="display:flex; flex-direction:column; gap:10px;">
              ${ks.map(
                (k) => html`
                  <button
                    class="btn btn-primary"
                    key=${k}
                    onClick=${() => onChoose(k)}
                  >
                    ${labels[k]}
                  </button>
                `,
              )}
              <button class="btn btn-secondary" onClick=${onClose}>
                Cancel
              </button>
            </div>
          </${Sheet}>
        `;
      }

      // ----- Summary Strip -----
      function Summary({ routines }) {
        const overdue = routines.filter((r) => {
          const s = getStatus(r);
          return s.state === "overdue" || s.state === "due";
        }).length;
        const upcoming = routines.filter(
          (r) => getStatus(r).state === "soon",
        ).length;
        const total = routines.length;

        if (overdue === 0 && upcoming === 0) {
          return html`
            <div class="summary">
              <div class="summary-num">${total}</div>
              <div class="summary-text">
                <strong>All clear.</strong> ${total} routines tracked, nothing
                due soon.
              </div>
            </div>
          `;
        }

        return html`
          <div class="summary">
            <div class="summary-num ${overdue > 0 ? "alert" : ""}">
              ${overdue || upcoming}
            </div>
            <div class="summary-text">
              ${overdue > 0
                ? html`<strong>${overdue}</strong> ${overdue === 1
                      ? "routine needs"
                      : "routines need"}
                    attention.`
                : html`<strong>${upcoming}</strong> coming up soon.`}
            </div>
          </div>
        `;
      }

      // ----- Date Chip (used as the leading visual on reminder cards) -----
      function DateChip({ date, size = "md" }) {
        const d = date instanceof Date ? date : fromInputDate(date);
        const dow = d
          .toLocaleDateString(undefined, { weekday: "short" })
          .toUpperCase()
          .slice(0, 3);
        return html`
          <span class=${`date-chip date-chip-${size}`} aria-hidden="true">
            <span class="date-chip-dow">${dow}</span>
            <span class="date-chip-day">${d.getDate()}</span>
          </span>
        `;
      }

      // ----- Item Card (routine or reminder) — compact 2-line layout -----
      function ItemCard({ routine, onDone, onMenu, onSnooze }) {
        const item = routine;
        const isReminder = item.type === "reminder";
        const status = getStatus(item);
        const next = getNextDue(item);
        const isSnoozed =
          !isReminder &&
          item.snoozedUntil &&
          startOfDay(new Date(item.snoozedUntil)).getTime() >=
            startOfDay(new Date()).getTime();
        const cardClass = `card ${status.state}${item.muted ? " muted" : ""}${isReminder ? " reminder" : ""}`;

        // Line 2 meta-text (after status pill)
        let metaText;
        if (isReminder) {
          metaText = "one-time";
        } else if (status.state === "paused") {
          metaText = `paused → ${formatDate(item.pausedUntil)}`;
        } else {
          metaText = formatInterval(item.intervalValue, item.intervalUnit);
        }

        const pillLabel =
          status.state === "paused" ? `⏸ ${status.label}` : status.label;

        // Third line: absolute date+time (or paused/logged equivalents).
        // Snoozed items render the same datetime format as any other card —
        // a small moon icon adjacent to the text signals the snooze state.
        let whenText = null;
        if (isReminder && item.completedAt) {
          whenText = `Logged ${formatDateTime(item.completedAt, { time: hhmmOf(item.completedAt), todayShort: true })}`;
        } else if (!isReminder && status.state === "paused") {
          whenText = `Resumes ${formatDateTime(item.pausedUntil, { todayShort: true })}`;
        } else if (next) {
          const effectiveTime = isSnoozed
            ? item.snoozedTime || item.notifyTime
            : item.notifyTime;
          whenText = formatDateTime(next, {
            time: effectiveTime,
            todayShort: true,
          });
        }

        function handleCardTap(e) {
          if (
            e.target.closest(".done-btn") ||
            e.target.closest(".card-snooze-btn")
          )
            return;
          onMenu(item);
        }

        return html`
          <div
            class=${cardClass}
            onClick=${handleCardTap}
            role="button"
            tabindex="0"
          >
            <div class="card-row">
              <div class="card-info">
                <div class="card-title-row">
                  <span class="card-emoji"
                    ><${RoutineIcon} slug=${item.icon} size=${22}
                  /></span>
                  <span class="card-name">
                    <span class="card-name-text">${item.name}</span>
                  </span>
                </div>
                <div class="card-status-row">
                  <span class="pill ${status.state}">${pillLabel}</span>
                  <span class="card-meta-inline">· ${metaText}</span>
                  ${(() => {
                    const cp = checklistProgress(item.description);
                    return cp
                      ? html`<span class="card-meta-inline"
                          >· ${cp.done}/${cp.total}</span
                        >`
                      : null;
                  })()}
                </div>
                ${whenText &&
                html`<div class="card-when">
                  ${isSnoozed &&
                  html`<span
                    class="card-snooze-indicator"
                    aria-label="Snoozed"
                    title="Snoozed"
                    ><${Icon} name="moon" size=${12}
                  /></span>`}
                  ${whenText}
                </div>`}
              </div>
              <div class="card-actions">
                <button
                  class="card-snooze-btn"
                  onClick=${(e) => {
                    e.stopPropagation();
                    onSnooze(item);
                  }}
                  aria-label=${`Snooze ${item.name}`}
                >
                  <${Icon} name="moon" size=${18} />
                </button>
                <button
                  class="done-btn"
                  onClick=${(e) => {
                    e.stopPropagation();
                    onDone(item);
                  }}
                  aria-label=${`Mark ${item.name} done`}
                >
                  Done <${Icon} name="check" size=${14} stroke=${2.5} />
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // Back-compat alias
      const RoutineCard = ItemCard;

      // ----- Suggestion Banner -----
      function SuggestionBanner({ routine, onAccept, onDismiss }) {
        const sug = getSuggestion(routine);
        if (!sug) return null;
        return html`
          <div class="suggestion">
            <div class="suggestion-text">
              <strong>${routine.name}</strong> — you average
              <strong>${sug.avg}d</strong>.<br />
              Update to
              <strong
                >${formatInterval(
                  sug.suggestedValue,
                  sug.suggestedUnit,
                )}</strong
              >?
            </div>
            <div class="suggestion-actions">
              <button class="suggestion-btn ghost" onClick=${onDismiss}>
                Skip
              </button>
              <button class="suggestion-btn" onClick=${onAccept}>Update</button>
            </div>
          </div>
        `;
      }

      // ----- Done Modal -----
      function DoneModal({ routine, onConfirm, onClose }) {
        const [pick, setPick] = useState("today");
        const [customDate, setCustomDate] = useState(toInputDate(new Date()));
        const [note, setNote] = useState("");

        const visitDate = useMemo(() => {
          if (pick === "today") return new Date();
          if (pick === "yesterday") return addDays(new Date(), -1);
          if (pick === "2dago") return addDays(new Date(), -2);
          if (pick === "3dago") return addDays(new Date(), -3);
          return fromInputDate(customDate);
        }, [pick, customDate]);

        const nextRaw = useMemo(
          () =>
            addInterval(visitDate, routine.intervalValue, routine.intervalUnit),
          [visitDate, routine.intervalValue, routine.intervalUnit],
        );
        const next = useMemo(
          () => shiftSkipDays(nextRaw, routine.skipDays, routine.skipDirection),
          [nextRaw, routine.skipDays, routine.skipDirection],
        );
        const shifted = isShifted(nextRaw, routine.skipDays);

        const lastEntryDate = useMemo(() => {
          if (!routine.history?.length) return null;
          const sorted = [...routine.history].sort(
            (a, b) => new Date(b.date) - new Date(a.date),
          );
          return new Date(sorted[0].date);
        }, [routine.history]);

        const reorderWarning =
          lastEntryDate &&
          startOfDay(visitDate).getTime() < startOfDay(lastEntryDate).getTime();

        const minDate = useMemo(() => {
          const yearAgo = addDays(new Date(), -365);
          const created = routine.createdAt
            ? new Date(routine.createdAt)
            : null;
          return toInputDate(created && created > yearAgo ? created : yearAgo);
        }, [routine.createdAt]);

        const picks = [
          ["today", "Today", new Date()],
          ["yesterday", "Yesterday", addDays(new Date(), -1)],
          ["2dago", "2 days ago", addDays(new Date(), -2)],
          ["3dago", "3 days ago", addDays(new Date(), -3)],
          ["custom", "Custom date", null],
        ];

        return html`
    <${Sheet} title=${`Mark ${routine.name} done`} onClose=${onClose}>
      <div class="field">
        <label class="field-label">When did it happen?</label>
        <div class="done-pick-grid">
          ${picks.map(
            ([key, label, d]) => html`
              <button
                key=${key}
                type="button"
                class="date-pick ${pick === key ? "active" : ""}"
                onClick=${() => setPick(key)}
              >
                ${label}
                <span class="date-pick-sub"
                  >${d ? formatDate(d, { short: true }) : "pick date"}</span
                >
              </button>
            `,
          )}
        </div>
        ${
          pick === "custom" &&
          html`
            <input
              type="date"
              class="field-input"
              style="margin-top:10px"
              value=${customDate}
              min=${minDate}
              max=${toInputDate(new Date())}
              onChange=${(e) => setCustomDate(e.target.value)}
            />
          `
        }
      </div>
      <div class="field">
        <label class="field-label">Note (optional)</label>
        <input
          type="text"
          class="field-input"
          placeholder="e.g. tried new barber"
          maxlength="200"
          value=${note}
          onInput=${(e) => setNote(e.target.value)}
        />
      </div>
      <div class="preview">
        <div class="preview-row">
          <span>Logged on</span>
          <strong>${formatDate(visitDate)}</strong>
        </div>
        <div class="preview-row">
          <span>Next reminder</span>
          <strong>
            ${formatDate(next)}
            ${shifted && html`<span class="preview-shifted">moved from skipped day</span>`}
          </strong>
        </div>
      </div>
      ${
        reorderWarning &&
        html`
          <div
            class="preview"
            style="border-style:solid; border-color:var(--warning); color:var(--warning); margin-top:-8px;"
          >
            ⚠ This is before your last logged entry — adding it will reorder
            history.
          </div>
        `
      }
      <div class="btn-row">
        <button class="btn btn-secondary" onClick=${onClose}>Cancel</button>
        <button class="btn btn-primary" onClick=${() => onConfirm(visitDate, note.trim())}>Confirm ✓</button>
      </div>
    </${Sheet}>
  `;
      }

      // ----- Action Menu -----
      function MenuModal({ routine, onClose, onAction }) {
        const isReminder = routine.type === "reminder";
        const isPaused =
          !isReminder &&
          routine.pausedUntil &&
          isFutureDay(routine.pausedUntil);
        const isSnoozed =
          !isReminder &&
          routine.snoozedUntil &&
          isFutureDay(routine.snoozedUntil);
        const next = getNextDue(routine);
        const lastDone = !isReminder ? getLastDone(routine) : null;
        const nextText =
          isReminder && routine.completedAt
            ? `Logged ${formatDateTime(routine.completedAt, { time: hhmmOf(routine.completedAt), todayShort: true })}`
            : next
              ? formatDateTime(next, {
                  time: routine.notifyTime,
                  todayShort: true,
                })
              : null;

        return html`
    <${Sheet} title=${routine.name} onClose=${onClose}>
      ${
        routine.description &&
        html` <div class="menu-description">${routine.description}</div> `
      }
      ${
        nextText &&
        html`
          <div class="preview" style="margin-bottom:14px">
            <div class="preview-row">
              <span
                >${isReminder && routine.completedAt ? "Status" : "Next"}</span
              >
              <strong>${nextText}</strong>
            </div>
            ${!isReminder &&
            html`
              <div class="preview-row">
                <span>Every</span>
                <strong
                  >${formatInterval(
                    routine.intervalValue,
                    routine.intervalUnit,
                  )}</strong
                >
              </div>
            `}
            ${!isReminder &&
            lastDone &&
            html`
              <div class="preview-row">
                <span>Last done</span>
                <strong
                  >${formatDateTime(lastDone, {
                    time: hhmmOf(lastDone),
                    todayShort: true,
                  })}</strong
                >
              </div>
            `}
          </div>
        `
      }
      <div class="menu">
        <button class="menu-item" onClick=${() => onAction("history")}>
          <span class="menu-item-icon"><${Icon} name="history" size=${20} /></span>
          <div class="menu-item-text">
            History
            <div class="menu-item-sub">${routine.history.length} ${routine.history.length === 1 ? "entry" : "entries"}</div>
          </div>
          <span class="menu-item-chev"><${Icon} name="chevRight" size=${16} /></span>
        </button>
        ${
          !isReminder &&
          html`
            <button class="menu-item" onClick=${() => onAction("snooze")}>
              <span class="menu-item-icon"
                ><${Icon} name="moon" size=${20}
              /></span>
              <div class="menu-item-text">
                ${isSnoozed ? "Update snooze" : "Snooze"}
                <div class="menu-item-sub">
                  ${isSnoozed
                    ? `until ${formatDate(routine.snoozedUntil)}`
                    : "push the next reminder"}
                </div>
              </div>
              <span class="menu-item-chev"
                ><${Icon} name="chevRight" size=${16}
              /></span>
            </button>
          `
        }
        <button class="menu-item" onClick=${() => onAction("mute")}>
          <span class="menu-item-icon"><${Icon} name=${routine.muted ? "bell" : "bellOff"} size=${20} /></span>
          <div class="menu-item-text">
            ${routine.muted ? "Unmute notifications" : "Mute notifications"}
            <div class="menu-item-sub">${routine.muted ? "daily reminders are off" : "stop daily reminders"}</div>
          </div>
        </button>
        ${
          !isReminder &&
          html`
            <button class="menu-item" onClick=${() => onAction("pause")}>
              <span class="menu-item-icon"
                ><${Icon} name=${isPaused ? "play" : "pause"} size=${20}
              /></span>
              <div class="menu-item-text">
                ${isPaused ? "Resume / change pause" : "Pause routine"}
                <div class="menu-item-sub">
                  ${isPaused
                    ? `paused until ${formatDate(routine.pausedUntil)}`
                    : "while travelling, etc."}
                </div>
              </div>
              <span class="menu-item-chev"
                ><${Icon} name="chevRight" size=${16}
              /></span>
            </button>
          `
        }
        <button class="menu-item" onClick=${() => onAction("calendar")}>
          <span class="menu-item-icon"><${Icon} name="calendar" size=${20} /></span>
          <div class="menu-item-text">
            Add to Calendar
            <div class="menu-item-sub">downloads .ics for next reminder</div>
          </div>
          <span class="menu-item-chev"><${Icon} name="chevRight" size=${16} /></span>
        </button>
        <button class="menu-item" onClick=${() => onAction("edit")}>
          <span class="menu-item-icon"><${Icon} name="edit" size=${20} /></span>
          <div class="menu-item-text">
            Edit ${isReminder ? "reminder" : "routine"}
            <div class="menu-item-sub">${isReminder ? "name, date, description, time" : "name, interval, skip rule, time"}</div>
          </div>
          <span class="menu-item-chev"><${Icon} name="chevRight" size=${16} /></span>
        </button>
        ${
          isReminder &&
          html`
            <button
              class="menu-item danger"
              onClick=${() => onAction("cancel")}
            >
              <span class="menu-item-icon"
                ><${Icon} name="trash" size=${20}
              /></span>
              <div class="menu-item-text">
                Cancel reminder
                <div class="menu-item-sub">delete without logging</div>
              </div>
            </button>
          `
        }
      </div>
    </${Sheet}>
  `;
      }

      // ----- History Modal -----
      function HistoryModal({ routine, onClose, onUpdate }) {
        const [editing, setEditing] = useState(null); // entry id being edited
        const stats = getStats(routine);
        const sorted = [...(routine.history || [])].sort(
          (a, b) => new Date(b.date) - new Date(a.date),
        );

        function deleteEntry(entryId) {
          if (!confirm("Delete this entry?")) return;
          onUpdate({
            ...routine,
            history: routine.history.filter((h) => h.id !== entryId),
          });
        }

        function saveEdit(entryId, newDate, newNote) {
          onUpdate({
            ...routine,
            history: routine.history.map((h) =>
              h.id === entryId ? { ...h, date: newDate, note: newNote } : h,
            ),
          });
          setEditing(null);
        }

        return html`
    <${Sheet} title="History" onClose=${onClose}>
      ${
        stats &&
        html`
          <div class="stats">
            <div class="stat">
              <div class="stat-num">${stats.total}</div>
              <div class="stat-label">Total</div>
            </div>
            <div class="stat">
              <div class="stat-num">
                ${stats.avg}<span style="font-size:14px;font-style:normal"
                  >d</span
                >
              </div>
              <div class="stat-label">Avg gap</div>
            </div>
            <div class="stat">
              <div class="stat-num">
                ${stats.consistency}<span
                  style="font-size:14px;font-style:normal"
                  >%</span
                >
              </div>
              <div class="stat-label">Consistent</div>
            </div>
          </div>
        `
      }
      ${
        sorted.length === 0 &&
        html`
          <div
            style="text-align:center; padding: 30px 0; color: var(--ink-muted); font-size: 14px;"
          >
            No history yet. Mark this routine done to start logging.
          </div>
        `
      }
      <div class="history-list">
        ${sorted.map((entry) =>
          editing === entry.id
            ? html`<${HistoryEditRow}
                key=${entry.id}
                entry=${entry}
                onSave=${(d, n) => saveEdit(entry.id, d, n)}
                onCancel=${() => setEditing(null)}
              />`
            : html`
                <div class="history-item" key=${entry.id}>
                  <div style="flex:1; min-width:0">
                    <div class="history-date">
                      ${formatDate(entry.date, { year: true })}
                    </div>
                    <div class="history-rel">${formatRelative(entry.date)}</div>
                    ${entry.note &&
                    html`<div class="history-note">"${entry.note}"</div>`}
                  </div>
                  <div class="history-actions">
                    <button
                      class="history-action"
                      onClick=${() => setEditing(entry.id)}
                      aria-label="Edit"
                    >
                      <${Icon} name="edit" size=${16} />
                    </button>
                    <button
                      class="history-action"
                      onClick=${() => deleteEntry(entry.id)}
                      aria-label="Delete"
                    >
                      <${Icon} name="trash" size=${16} />
                    </button>
                  </div>
                </div>
              `,
        )}
      </div>
    </${Sheet}>
  `;
      }

      function HistoryEditRow({ entry, onSave, onCancel }) {
        const [date, setDate] = useState(toInputDate(entry.date));
        const [note, setNote] = useState(entry.note || "");
        return html`
          <div
            class="history-item"
            style="flex-direction:column; align-items:stretch; gap:10px;"
          >
            <input
              type="date"
              class="field-input"
              value=${date}
              onChange=${(e) => setDate(e.target.value)}
              max=${toInputDate(new Date())}
            />
            <input
              type="text"
              class="field-input"
              placeholder="Note"
              maxlength="200"
              value=${note}
              onInput=${(e) => setNote(e.target.value)}
            />
            <div style="display:flex; gap:8px;">
              <button class="btn-ghost" style="flex:1" onClick=${onCancel}>
                Cancel
              </button>
              <button
                class="btn-ghost"
                style="flex:1; background:var(--primary); color:var(--primary-ink); border-color:var(--ink); font-weight:700"
                onClick=${() =>
                  date &&
                  onSave(fromInputDate(date).toISOString(), note.trim())}
              >
                Save
              </button>
            </div>
          </div>
        `;
      }

      // ----- Snooze Modal -----
      function SnoozeModal({ routine, onClose, onConfirm }) {
        const [mode, setMode] = useState(() =>
          safeStorageGet("lastSnoozeMode") === "date" ? "date" : "days",
        );
        const [days, setDays] = useState(2);
        const [date, setDate] = useState(toInputDate(addDays(new Date(), 7)));

        useEffect(() => {
          safeStorageSet("lastSnoozeMode", mode);
        }, [mode]);

        const baseNext = getNextDue(routine);
        const tomorrow = addDays(new Date(), 1);

        const targetDate = useMemo(() => {
          if (mode === "days")
            return shiftSkipDays(
              addDays(baseNext, days),
              routine.skipDays,
              routine.skipDirection,
            );
          return fromInputDate(date);
        }, [
          mode,
          days,
          date,
          baseNext,
          routine.skipDays,
          routine.skipDirection,
        ]);

        const dateValid =
          mode === "days"
            ? true
            : startOfDay(fromInputDate(date)).getTime() >
              startOfDay(new Date()).getTime();

        return html`
    <${Sheet} title="Snooze" onClose=${onClose}>
      <p style="margin:0 0 16px; color: var(--ink-soft); font-size: 14px; line-height: 1.5;">
        Push the next reminder for ${" "}<strong style="color:var(--ink)">${routine.name}</strong>${" "} without marking it done.
      </p>
      <div class="segments" style="grid-template-columns: 1fr 1fr; margin-bottom:16px;">
        <button type="button" class=${`segment ${mode === "days" ? "active" : ""}`} onClick=${() => setMode("days")}>+ Days</button>
        <button type="button" class=${`segment ${mode === "date" ? "active" : ""}`} onClick=${() => setMode("date")}>Pick a date</button>
      </div>
      ${
        mode === "days"
          ? html`
              <div class="field">
                <label class="field-label">Snooze for</label>
                <div class="field-row">
                  <input
                    type="range"
                    min="1"
                    max="60"
                    value=${days}
                    class="field-slider"
                    onInput=${(e) => setDays(Number(e.target.value))}
                  />
                  <span class="field-num">${days}d</span>
                </div>
              </div>
            `
          : html`
              <div class="field">
                <label class="field-label">Snooze until</label>
                <input
                  type="date"
                  class="field-input"
                  value=${date}
                  min=${toInputDate(tomorrow)}
                  onChange=${(e) => setDate(e.target.value)}
                />
                <div
                  style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;"
                >
                  <button
                    type="button"
                    class="btn-ghost"
                    onClick=${() =>
                      setDate(toInputDate(addDays(new Date(), 7)))}
                  >
                    +1 week
                  </button>
                  <button
                    type="button"
                    class="btn-ghost"
                    onClick=${() =>
                      setDate(toInputDate(addDays(new Date(), 14)))}
                  >
                    +2 weeks
                  </button>
                  <button
                    type="button"
                    class="btn-ghost"
                    onClick=${() =>
                      setDate(toInputDate(addInterval(new Date(), 1, "month")))}
                  >
                    +1 month
                  </button>
                </div>
              </div>
            `
      }
      <div class="preview">
        <div class="preview-row">
          <span>Currently due</span>
          <strong>${formatDate(baseNext)}</strong>
        </div>
        <div class="preview-row">
          <span>After snooze</span>
          <strong>${formatDate(targetDate)}</strong>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onClick=${onClose}>Cancel</button>
        <button class="btn btn-primary" onClick=${() => onConfirm(targetDate)} disabled=${!dateValid}>Snooze</button>
      </div>
    </${Sheet}>
  `;
      }

      // ----- Pause Modal -----
      function PauseModal({ routine, onClose, onConfirm, onResume }) {
        const isPaused =
          routine.pausedUntil && isFutureDay(routine.pausedUntil);
        const [resumeDate, setResumeDate] = useState(
          toInputDate(
            isPaused ? new Date(routine.pausedUntil) : addDays(new Date(), 14),
          ),
        );

        return html`
    <${Sheet} title=${isPaused ? "Pause settings" : "Pause routine"} onClose=${onClose}>
      <p style="margin:0 0 16px; color: var(--ink-soft); font-size: 14px; line-height: 1.5;">
        ${
          isPaused
            ? html`Currently paused until
                <strong style="color:var(--ink)"
                  >${formatDate(routine.pausedUntil)}</strong
                >. Change date or resume now.`
            : html`Pause
                <strong style="color:var(--ink)">${routine.name}</strong> until
                you resume — it won't show as overdue.`
        }
      </p>
      <div class="field">
        <label class="field-label">Resume on</label>
        <input
          type="date"
          class="field-input"
          value=${resumeDate}
          min=${toInputDate(new Date())}
          onChange=${(e) => setResumeDate(e.target.value)}
        />
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onClick=${onClose}>Cancel</button>
        <button class="btn btn-primary" onClick=${() => onConfirm(fromInputDate(resumeDate))}>
          ${isPaused ? "Update" : "Pause"}
        </button>
      </div>
      ${
        isPaused &&
        html`
          <button class="btn-danger" onClick=${onResume}>Resume now</button>
        `
      }
    </${Sheet}>
  `;
      }

      // ----- Add/Edit Modal -----
      const DAY_LETTERS = ["S", "M", "T", "W", "T", "F", "S"];
      // Visual order for week-day pickers: Monday-first, matching the calendar grid.
      // Indexes still refer to JS getDay() (Sun=0..Sat=6) so the data model is unchanged.
      const MON_FIRST_DOW = [1, 2, 3, 4, 5, 6, 0];
      const DAY_NAMES_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const DAY_NAMES_FULL = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
      ];

      function skipDaysLabel(days) {
        const set = new Set(days);
        return MON_FIRST_DOW.filter((d) => set.has(d))
          .map((d) => DAY_NAMES_SHORT[d])
          .join("/");
      }

      // ----- Drag-to-reorder: long-press lift, pointer capture, midpoint rank -----
      // The hook returns props to spread onto each row; the consumer renders
      // its own list. `onReorder(fromIndex, toIndex)` is called on drop.
      function useDraggableList(itemCount, onReorder, options = {}) {
        // Optional section-awareness for grouped lists (Tasks page).
        //   sectionResolver(index): string | null — section of row at idx
        //   sectionHeaders(): Array<{ section, el, sectionStartIndex }>

                        type="button"
                        class="desc-tool"
                        onClick=${() => togglePrefixOnCurrentLine("- ")}
                        aria-label="Toggle bullet on current line"
                        title="Bullets"

                        <${Icon} name="list" size=${16} stroke=${2} />
                      </button>

                        <button
                          type="button"
                          class="desc-pill-btn desc-pill-primary"

                    <div class="desc-actions">
                      <button

                        Edit

                        class=${`desc-line desc-check ${b.checked ? "is-checked" : ""}`}

                        <span class="desc-text">${renderInline(b.text)}</span>

            ${header}

              ref=${taRef}
              class="desc-textarea"
              placeholder=${placeholder ||

        routine,
        onSave,
        onCancel,
        onDelete,
        initialType: propInitialType,
      }) {
        const isNew = !routine;
        const todayKey = toInputDate(new Date());
        const initialType = routine?.type || propInitialType || "routine";
        const [type, setType] = useState(initialType);
        const isReminder = type === "reminder";
        const isTask = type === "task";
        const [name, setName] = useState(routine?.name || "");
        const [description, setDescription] = useState(
          routine?.description || "",
        );
        const [intervalValue, setIntervalValue] = useState(
          routine?.intervalValue ?? 14,
        );
        const [intervalUnit, setIntervalUnit] = useState(
          routine?.intervalUnit || "day",
        );
        const [icon, setIcon] = useState(routine?.icon || "clock");
        const [priority, setPriority] = useState(getPriority(routine));
        const [skipDays, setSkipDays] = useState(
          routine?.skipDays ? [...routine.skipDays] : [],
        );
        const [skipDirection, setSkipDirection] = useState(
          routine?.skipDirection || "forward",
        );
        const [notifyTime, setNotifyTime] = useState(
          routine?.notifyTime || DEFAULT_NOTIFY_TIME,
        );
        const [iconOpen, setIconOpen] = useState(false);

        // Reminder-only state
        const [dueDate, setDueDate] = useState(
          routine?.type === "reminder"
            ? routine.dueDate
            : toInputDate(addDays(new Date(), 7)),
        );
        const [onOverdue, setOnOverdue] = useState(
          routine?.onOverdue || "archive",
        );

        // Routine-only, create-only: pick the first occurrence date.
        // Defaults to today (preserves prior behavior); only persists
        // cycleAnchorDate at submit if user picked a different date.
        const [startDate, setStartDate] = useState(todayKey);

        const allSkipped = skipDays.length >= 7;
        const validInterval =
          Number.isFinite(intervalValue) &&
          intervalValue >= 1 &&
          intervalValue <= 999;
        const validDueDate =
          type !== "reminder" ||
          (typeof dueDate === "string" && DATE_RE.test(dueDate));
        const validNotifyTime = TIME_RE.test(notifyTime);
        const validStartDate =
          type !== "routine" ||
          !isNew ||
          (typeof startDate === "string" &&
            DATE_RE.test(startDate) &&
            startDate >= todayKey);
        // Block reminders whose chosen local instant is already in the past.
        const reminderInPast = (() => {
          if (type !== "reminder" || !validDueDate || !validNotifyTime)
            return false;
          if (dueDate > todayKey) return false;
          if (dueDate < todayKey) return true;
          const [h, m] = notifyTime.split(":").map(Number);
          const now = new Date();
          return now.getHours() * 60 + now.getMinutes() >= h * 60 + m;
        })();
        const canSave = isTask
          ? !!name.trim()
          : !!name.trim() &&
            !allSkipped &&
            validNotifyTime &&
            !reminderInPast &&
            validStartDate &&
            (type === "routine" ? validInterval : validDueDate);

        function bumpValue(delta) {
          setIntervalValue((v) =>
            Math.max(1, Math.min(999, (Number.isFinite(v) ? v : 1) + delta)),
          );
        }

        function toggleSkip(d) {
          setSkipDays((prev) =>
            prev.includes(d)
              ? prev.filter((x) => x !== d)
              : [...prev, d].sort(),
          );
        }

        function submit() {
          if (!canSave) return;
          const base = {
            name: name.trim(),
            description: description.trim().slice(0, MAX_DESCRIPTION),
            icon,
            skipDays: [...skipDays].sort(),
            skipDirection,
            notifyTime: TIME_RE.test(notifyTime)
              ? notifyTime
              : DEFAULT_NOTIFY_TIME,
            tz: routine?.tz || detectTimeZone(),
          };
          if (type === "task") {
            onSave({
              ...base,
              type: "task",
              priority,
              completedAt: routine?.completedAt || null,
              rank: routine?.rank,
            });
          } else if (type === "reminder") {
            // Apply skip-day shift to the chosen due date once at create time
            const shifted = shiftSkipDays(
              fromInputDate(dueDate),
              base.skipDays,
              skipDirection,
            );
            onSave({
              ...base,
              type: "reminder",
              dueDate: toInputDate(shifted),
              onOverdue,
            });
          } else {
            const payload = {
              ...base,
              type: "routine",
              intervalValue,
              intervalUnit,
            };
            // Create-only: if user picked a non-today start date, anchor the
            // cycle there. Skip-day shift applied once at create, mirroring
            // the reminder dueDate flow.
            if (isNew && DATE_RE.test(startDate) && startDate !== todayKey) {
              const startShifted = shiftSkipDays(
                fromInputDate(startDate),
                base.skipDays,
                skipDirection,
              );
              if (toInputDate(startShifted) !== todayKey) {
                payload.cycleAnchorDate = startShifted.toISOString();
              }
            }
            onSave(payload);
          }
        }

        const dirLabel = {
          forward: "next allowed weekday",
          backward: "previous allowed weekday",
          nearest: "whichever is closer",
        }[skipDirection];
        const intervalPreview = formatInterval(
          validInterval ? intervalValue : 1,
          intervalUnit,
        );
        const dueShifted =
          type === "reminder" &&
          skipDays.length > 0 &&
          validDueDate &&
          isShifted(fromInputDate(dueDate), skipDays);
        const dueShiftedTo = dueShifted
          ? shiftSkipDays(fromInputDate(dueDate), skipDays, skipDirection)
          : null;

        return html`
          <div class="routine-form-body">
            ${isNew &&
            html`
              <div class="field">
                <label class="field-label">Type</label>
                <div
                  class="segments"
                  style="grid-template-columns: 1fr 1fr 1fr;"
                >
                  <button
                    type="button"
                    class=${`segment ${type === "routine" ? "active" : ""}`}
                    onClick=${() => setType("routine")}
                  >
                    Routine
                  </button>
                  <button
                    type="button"
                    class=${`segment ${type === "reminder" ? "active" : ""}`}
                    onClick=${() => setType("reminder")}
                  >
                    Reminder
                  </button>
                  <button
                    type="button"
                    class=${`segment ${type === "task" ? "active" : ""}`}
                    onClick=${() => setType("task")}
                  >
                    Task
                  </button>
                </div>
              </div>
            `}
            <div class="field">
              <label class="field-label">Name</label>
              <input
                type="text"
                class="field-input"
                placeholder=${isReminder ? "e.g. Car service" : "e.g. Haircut"}
                maxlength="80"
                value=${name}
                onInput=${(e) => setName(e.target.value)}
                autofocus
              />
            </div>
            <div class="field">
              <${DescriptionEditor}
                label="Description"
                value=${description}
                onChange=${setDescription}
                placeholder="Notes, sub-items, anything. Use [ ] for checkboxes, - for bullets."
              />
            </div>
            ${isTask &&
            html`
              <div class="field">
                <label class="field-label">Priority</label>
                <div
                  class="segments"
                  style="grid-template-columns: 1fr 1fr 1fr;"
                >
                  <button
                    type="button"
                    class=${`segment ${priority === "high" ? "active" : ""}`}
                    onClick=${() => setPriority("high")}
                  >
                    High
                  </button>
                  <button
                    type="button"
                    class=${`segment ${priority === "medium" ? "active" : ""}`}
                    onClick=${() => setPriority("medium")}
                  >
                    Medium
                  </button>
                  <button
                    type="button"
                    class=${`segment ${priority === "low" ? "active" : ""}`}
                    onClick=${() => setPriority("low")}
                  >
                    Low
                  </button>
                </div>
              </div>
            `}
            ${isTask
              ? null
              : isReminder
                ? html`
                    <div class="field">
                      <label class="field-label">Date</label>
                      <input
                        type="date"
                        class="field-input"
                        value=${dueDate}
                        onChange=${(e) => setDueDate(e.target.value)}
                      />
                      ${dueShifted &&
                      dueShiftedTo &&
                      html`
                        <div class="field-helper">
                          Will fire on
                          <strong style="color:var(--ink)"
                            >${formatDate(dueShiftedTo)}</strong
                          >
                          (shifted from ${formatDate(fromInputDate(dueDate))}).
                        </div>
                      `}
                    </div>
                  `
                : html`
                    <div class="field">
                      <label class="field-label">Interval</label>
                      <div class="interval-row">
                        <button
                          class="step-btn"
                          type="button"
                          onClick=${() => bumpValue(-1)}
                          aria-label="Decrease"
                        >
                          −
                        </button>
                        <input
                          type="number"
                          min="1"
                          max="999"
                          class="field-input interval-num"
                          value=${intervalValue}
                          onInput=${(e) => {
                            const v = parseInt(e.target.value, 10);
                            setIntervalValue(
                              Number.isFinite(v)
                                ? Math.max(1, Math.min(999, v))
                                : "",
                            );
                          }}
                        />
                        <button
                          class="step-btn"
                          type="button"
                          onClick=${() => bumpValue(1)}
                          aria-label="Increase"
                        >
                          +
                        </button>
                      </div>
                      <div
                        class="segments"
                        style="grid-template-columns: repeat(4, 1fr); margin-top:8px;"
                      >
                        ${[
                          ["day", "Day"],
                          ["week", "Week"],
                          ["month", "Month"],
                          ["year", "Year"],
                        ].map(
                          ([u, label]) => html`
                            <button
                              key=${u}
                              type="button"
                              class=${`segment ${intervalUnit === u ? "active" : ""}`}
                              onClick=${() => setIntervalUnit(u)}
                            >
                              ${label}
                            </button>
                          `,
                        )}
                      </div>
                      <div class="field-helper">
                        ${intervalPreview.charAt(0).toUpperCase() +
                        intervalPreview.slice(1)}
                      </div>
                    </div>
                  `}
            ${isNew &&
            !isReminder &&
            !isTask &&
            html`
              <div class="field">
                <label class="field-label">Start date</label>
                <input
                  type="date"
                  class="field-input"
                  value=${startDate}
                  min=${todayKey}
                  onChange=${(e) => setStartDate(e.target.value)}
                />
                ${(() => {
                  if (!DATE_RE.test(startDate)) return null;
                  const picked = fromInputDate(startDate);
                  const shifted =
                    skipDays.length > 0 && isShifted(picked, skipDays)
                      ? shiftSkipDays(picked, skipDays, skipDirection)
                      : null;
                  if (shifted) {
                    return html`
                      <div class="field-helper">
                        First occurrence:
                        <strong style="color:var(--ink)"
                          >${formatDate(shifted)}</strong
                        >
                        (shifted from ${formatDate(picked)}).
                      </div>
                    `;
                  }
                  return html`
                    <div class="field-helper">
                      ${startDate === todayKey
                        ? "First occurrence is today. Pick a later date to push the start."
                        : `First occurrence: ${formatDate(picked)}.`}
                    </div>
                  `;
                })()}
              </div>
            `}
            ${!isTask &&
            html`
              <div class="field">
                <label class="field-label">Skip these days</label>
                <div class="day-chips">
                  ${MON_FIRST_DOW.map((idx) => {
                    const letter = DAY_LETTERS[idx];
                    const active = skipDays.includes(idx);
                    const isWeekend = idx === 0 || idx === 6;
                    return html`
                      <button
                        key=${idx}
                        type="button"
                        class=${`day-chip ${active ? "active" : ""} ${isWeekend ? "weekend" : ""}`}
                        onClick=${() => toggleSkip(idx)}
                        aria-label=${`Toggle ${DAY_NAMES_FULL[idx]}`}
                        aria-pressed=${active ? "true" : "false"}
                      >
                        ${letter}
                      </button>
                    `;
                  })}
                </div>
                ${allSkipped &&
                html`
                  <div class="field-helper" style="color:var(--danger)">
                    Choose at least one allowed day.
                  </div>
                `}
                ${skipDays.length > 0 &&
                !allSkipped &&
                html`
                  <label class="field-label" style="margin-top:14px"
                    >Push to</label
                  >
                  <div
                    class="segments"
                    style="grid-template-columns: 1fr 1fr 1fr;"
                  >
                    <button
                      type="button"
                      class=${`segment ${skipDirection === "backward" ? "active" : ""}`}
                      onClick=${() => setSkipDirection("backward")}
                    >
                      Earlier
                    </button>
                    <button
                      type="button"
                      class=${`segment ${skipDirection === "forward" ? "active" : ""}`}
                      onClick=${() => setSkipDirection("forward")}
                    >
                      Later
                    </button>
                    <button
                      type="button"
                      class=${`segment ${skipDirection === "nearest" ? "active" : ""}`}
                      onClick=${() => setSkipDirection("nearest")}
                    >
                      Nearest
                    </button>
                  </div>
                  <div class="field-helper">
                    If reminder lands on ${skipDaysLabel(skipDays)}, move to
                    ${dirLabel}.
                  </div>
                `}
              </div>
            `}
            ${!isTask &&
            html`
              <div class="field">
                <label class="field-label">Notification time</label>
                <input
                  type="time"
                  class="field-input"
                  value=${notifyTime}
                  onChange=${(e) =>
                    setNotifyTime(e.target.value || DEFAULT_NOTIFY_TIME)}
                />
                <div class="field-helper">
                  When you'll be reminded if this
                  ${isReminder ? "reminder" : "routine"} is due. Defaults to
                  ${DEFAULT_NOTIFY_TIME}.
                </div>
                ${reminderInPast &&
                html`
                  <div class="field-helper" style="color:var(--danger)">
                    That date and time is already in the past. Pick a future
                    moment.
                  </div>
                `}
              </div>
            `}
            ${isReminder &&
            html`
              <div class="field">
                <label class="field-label">On overdue</label>
                <div class="segments" style="grid-template-columns: 1fr 1fr;">
                  <button
                    type="button"
                    class=${`segment ${onOverdue === "archive" ? "active" : ""}`}
                    onClick=${() => setOnOverdue("archive")}
                  >
                    Auto-archive
                  </button>
                  <button
                    type="button"
                    class=${`segment ${onOverdue === "nag" ? "active" : ""}`}
                    onClick=${() => setOnOverdue("nag")}
                  >
                    Keep nagging
                  </button>
                </div>
                <div class="field-helper">
                  ${onOverdue === "archive"
                    ? "Once the day passes, this reminder moves to history automatically."
                    : "Keeps notifying every day until you mark it done."}
                </div>
              </div>
            `}
            <div class="field">
              <label class="field-label">Icon</label>
              <div class=${`icon-picker ${iconOpen ? "open" : ""}`}>
                <button
                  type="button"
                  class="icon-picker-summary"
                  onClick=${() => setIconOpen((o) => !o)}
                  aria-expanded=${iconOpen ? "true" : "false"}
                >
                  <span class="icon-picker-current"
                    ><${RoutineIcon} slug=${icon} size=${22}
                  /></span>
                  <span class="icon-picker-label">
                    <div class="icon-picker-label-main">
                      ${iconOpen ? "Pick an icon" : "Tap to change"}
                    </div>
                    <div class="icon-picker-label-sub">
                      ${ICONS.length} options
                    </div>
                  </span>
                  <span class="icon-picker-chev"
                    ><${Icon} name="chevDown" size=${18}
                  /></span>
                </button>
                <div class="icon-picker-grid-wrap">
                  <div class="icon-picker-grid-inner">
                    <div class="icon-grid">
                      ${ICONS.map(
                        (slug) => html`
                          <button
                            key=${slug}
                            class=${`icon-cell ${icon === slug ? "active" : ""}`}
                            onClick=${() => setIcon(slug)}
                            type="button"
                            aria-label=${slug}
                          >
                            <${RoutineIcon} slug=${slug} size=${22} />
                          </button>
                        `,
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="btn-row">
              <button class="btn btn-secondary" onClick=${onCancel}>
                Cancel
              </button>
              <button
                class="btn btn-primary"
                onClick=${submit}
                disabled=${!canSave}
              >
                ${isNew ? "Create" : "Save"}
              </button>
            </div>
            ${!isNew &&
            onDelete &&
            html`
              <button class="btn-danger" onClick=${onDelete}>
                Delete ${isReminder ? "reminder" : "routine"}
              </button>
            `}
          </div>
        `;
      }

      function RoutineFormModal({
        routine,
        onClose,
        onSave,
        onDelete,
        initialType,
      }) {
        const isNew = !routine;
        const effectiveType = routine?.type || initialType || "routine";
        const sheetTitle = isNew
          ? effectiveType === "reminder"
            ? "New reminder"
            : effectiveType === "task"
              ? "New task"
              : "New routine"
          : effectiveType === "reminder"
            ? "Edit reminder"
            : effectiveType === "task"
              ? "Edit task"
              : "Edit routine";
        return html`
    <${Sheet} title=${sheetTitle} onClose=${onClose}>
      <${RoutineFormBody}
        routine=${routine}
        initialType=${initialType}
        onSave=${onSave}
        onCancel=${onClose}
        onDelete=${onDelete}
      />
    </${Sheet}>
  `;
      }

      // =============================================================
      // Unified item details — single sheet with internal subview nav
      // =============================================================

      function DetailsHomePanel({
        routine,
        onNav,
        onToggleMute,
        onAddGoogleCalendar,
        onCancelReminder,
        onUpdate,
        onConvertToReminder,
        onConvertToTask,
        onDelete,
      }) {
        // Settings menu (History / Snooze / Mute / Pause / Calendar /
        // Edit / Delete) is collapsed by default to free vertical space
        // for the description. The choice persists across sessions.
        const [settingsOpen, setSettingsOpen] = useState(() => {
          try {
            return localStorage.getItem("details.settingsOpen") === "1";
          } catch {
            return false;
          }
        });
        function toggleSettings() {
          setSettingsOpen((o) => {
            const next = !o;
            try {
              localStorage.setItem("details.settingsOpen", next ? "1" : "0");
            } catch {}
            return next;
          });
        }
        // Local buffer for the inline description editor so a 50-char
        // edit doesn't fire 50 syncs. Commits to parent (and thus to sync)
        // 500 ms after the last keystroke, on unmount, or on a checkbox tap.
        const [descDraft, setDescDraft] = useState(routine.description || "");
        useEffect(() => {
          setDescDraft(routine.description || "");
          // Re-sync the draft when the routine identity changes.
        }, [routine.id]);
        const commitTimerRef = useRef(null);
        const draftRef = useRef(descDraft);
        const routineRef = useRef(routine);
        useEffect(() => {
          draftRef.current = descDraft;
        }, [descDraft]);
        useEffect(() => {
          routineRef.current = routine;
        }, [routine]);
        function onDescChange(next) {
          setDescDraft(next);
          if (commitTimerRef.current) clearTimeout(commitTimerRef.current);
          commitTimerRef.current = setTimeout(() => {
            commitTimerRef.current = null;
            if (
              onUpdate &&
              (draftRef.current || "") !==
                (routineRef.current.description || "")
            ) {
              onUpdate({
                ...routineRef.current,
                description: draftRef.current,
              });
            }
          }, 500);
        }
        useEffect(() => {
          // Flush any pending edit when the panel unmounts (subview change,
          // sheet close, etc.) so we don't lose the user's last keystrokes.
          // Also flush when the tab/page is hidden, so the global sync
          // coordinator's hide-flush sees the latest description in the
          // routines snapshot (otherwise the user's last edits would be
          // stuck in this draft buffer when the device is locked).
          function flushPendingDraft() {
            if (!commitTimerRef.current) return;
            clearTimeout(commitTimerRef.current);
            commitTimerRef.current = null;
            if (
              onUpdate &&
              (draftRef.current || "") !==
                (routineRef.current.description || "")
            ) {
              onUpdate({
                ...routineRef.current,
                description: draftRef.current,
              });
            }
          }
          function onVisibilityChange() {
            if (document.visibilityState === "hidden") flushPendingDraft();
          }
          document.addEventListener("visibilitychange", onVisibilityChange);
          return () => {
            document.removeEventListener(
              "visibilitychange",
              onVisibilityChange,
            );
            flushPendingDraft();
          };
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);
        const isReminder = routine.type === "reminder";
        const isTask = routine.type === "task";
        const isPaused =
          !isReminder &&
          !isTask &&
          routine.pausedUntil &&
          isFutureDay(routine.pausedUntil);
        const isSnoozed =
          !isReminder &&
          !isTask &&
          routine.snoozedUntil &&
          isFutureDay(routine.snoozedUntil);
        const next = isTask ? null : getNextDue(routine);
        const lastDone = !isReminder && !isTask ? getLastDone(routine) : null;
        // When snoozed, compute what the underlying cycle would resolve to
        // without the per-instance override so the user can see both dates.
        const snoozeEffectiveTime = isSnoozed
          ? routine.snoozedTime || routine.notifyTime
          : null;
        const cycleNextWithoutSnooze = isSnoozed
          ? getNextDue({ ...routine, snoozedUntil: null, snoozedTime: null })
          : null;

        const emptyDescription =
          !routine.description || routine.description.length === 0;
        return html`
          <div class="menu-description-wrap">
            <${DescriptionEditor}
              value=${descDraft}
              onChange=${onDescChange}
              readOnly=${!onUpdate}
              forceMode=${isTask && emptyDescription ? "edit" : undefined}
              autoFocus=${isTask && emptyDescription}
              placeholder=${isTask
                ? "Add items. Press Enter for a new line; [ ] makes a checkbox."
                : "Notes, sub-items, anything."}
            />
          </div>
          ${!isTask &&
          html`
            <div class="card info-card">
              ${next &&
              html`
                <div class="info-row">
                  <span
                    >${isReminder && routine.completedAt
                      ? "Status"
                      : "Next"}</span
                  >
                  <strong
                    >${formatDateTime(next, {
                      time: routine.notifyTime,
                      todayShort: true,
                    })}</strong
                  >
                </div>
              `}
              ${!isReminder &&
              html`
                <div class="info-row">
                  <span>Every</span>
                  <strong
                    >${formatInterval(
                      routine.intervalValue,
                      routine.intervalUnit,
                    )}</strong
                  >
                </div>
              `}
              ${!isReminder &&
              lastDone &&
              html`
                <div class="info-row">
                  <span>Last done</span>
                  <strong
                    >${formatDateTime(lastDone, {
                      time: hhmmOf(lastDone),
                      todayShort: true,
                    })}</strong
                  >
                </div>
              `}
              ${isReminder &&
              routine.completedAt &&
              html`
                <div class="info-row">
                  <span>Logged</span>
                  <strong
                    >${formatDateTime(routine.completedAt, {
                      time: hhmmOf(routine.completedAt),
                      todayShort: true,
                    })}</strong
                  >
                </div>
              `}
            </div>
          `}
          ${isSnoozed &&
          html`
            <div class="card info-card snooze-info">
              <div class="info-row">
                <span>Snoozed until</span>
                <strong
                  >${formatDateTime(routine.snoozedUntil, {
                    time: snoozeEffectiveTime,
                    todayShort: true,
                  })}</strong
                >
              </div>
              ${cycleNextWithoutSnooze &&
              html`
                <div class="info-row">
                  <span>Cycle resumes</span>
                  <strong
                    >${formatDateTime(cycleNextWithoutSnooze, {
                      time: routine.notifyTime,
                      todayShort: true,
                    })}</strong
                  >
                </div>
              `}
            </div>
          `}
          <div class="details-settings">
            <button
              type="button"
              class="details-settings-toggle"
              onClick=${toggleSettings}
              aria-expanded=${settingsOpen ? "true" : "false"}
            >
              <span>Settings</span>
              <span class="settings-chev">
                <${Icon} name="chevDown" size=${18} />
              </span>
            </button>
            ${settingsOpen &&
            html`
              <div class="menu details-settings-body">

            ...routine,

          onUpdate({

      function SnoozePanel({ routine, onConfirm, onCancel }) {
        const isReminder = routine.type === "reminder";

          routine.notifyTime ||

        const [applyDateFuture, setApplyDateFuture] = useState(false);
        const [applyTimeFuture, setApplyTimeFuture] = useState(false);

        // Quick steppers
        function bumpDate(deltaDays) {
          const d = fromInputDate(date);
          setDate(toInputDate(addDays(d, deltaDays)));
        }

        const targetDate = useMemo(() => fromInputDate(date), [date]);
        const targetValid =
          startOfDay(targetDate).getTime() >= startOfDay(new Date()).getTime();

        function submit() {
          if (!targetValid) return;
          onConfirm({
            date: targetDate,
            time,
            applyDateFuture,
            applyTimeFuture,

        return html`

            style="margin:0 0 16px; color: var(--ink-soft); font-size: 14px; line-height: 1.5;"

          </div>
          ${!isReminder &&
