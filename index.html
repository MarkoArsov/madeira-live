  <body>
    <div id="app"></div>
    <div class="splash" id="splash">
      <div class="splash-mark" aria-label="Mira">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6 L9 18 L18 12 Z" fill="currentColor" />
        </svg>
      </div>
    </div>

    <script type="module">
      /* ============================================================
       Imports
       ============================================================ */
      import { h, render } from "https://esm.sh/preact@10.22.0";
      import {
        useState,
        useEffect,
        useRef,
        useMemo,
        useCallback,
      } from "https://esm.sh/preact@10.22.0/hooks";
      import htm from "https://esm.sh/htm@3.1.1";
      const html = htm.bind(h);

      /* ============================================================
       Constants
       ============================================================ */
      const APP_VERSION = "1.0.0";
      const MADEIRA_CENTER = [32.75, -16.95];
      const MADEIRA_ZOOM = 10;
      const MAX_MOUNTED_TILES = 6;
      const UNMOUNT_DELAY_MS = 2000;
      const WX_TTL_MS = 10 * 60 * 1000;

      // Viewport height is handled in CSS via `100lvh` on body/#app/.pager.
      // iOS PWA standalone has a cold-launch bug where 100vh / 100dvh /
      // visualViewport.height resolve to the *safe* viewport (excluding the
      // home-indicator zone), leaving a band of body background showing. The
      // "large viewport" unit (lvh) explicitly resolves to the maximum possible
      // viewport, sidestepping the bug.

      const LINKS = [
        {
          id: "itinerary",
          label: "Itinerary",
          icon: "document",
          href: "https://docs.google.com/document/d/1i-Vklymq5Wh3YAt_izedDb2oGH0yGbkWNTaCaOhwvCQ/edit?usp=sharing",
        },
        {
          id: "cameras",
          label: "More cameras",
          icon: "camera",
          href: "https://www.madeira-web.com/de/webcams.html",
        },
        {
          id: "bus",
          label: "Bus & airport shuttle",
          icon: "bus",
          href: "https://siga.madeira.gov.pt/aerobus",
        },
        {
          id: "weather",
          label: "Weather forecast",
          icon: "sun-cloud",
          href: "https://www.ipma.pt/en/otempo/prev.localidade.hora/index.jsp#Madeira&Funchal",
        },
        {
          id: "trails-status",
          label: "Trails status map",
          icon: "trail",
          href: "https://visitmadeira.com/en/what-to-do/nature-seekers/notice-to-walkers-and-list-of-walks/",
        },
        {
          id: "simplifica-reservation",
          label: "Simplifica trail reservation",
          icon: "document",
          href: "https://simplifica.madeira.gov.pt/services/78-82-259",
        },
        {
          id: "water",
          label: "Water temperature",
          icon: "droplet",
          href: "https://www.ipma.pt/pt/maritima/costeira/index.jsp?selLocal=182&idLocal=182",
        },
        {
          id: "ferry",
          label: "Porto Santo ferry",
          icon: "ferry",
          href: "https://www.portosantoline.pt/",
        },
        {
          id: "tours",
          label: "Epic Madeira Tours",
          icon: "sparkles",
          href: "https://epicmadeira.com/",
        },
      ];

      function hostnameOf(href) {
        try {
          return new URL(href).hostname.replace(/^www\./, "");
        } catch {
          return href;
        }
      }

      const REGION_FILTERS = [
        { label: "All", match: () => true },
        { label: "Funchal", match: (c) => c.region === "Funchal" },
        { label: "North Coast", match: (c) => c.region === "North Coast" },
        { label: "South Coast", match: (c) => c.region === "South" },
        { label: "Beaches", match: (c) => c.region === "Beaches" },
        { label: "Porto Santo", match: (c) => c.region === "Porto Santo" },
      ];

      /* ============================================================
       Theme management — boot-time theme is already applied by the
       inline <head> script (to avoid first-paint flash). These helpers
       are used by the Settings toggle to switch theme at runtime.
       ============================================================ */
      function readStoredTheme() {
        try {
          const t = localStorage.getItem("mira:theme");
          if (t === "light" || t === "dark") return t;
        } catch {}
        return "light";
      }
      function writeStoredTheme(t) {
        try {
          localStorage.setItem("mira:theme", t);
        } catch {}
      }
      function applyTheme(t) {
        document.documentElement.dataset.theme = t;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta)
          meta.setAttribute("content", t === "dark" ? "#15170F" : "#FFF8EC");
      }

      /* ============================================================
       External links — route through Chrome when the user prefers it,
       otherwise fall back to a normal target=_blank open. The pref is
       a localStorage flag so it can be read synchronously at click time
       without React state plumbing.
       ============================================================ */
      function chromifyUrl(u) {
        if (typeof u !== "string") return u;
        if (u.startsWith("https://")) return "googlechromes://" + u.slice(8);
        if (u.startsWith("http://")) return "googlechrome://" + u.slice(7);
        return u;
      }
      function readChromePref() {
        try {
          return localStorage.getItem("mira:chromeLinks") !== "0";
        } catch {
          return true;
        }
      }
      // Hosts with first-class iOS apps that handle universal links. We always
      // open these as plain https so iOS routes to the installed app (Chrome
      // would otherwise swallow them into the Chrome browser).
      const PREFER_APP_HOSTS = [
        "alltrails.com",
        "komoot.com",
        "komoot.de",
        "youtube.com",
        "m.youtube.com",
        "youtu.be",
        "docs.google.com",
        "accuweather.com",
      ];
      function prefersNativeApp(url) {
        try {
          const h = new URL(url).hostname.replace(/^www\./, "");
          return PREFER_APP_HOSTS.some((d) => h === d || h.endsWith("." + d));
        } catch {
          return false;
        }
      }

      function canUseChromeScheme() {
        const ua = navigator.userAgent || "";
        const isiPhoneOrIPad = /iPhone|iPad|iPod/i.test(ua);
        const isIPadDesktopUA =
          navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
        return isiPhoneOrIPad || isIPadDesktopUA;
      }

      function openExternal(url) {
        if (!url) return;
        if (prefersNativeApp(url)) {
          window.open(url, "_blank", "noopener,noreferrer");
          return;
        }
        if (readChromePref() && canUseChromeScheme()) {
          window.location.href = chromifyUrl(url);
          return;
        }
        window.open(url, "_blank", "noopener,noreferrer");
      }

      /* ============================================================
       Weather sources — hybrid:
         • IPMA (api.ipma.pt)   — primary, real station observations
                                  (temp, humidity, wind, pressure, precip).
                                  One global fetch covers all of Portugal.
         • Open-Meteo           — secondary, used only for the condition
                                  glyph (weather_code) and UV index, since
                                  IPMA does not expose either.
         • Local apparent-temp  — feels-like is computed from IPMA's
                                  measured temp + humidity + wind speed.
       ============================================================ */
      const IPMA_URL =
        "https://api.ipma.pt/open-data/observation/meteorology/stations/obs-surface.geojson";
      const IPMA_TTL_MS = 12 * 60 * 1000;

      function ipmaCacheKey() {
        return "ipma:obs";
      }
      function readIpmaCache() {
        try {
          const raw = sessionStorage.getItem(ipmaCacheKey());
          if (!raw) return null;
          const v = JSON.parse(raw);
          if (Date.now() - v.t > IPMA_TTL_MS) return null;
          return v;
        } catch {
          return null;
        }
      }
      function writeIpmaCache(byStation) {
        try {
          sessionStorage.setItem(
            ipmaCacheKey(),
            JSON.stringify({ t: Date.now(), byStation }),
          );
        } catch {}
      }

      // -99.0 is IPMA's "no data" sentinel — normalise to null at parse time.
      function ipmaVal(v) {
        return v === -99 || v === -99.0 ? null : v;
      }

      // Parse the GeoJSON feature collection into a {stationId -> obs} map,
      // picking the most recent sample per station whose temperature is valid.
      function parseIpma(json) {
        const features = (json && json.features) || [];
        const buckets = new Map(); // stationId -> [features]
        for (const f of features) {
          const p = f.properties || {};
          if (!p.idEstacao || !p.time) continue;
          const arr = buckets.get(p.idEstacao) || [];
          arr.push(p);
          buckets.set(p.idEstacao, arr);
        }
        const byStation = {};
        for (const [id, arr] of buckets.entries()) {
          arr.sort((a, b) => (a.time < b.time ? 1 : -1));
          // Prefer the most recent sample with a usable temperature.
          const chosen =
            arr.find((p) => ipmaVal(p.temperatura) != null) || arr[0];
          byStation[id] = {
            time: chosen.time,
            name: (chosen.localEstacao || "")
              .replace(/^Madeira,\s*/i, "")
              .trim(),
            temp: ipmaVal(chosen.temperatura),
            humidity: ipmaVal(chosen.humidade),
            pressure: ipmaVal(chosen.pressao),
            windKM: ipmaVal(chosen.intensidadeVentoKM),
            windMs: ipmaVal(chosen.intensidadeVento),
            windDir:
              chosen.descDirVento && chosen.descDirVento !== "---"
                ? chosen.descDirVento
                : null,
            precip: ipmaVal(chosen.precAcumulada),
            radiation: ipmaVal(chosen.radiacao),
          };
        }
        return byStation;
      }

      let ipmaInflight = null;
      async function fetchIpma(force = false) {
        if (!force) {
          const cached = readIpmaCache();
          if (cached) return cached.byStation;
        }
        if (ipmaInflight) return ipmaInflight;
        ipmaInflight = fetch(IPMA_URL, { cache: "no-store" })
          .then((r) => {
            if (!r.ok) throw new Error("ipma fetch failed");
            return r.json();
          })
          .then((json) => {
            const byStation = parseIpma(json);
            writeIpmaCache(byStation);
            return byStation;
          })
          .finally(() => {
            ipmaInflight = null;
          });
        return ipmaInflight;
      }

      // 16-point compass for Open-Meteo wind_direction_10m (degrees → label).
      const COMPASS_16 = [
        "N",
        "NNE",
        "NE",
        "ENE",
        "E",
        "ESE",
        "SE",
        "SSE",
        "S",
        "SSW",
        "SW",
        "WSW",
        "W",
        "WNW",
        "NW",
        "NNW",
      ];
      function degToCompass(deg) {
        if (deg == null || isNaN(deg)) return null;
        const i = Math.round((((deg % 360) + 360) % 360) / 22.5) % 16;
        return COMPASS_16[i];
      }

      // Build an IPMA-shaped observation from an Open-Meteo `current` payload so
      // the WeatherCard can fall back to it when IPMA has no data for the station.
      function omToObs(om) {
        if (!om || om.temperature_2m == null) return null;
        const windKM = om.wind_speed_10m != null ? om.wind_speed_10m : null;
        return {
          time: om.time || null,
          name: null,
          temp: om.temperature_2m,
          humidity:
            om.relative_humidity_2m != null ? om.relative_humidity_2m : null,
          pressure: om.surface_pressure != null ? om.surface_pressure : null,
          windKM,
          windMs: windKM != null ? windKM / 3.6 : null,
          windDir: degToCompass(om.wind_direction_10m),
          precip: om.precipitation != null ? om.precipitation : null,
          radiation: null,
        };
      }

      // Australian apparent-temperature (Steadman). Inputs: T °C, RH %, wind m/s.
      function apparentTemperature(t, rh, wsMs) {
        if (t == null) return null;
        const w = wsMs == null || wsMs < 0 ? 0 : wsMs;
        const r = rh == null || rh < 0 ? 0 : rh;
        const e = (r / 100) * 6.105 * Math.exp((17.27 * t) / (237.7 + t));
        return t + 0.33 * e - 0.7 * w - 4.0;
      }

      /* ----- Open-Meteo secondary fetch — glyph + UV only ---------- */
      function wxKey(lat, lng) {
        return `wx:${lat.toFixed(3)},${lng.toFixed(3)}`;
      }
      function wxRead(lat, lng) {
        try {
          const raw = sessionStorage.getItem(wxKey(lat, lng));
          if (!raw) return null;
          const v = JSON.parse(raw);
          if (Date.now() - v.t > WX_TTL_MS) return null;
          return v;
        } catch {
          return null;
        }
      }
      function wxWrite(lat, lng, data) {
        try {
          sessionStorage.setItem(
            wxKey(lat, lng),
            JSON.stringify({ t: Date.now(), data }),
          );
        } catch {}
      }
      async function fetchWeather(lat, lng, force = false) {
        if (!force) {
          const cached = wxRead(lat, lng);
          if (cached) return { ...cached.data, _ts: cached.t, _cached: true };
        }
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=weather_code,uv_index,temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m,wind_direction_10m,precipitation&wind_speed_unit=kmh&timezone=Atlantic%2FMadeira`;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("weather fetch failed");
        const json = await res.json();
        const data = json.current || {};
        wxWrite(lat, lng, data);
        return { ...data, _ts: Date.now(), _cached: false };
      }

      const WMO = {
        0: { label: "Clear", glyph: "sun" },
        1: { label: "Mostly clear", glyph: "sun-cloud" },
        2: { label: "Partly cloudy", glyph: "sun-cloud" },
        3: { label: "Overcast", glyph: "cloud" },
        45: { label: "Fog", glyph: "fog" },
        48: { label: "Rime fog", glyph: "fog" },
        51: { label: "Light drizzle", glyph: "drizzle" },
        53: { label: "Drizzle", glyph: "drizzle" },
        55: { label: "Dense drizzle", glyph: "drizzle" },
        61: { label: "Light rain", glyph: "rain" },
        63: { label: "Rain", glyph: "rain" },
        65: { label: "Heavy rain", glyph: "rain" },
        71: { label: "Light snow", glyph: "snow" },
        73: { label: "Snow", glyph: "snow" },
        75: { label: "Heavy snow", glyph: "snow" },
        80: { label: "Showers", glyph: "showers" },
        81: { label: "Showers", glyph: "showers" },
        82: { label: "Heavy showers", glyph: "showers" },
        95: { label: "Thunderstorm", glyph: "storm" },
        96: { label: "Thunderstorm + hail", glyph: "storm" },
        99: { label: "Thunderstorm + hail", glyph: "storm" },
      };

      function wxInfo(code) {
        return WMO[code] || { label: "—", glyph: "cloud" };
      }

      function relTime(ts) {
        if (!ts) return "";
        const sec = Math.max(0, Math.round((Date.now() - ts) / 1000));
        if (sec < 30) return "just now";
        if (sec < 90) return "1m ago";
        if (sec < 3600) return `${Math.round(sec / 60)}m ago`;
        const hr = Math.round(sec / 3600);
        return `${hr}h ago`;
      }

      /* ============================================================
       Icons (SVG)
       ============================================================ */
      function Icon({ name, ...rest }) {
        const paths = ICONS[name];
        return html`<svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          ...${rest}
        >
          ${paths}
        </svg>`;
      }
      const ICONS = {
        map: html`<path d="M9 4 3 6.5v13L9 17l6 2.5L21 17V4l-6 2.5z" /><path
            d="M9 4v13M15 6.5v13"

      /* ============================================================
       Stream URLs
       ============================================================ */
      function embedUrl(cam) {
        if (cam.type === "youtube") {
          return `https://www.youtube.com/embed/${cam.id}?autoplay=1&mute=1&controls=0&modestbranding=1&playsinline=1&rel=0&loop=1&playlist=${cam.id}`;
        }
        return cam.url;
      }
      function embedUrlFull(cam) {
        // Fullscreen viewer: show controls + allow scrubbing
        if (cam.type === "youtube") {
          return `https://www.youtube.com/embed/${cam.id}?autoplay=1&mute=1&controls=1&modestbranding=1&playsinline=1&rel=0`;
        }
        return cam.url;
      }
      function cameraId(cam) {
        if (cam.type === "youtube") return `yt:${cam.id}`;
        if (cam.type === "weather") return `wx:${cam.stationId || cam.name}`;
        return `if:${cam.url}`;
      }
      function sourceUrl(cam) {
        return cam.type === "youtube"
          ? `https://www.youtube.com/watch?v=${cam.id}`
          : cam.url;
      }
      // mqdefault: 320x180, true 16:9, ~12-20KB — ideal for grid tiles.
      // maxresdefault: 1280x720, only available when YouTube has generated it
      //   (not guaranteed for live streams) — used in the sheet/fullscreen with
      //   a runtime fallback to mqdefault.
      function thumbGrid(cam) {
        if (cam.type !== "youtube") return null;
        return `https://i.ytimg.com/vi/${cam.id}/mqdefault.jpg`;
      }
      function thumbLarge(cam) {
        if (cam.type !== "youtube") return null;
        return `https://i.ytimg.com/vi/${cam.id}/maxresdefault.jpg`;
      }

      /* ============================================================
       Leaflet loader — lazy
       ============================================================ */
      let leafletPromise = null;
      function loadLeaflet() {
        if (leafletPromise) return leafletPromise;
        leafletPromise = new Promise((resolve, reject) => {
          const css = document.createElement("link");
          css.rel = "stylesheet";
          css.href = "./vendor/leaflet/1.9.4/leaflet.css";
          document.head.appendChild(css);

          const s = document.createElement("script");
          s.src = "./vendor/leaflet/1.9.4/leaflet.js";
          s.onload = () => resolve(window.L);
          s.onerror = reject;
          document.head.appendChild(s);
        });
        return leafletPromise;
      }

      /* ============================================================
       Pager — tap-only (swipe gestures intentionally disabled).
       Track width is 400% across 4 pages; transform shifts by 25% per page.
       ============================================================ */
      const PAGE_COUNT = 5;
      function usePager(initial = 0) {
        const [page, setPage] = useState(initial);
        return { page, setPage };
      }

      /* ============================================================
       Pin-cluster algorithm — pixel-space greedy.
       ============================================================ */
      function clusterCameras(cams, map, threshold = 36) {
        const points = cams.map((c, i) => ({
          cam: c,
          idx: i,
          pt: map.latLngToContainerPoint([c.lat, c.lng]),
        }));
        const used = new Set();
        const clusters = [];
        for (let i = 0; i < points.length; i++) {
          if (used.has(i)) continue;
          const group = [points[i]];
          used.add(i);
          for (let j = i + 1; j < points.length; j++) {
            if (used.has(j)) continue;
            const dx = points[i].pt.x - points[j].pt.x;
            const dy = points[i].pt.y - points[j].pt.y;
            if (Math.hypot(dx, dy) < threshold) {
              group.push(points[j]);
              used.add(j);
            }
          }
          clusters.push(group);
        }
        return clusters;
      }

      /* ============================================================
       Map view
       ============================================================ */
      function MapView({ cameras, trails, onSelect, onSelectTrail, active }) {
        const containerRef = useRef(null);
        const mapRef = useRef(null);
        const layersRef = useRef({
          regular: null,
          satellite: null,
          labels: null,
        });
        const markersRef = useRef([]);
        const trailMarkersRef = useRef([]);
        const camerasRef = useRef(cameras);
        const trailsRef = useRef(trails);
        const onSelectRef = useRef(onSelect);
        const onSelectTrailRef = useRef(onSelectTrail);
        const [showTrails, setShowTrails] = useState(() => {
          try {
            return localStorage.getItem("mira:showTrails") === "1";
          } catch {
            return false;
          }
        });
        const showTrailsRef = useRef(showTrails);
        useEffect(() => {
          try {
            localStorage.setItem("mira:showTrails", showTrails ? "1" : "0");
          } catch {}
        }, [showTrails]);
        const [mapMode, setMapMode] = useState(() => {
          try {
            const raw = localStorage.getItem("mira:mapmode");
            return raw === "satellite" ? "satellite" : "regular";
          } catch {}
          return "regular";
        });
        useEffect(() => {
          camerasRef.current = cameras;
        }, [cameras]);
        useEffect(() => {
          trailsRef.current = trails;
        }, [trails]);
        useEffect(() => {
          onSelectRef.current = onSelect;
        }, [onSelect]);
        useEffect(() => {
          onSelectTrailRef.current = onSelectTrail;
        }, [onSelectTrail]);
        useEffect(() => {
          showTrailsRef.current = showTrails;
        }, [showTrails]);

        // Persisted view
        const initialView = useMemo(() => {
          try {
            const raw = localStorage.getItem("mira:mapview");
            if (raw) return JSON.parse(raw);
          } catch {}
          return { center: MADEIRA_CENTER, zoom: MADEIRA_ZOOM };
        }, []);

        const TILE_URL =
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
        const LABELS_URL =
          "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}";
        const OSM_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";

        const applyMapMode = useCallback((mode) => {
          const map = mapRef.current;
          const layers = layersRef.current;
          if (!map || !layers.regular || !layers.satellite || !layers.labels)
            return;
          const isSatellite = mode === "satellite";

          if (isSatellite) {
            if (map.hasLayer(layers.regular)) map.removeLayer(layers.regular);
            if (!map.hasLayer(layers.satellite)) map.addLayer(layers.satellite);
            if (!map.hasLayer(layers.labels)) map.addLayer(layers.labels);
            return;
          }

          if (map.hasLayer(layers.satellite)) map.removeLayer(layers.satellite);
          if (map.hasLayer(layers.labels)) map.removeLayer(layers.labels);
          if (!map.hasLayer(layers.regular)) map.addLayer(layers.regular);
        }, []);

        const rebuildPins = useCallback(() => {
          const L = window.L;
          const cams = camerasRef.current;
          if (!L || !mapRef.current || !cams.length) return;
          const map = mapRef.current;
          markersRef.current.forEach((m) => map.removeLayer(m));
          markersRef.current = [];

          const clusters = clusterCameras(cams, map, 36);
          for (const group of clusters) {
            if (group.length === 1) {
              const { cam } = group[0];
              const isWeather = cam.type === "weather";
              const ic = L.divIcon({
                className: "",
                html: isWeather
                  ? `<div class="pin-wx"><span class="pin-wx-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg></span></div>`
                  : `<div class="pin"><span class="pin-pulse"></span><span class="pin-dot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 7l9 5-9 5z"/></svg></span></div>`,
                iconSize: isWeather ? [30, 30] : [36, 36],
                iconAnchor: isWeather ? [15, 30] : [18, 36],
              });
              const m = L.marker([cam.lat, cam.lng], {
                icon: ic,
                keyboard: false,
              });
              m.on("click", () => onSelectRef.current(cam));
              m.addTo(map);
              markersRef.current.push(m);
            } else {
              const cx =
                group.reduce((s, p) => s + p.cam.lat, 0) / group.length;
              const cy =
                group.reduce((s, p) => s + p.cam.lng, 0) / group.length;
              const ic = L.divIcon({
                className: "",
                html: `<div class="pin-cluster">${group.length}</div>`,
                iconSize: [40, 40],
                iconAnchor: [20, 20],
              });
              const m = L.marker([cx, cy], { icon: ic, keyboard: false });
              m.on("click", () => {
                // zoom into cluster
                const bounds = L.latLngBounds(
                  group.map((p) => [p.cam.lat, p.cam.lng]),
                );
                map.flyToBounds(bounds, {
                  padding: [60, 60],
                  maxZoom: 14,
                  duration: 0.6,
                });
              });
              m.addTo(map);
              markersRef.current.push(m);
            }
          }
        }, []);

        const rebuildTrails = useCallback(() => {
          const L = window.L;
          if (!L || !mapRef.current) return;
          const map = mapRef.current;
          trailMarkersRef.current.forEach((m) => map.removeLayer(m));
          trailMarkersRef.current = [];
          if (!showTrailsRef.current) return;
          const list = trailsRef.current || [];
          for (const t of list) {
            if (!t.location || typeof t.location.lat !== "number") continue;
            const ic = L.divIcon({
              className: "",
              html: `<div class="pin-trail"><span class="pin-trail-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16 L9 7 L12 11 L15 7 L20 16 Z"/></svg></span></div>`,
              iconSize: [30, 30],
              iconAnchor: [15, 30],
            });
            const m = L.marker([t.location.lat, t.location.lng], {
              icon: ic,
              keyboard: false,
            });
            m.on(
              "click",
              () => onSelectTrailRef.current && onSelectTrailRef.current(t),
            );
            m.addTo(map);
            trailMarkersRef.current.push(m);
          }
        }, []);

        useEffect(() => {
          let cancelled = false;
          loadLeaflet()
            .then((L) => {
              if (cancelled || !containerRef.current) return;
              const map = L.map(containerRef.current, {
                zoomControl: false,
                attributionControl: true,
                preferCanvas: false,
                maxBounds: [
                  [32.2, -17.8],
                  [33.4, -15.8],
                ],
                maxBoundsViscosity: 0.7,
              }).setView(initialView.center, initialView.zoom);
              mapRef.current = map;

              layersRef.current.satellite = L.tileLayer(TILE_URL, {
                attribution: "Imagery &copy; Esri",
                detectRetina: true,
                minZoom: 0,
                maxZoom: 19,
              });

              layersRef.current.labels = L.tileLayer(LABELS_URL, {
                attribution: "&copy; Esri",
                detectRetina: true,
                minZoom: 0,
                maxZoom: 19,
                pane: "overlayPane",
              });

              layersRef.current.regular = L.tileLayer(OSM_URL, {
                maxZoom: 19,
                attribution:
                  '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
              });

              applyMapMode(mapMode);

              map.on("moveend zoomend", () => {
                const c = map.getCenter();
                try {
                  localStorage.setItem(
                    "mira:mapview",
                    JSON.stringify({
                      center: [c.lat, c.lng],
                      zoom: map.getZoom(),
                    }),
                  );
                } catch {}
                rebuildPins();
              });

              rebuildPins();
              rebuildTrails();

              // Manual double-tap-zoom for iOS PWA standalone. Leaflet's built-in
              // doubleClickZoom relies on synthesised dblclick events from touch
              // taps, which iOS Safari in standalone PWA mode does not fire
              // reliably. We bind a touchend listener and detect two taps within
              // 320 ms / 30 px ourselves, skipping pins so marker taps still work.
              const tapState = { t: 0, x: 0, y: 0 };
              const onTouchEnd = (e) => {
                if (!e.changedTouches || e.changedTouches.length !== 1) return;
                const target = e.target;
                if (
                  target &&
                  target.closest &&
                  target.closest(
                    ".pin, .pin-cluster, .pin-trail, .pin-wx, .leaflet-control, .map-fab",
                  )
                ) {
                  tapState.t = 0;
                  return;
                }
                const ct = e.changedTouches[0];
                const now = Date.now();
                if (
                  now - tapState.t < 320 &&
                  Math.abs(ct.clientX - tapState.x) < 30 &&
                  Math.abs(ct.clientY - tapState.y) < 30
                ) {
                  e.preventDefault();
                  try {
                    const latlng = map.mouseEventToLatLng({
                      clientX: ct.clientX,
                      clientY: ct.clientY,
                    });
                    const next = Math.min(
                      map.getZoom() + 1,
                      map.getMaxZoom() || 19,
                    );
                    map.setView(latlng, next, { animate: true });
                  } catch {}
                  tapState.t = 0;
                } else {
                  tapState.t = now;
                  tapState.x = ct.clientX;
                  tapState.y = ct.clientY;
                }
              };
              containerRef.current.addEventListener("touchend", onTouchEnd, {
                passive: false,
              });
            })
            .catch(() => {
              /* offline; map cannot load */
            });

          return () => {
            cancelled = true;
          };
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        useEffect(() => {
          try {
            localStorage.setItem("mira:mapmode", mapMode);
          } catch {}
          applyMapMode(mapMode);
        }, [mapMode, applyMapMode]);

        // Rebuild pins when cameras list changes
        useEffect(() => {
          rebuildPins();
        }, [cameras, rebuildPins]);

        // Rebuild trail pins when trails list or visibility toggle changes
        useEffect(() => {
          rebuildTrails();
        }, [trails, showTrails, rebuildTrails]);

        // Invalidate size when map page becomes active (avoid grey tiles after orientation/visibility)
        useEffect(() => {
          if (active && mapRef.current) {
            requestAnimationFrame(() => mapRef.current.invalidateSize());
          }
        }, [active]);

        const recentre = useCallback(() => {
          if (mapRef.current)
            mapRef.current.flyTo(MADEIRA_CENTER, MADEIRA_ZOOM, {
              duration: 0.7,
            });
        }, []);

        return html`
          <div class="page page--map">
            <div class="map-root" ref=${containerRef}></div>
            <button
              class="map-fab"
              onClick=${recentre}
              aria-label="Recentre to Madeira"
            >
              <${Icon} name="target" />
            </button>
            <button
              class="map-fab fab-trails"
              aria-pressed=${showTrails}
              aria-label=${showTrails ? "Hide trails" : "Show trails"}
              onClick=${() => setShowTrails((v) => !v)}
            >
              <${Icon} name="mountain" />
            </button>
            <button
              class="map-fab fab-style"
              aria-pressed=${mapMode === "satellite"}
              aria-label=${mapMode === "satellite"
                ? "Switch to regular map"
                : "Switch to satellite map"}
              onClick=${() =>
                setMapMode((m) =>
                  m === "satellite" ? "regular" : "satellite",
                )}
            >
              <${Icon} name="map" />
            </button>
          </div>
        `;
      }

      /* ============================================================
       Grid tile — Preact renders the shell, iframe src toggled imperatively
       to avoid teardown on parent re-renders.
       ============================================================ */
      /* Weather-only tile — no iframe, just a temperature card. */
      function WeatherTile({ cam, onSelect }) {
        const [obs, setObs] = useState(null);
        useEffect(() => {
          let alive = true;
          const ipmaP = cam.stationId
            ? fetchIpma()
                .then((map) => map[cam.stationId] || null)
                .catch(() => null)
            : Promise.resolve(null);
          const omP =
            cam.lat != null && cam.lng != null
              ? fetchWeather(cam.lat, cam.lng).catch(() => null)
              : Promise.resolve(null);
          Promise.all([ipmaP, omP]).then(([ipma, om]) => {
            if (!alive) return;
            if (ipma && ipma.temp != null) setObs(ipma);
            else setObs(omToObs(om));
          });
          return () => {
            alive = false;
          };
        }, [cam.stationId, cam.lat, cam.lng]);

        const t = obs && obs.temp != null ? Math.round(obs.temp) : null;
        return html`
          <div
            class="tile tile--weather"
            onClick=${() => onSelect(cam)}
            role="button"
            aria-label=${`Open ${cam.name}`}
          >
            <div class="tile-wx-bg" aria-hidden="true"></div>
            <div class="tile-wx-temp">
              ${t != null
                ? html`<span class="num">${t}</span><sup>°</sup>`
                : html`<span class="num">—</span>`}
            </div>
            <div class="tile-overlay">
              <span class="tile-name">${cam.name}</span>
            </div>
          </div>
        `;
      }

      function Tile({ cam, onSelect, registerIframe }) {
        // Weather-only locations render a different tile entirely — they don't
        // own an iframe and never register with the autoplay queue.
        if (cam.type === "weather") {
          return html`<${WeatherTile} cam=${cam} onSelect=${onSelect} />`;
        }
        const ref = useRef(null);
        const iframeRef = useRef(null);
        const id = cameraId(cam);

        useEffect(() => {
          if (ref.current && iframeRef.current) {
            registerIframe(id, ref.current, iframeRef.current, cam);
          }
          return () => registerIframe(id, null, null, null);
        }, [id]);

        const thumb = thumbGrid(cam);
        // Defensive: if mqdefault ever 404s, fall back to hqdefault (cropped 4:3 but always present).
        const onThumbError = useCallback(
          (e) => {
            if (e.currentTarget && cam.type === "youtube") {
              e.currentTarget.src = `https://i.ytimg.com/vi/${cam.id}/hqdefault.jpg`;
              e.currentTarget.onerror = null;
            }
          },
          [cam.id, cam.type],
        );

        return html`
          <div
            class="tile"
            ref=${ref}
            data-cam-id=${id}
            onClick=${() => onSelect(cam)}
            role="button"
            aria-label=${`Open ${cam.name}`}
          >
            ${thumb
              ? html`<img
                  class="tile-thumb"
                  src=${thumb}
                  alt=""
                  loading="lazy"
                  decoding="async"
                  onerror=${onThumbError}
                />`
              : html`<div class="tile-thumb-fallback-rich" aria-hidden="true">
                  <${Icon} name="camera" />
                  <span class="ph-region">${cam.region}</span>
                </div>`}
            <iframe
              class="tile-frame"
              ref=${iframeRef}
              title=${cam.name}
              allow="autoplay; encrypted-media; picture-in-picture"
              allowfullscreen
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
            <div class="tile-overlay">
              <span class="tile-name">${cam.name}</span>
            </div>
          </div>
        `;
      }

      /* ============================================================
       Grid view: filter + tile mounting orchestration
       ============================================================ */
      function GridView({ cameras, onSelect, active, refreshKey }) {
        const [filterIdx, setFilterIdx] = useState(0);
        const filtered = useMemo(
          () => cameras.filter(REGION_FILTERS[filterIdx].match),
          [cameras, filterIdx],
        );

        // Auto-play visible tiles toggle (persisted). When OFF, tiles stay as
        // thumbnails until tapped; when ON, the existing IntersectionObserver
        // mounts visible tiles automatically (legacy behaviour).
        const [autoplay, setAutoplay] = useState(() => {
          try {
            return localStorage.getItem("mira:autoplay") === "1";
          } catch {
            return false;
          }
        });
        const autoplayRef = useRef(autoplay);
        useEffect(() => {
          autoplayRef.current = autoplay;
          try {
            localStorage.setItem("mira:autoplay", autoplay ? "1" : "0");
          } catch {}
        }, [autoplay]);

        const scrollRef = useRef(null);
        const pullRef = useRef(null);
        const tilesRef = useRef(new Map()); // id -> { el, iframe, cam, visible, unmountTimer }
        const mountedQueueRef = useRef([]); // ids in mount order (LRU)
        const ioRef = useRef(null);

        const mountIframe = (id, src) => {
          const e = tilesRef.current.get(id);
          if (!e || !e.iframe) return;
          if (e.iframe.src === src) return;
          e.iframe.src = src;
          // Mark the tile container immediately so the play badge fades out
          // even while YouTube is still showing its grey loading screen.
          if (e.el) e.el.classList.add("is-mounted");
          // YouTube's iframe fires `load` while still showing its own grey loading screen.
          // Keep the thumbnail visible until the video has had a beat to start playing.
          setTimeout(() => {
            if (mountedQueueRef.current.includes(id) && e.iframe) {
              e.iframe.classList.add("mounted");
            }
          }, 1800);
        };
        const unmountIframe = (id) => {
          const e = tilesRef.current.get(id);
          if (!e || !e.iframe) return;
          e.iframe.classList.remove("mounted");
          if (e.el) e.el.classList.remove("is-mounted");
          // Wait for the cross-fade out before swapping src back to blank,
          // so the thumbnail underneath is the visible state during the transition.
          setTimeout(() => {
            if (!mountedQueueRef.current.includes(id) && e.iframe) {
              e.iframe.src = "about:blank";
            }
          }, 450);
        };

        const mountTile = (id) => {
          const e = tilesRef.current.get(id);
          if (!e || !e.cam) return;
          if (mountedQueueRef.current.includes(id)) {
            mountedQueueRef.current = mountedQueueRef.current.filter(
              (x) => x !== id,
            );
            mountedQueueRef.current.push(id);
            return;
          }
          while (mountedQueueRef.current.length >= MAX_MOUNTED_TILES) {
            let evictId = mountedQueueRef.current.find(
              (m) => !tilesRef.current.get(m)?.visible,
            );
            if (!evictId) evictId = mountedQueueRef.current[0];
            mountedQueueRef.current = mountedQueueRef.current.filter(
              (x) => x !== evictId,
            );
            unmountIframe(evictId);
          }
          mountedQueueRef.current.push(id);
          mountIframe(id, embedUrl(e.cam));
        };

        const scheduleUnmount = (id) => {
          const e = tilesRef.current.get(id);
          if (!e) return;
          if (e.unmountTimer) clearTimeout(e.unmountTimer);
          e.unmountTimer = setTimeout(() => {
            if (!tilesRef.current.get(id)?.visible) {
              mountedQueueRef.current = mountedQueueRef.current.filter(
                (x) => x !== id,
              );
              unmountIframe(id);
            }
          }, UNMOUNT_DELAY_MS);
        };

        const cancelUnmount = (id) => {
          const e = tilesRef.current.get(id);
          if (e && e.unmountTimer) {
            clearTimeout(e.unmountTimer);
            e.unmountTimer = null;
          }
        };

        // Initialise IO once. Visibility is always tracked (so eviction-on-scroll
        // still works when autoplay is enabled); but auto-mount only fires when
        // the autoplay toggle is on.
        useEffect(() => {
          ioRef.current = new IntersectionObserver(
            (entries) => {
              for (const en of entries) {
                const id = en.target.dataset.camId;
                const e = tilesRef.current.get(id);
                if (!e) continue;
                e.visible = en.isIntersecting;
                if (en.isIntersecting) {
                  cancelUnmount(id);
                  if (autoplayRef.current) mountTile(id);
                } else if (autoplayRef.current) {
                  // Manual mounts stick until the LRU cap or autoplay toggle handles
                  // them — otherwise tapping a tile then scrolling 1px would tear it
                  // down. Eviction-on-scroll only applies in autoplay mode.
                  scheduleUnmount(id);
                }
              }
            },
            { root: scrollRef.current, rootMargin: "200px 0px", threshold: 0 },
          );
          return () => ioRef.current && ioRef.current.disconnect();
        }, []);

        // When autoplay flips ON, mount currently-visible tiles immediately
        // (the IO won't re-fire for already-intersecting elements).
        // When it flips OFF, unmount everything so the grid is fully passive.
        useEffect(() => {
          if (autoplay) {
            for (const [id, e] of tilesRef.current.entries()) {
              if (e.visible) mountTile(id);
            }
          } else {
            const ids = [...mountedQueueRef.current];
            mountedQueueRef.current = [];
            ids.forEach(unmountIframe);
          }
        }, [autoplay]);

        const registerIframe = useCallback((id, el, iframe, cam) => {
          if (!el) {
            // tile is unmounting
            const e = tilesRef.current.get(id);
            if (e && e.unmountTimer) clearTimeout(e.unmountTimer);
            tilesRef.current.delete(id);
            mountedQueueRef.current = mountedQueueRef.current.filter(
              (x) => x !== id,
            );
            return;
          }
          if (ioRef.current) ioRef.current.unobserve(el);
          tilesRef.current.set(id, {
            el,
            iframe,
            cam,
            visible: false,
            unmountTimer: null,
          });
          if (ioRef.current) ioRef.current.observe(el);
        }, []);

        // Pause all tile iframes when grid is not the active page (battery).
        useEffect(() => {
          if (!active) {
            // Unmount all mounted iframes after a short delay so re-entry is fast for top tiles
            const ids = [...mountedQueueRef.current];
            mountedQueueRef.current = [];
            const t = setTimeout(() => {
              ids.forEach(unmountIframe);
            }, 600);
            return () => clearTimeout(t);
          } else {
            // Re-evaluate visibility — IO will not fire if elements are already in view at mount time
            // because we re-observed them. Trigger a re-eval by scrolling 0px.
            if (scrollRef.current)
              scrollRef.current.scrollTop = scrollRef.current.scrollTop;
          }
        }, [active]);

        /* ----- Pull to refresh ----- */
        const pullState = useRef({
          active: false,
          startY: 0,
          dy: 0,
          refreshing: false,
        });
        const [pullPx, setPullPx] = useState(0);
        const [refreshing, setRefreshing] = useState(false);

        const onTouchStart = (e) => {
          const sc = scrollRef.current;
          if (!sc || sc.scrollTop > 0) return;
          if (e.touches.length !== 1) return;
          pullState.current.active = true;
          pullState.current.startY = e.touches[0].clientY;
          pullState.current.dy = 0;
        };
        const onTouchMove = (e) => {
          const ps = pullState.current;
          if (!ps.active) return;
          const dy = e.touches[0].clientY - ps.startY;
          if (dy < 0) {
            ps.dy = 0;
            setPullPx(0);
            return;
          }
          ps.dy = Math.min(120, dy * 0.5);
          setPullPx(ps.dy);
        };
        const onTouchEnd = async () => {
          const ps = pullState.current;
          if (!ps.active) return;
          ps.active = false;
          const trigger = ps.dy > 56;
          if (trigger && !refreshing) {
            setRefreshing(true);
            setPullPx(56);
            await refreshWeather();
            setRefreshing(false);
            setPullPx(0);
          } else {
            setPullPx(0);
          }
        };
        const refreshWeather = async () => {
          // Force re-fetch IPMA (one global call) + Open-Meteo for visible cams.
          const visible = filtered.filter(
            (c) => tilesRef.current.get(cameraId(c))?.visible,
          );
          await Promise.all([
            fetchIpma(true).catch(() => null),
            ...visible.map((c) =>
              fetchWeather(c.lat, c.lng, true).catch(() => null),
            ),
          ]);
        };

        // Re-fetch on refreshKey change (theme toggles etc. won't trigger; only pull)
        useEffect(() => {}, [refreshKey]);

        const [chipsScrolled, setChipsScrolled] = useState(false);
        const onGridScroll = (e) => {
          const next = e.currentTarget.scrollTop > 0;
          setChipsScrolled((prev) => (prev === next ? prev : next));
        };

        return html`
          <div class="page page--grid">
            <div
              class="grid-scroll"
              ref=${scrollRef}
              onScroll=${onGridScroll}
              onTouchStart=${onTouchStart}
              onTouchMove=${onTouchMove}
              onTouchEnd=${onTouchEnd}
            >
              <div
                class="pull-indicator"
                style=${{
                  transform: `translateY(${pullPx - 56}px)`,
                  opacity: pullPx > 8 ? 1 : 0,
                }}
              >
                ${refreshing
                  ? html`<span class="pull-spinner"></span>Refreshing weather`
                  : "Pull to refresh"}
              </div>
              <div
                class="grid-pull-wrap ${refreshing ? "dragging" : ""}"
                ref=${pullRef}
                style=${{ transform: `translate3d(0, ${pullPx}px, 0)` }}
              >
                <header class="grid-head">
                  <h1 class="grid-h1 serif">Live across the island.</h1>
                  <p class="grid-lede">
                    Real-time views and weather from cameras across Madeira and
                    Porto Santo.
                  </p>
                </header>
                <div
                  class=${`chips-row${chipsScrolled ? " chips-row--scrolled" : ""}`}
                >
                  <div class="chips" role="tablist" aria-label="Region filter">
                    ${REGION_FILTERS.map(
                      (f, i) =>
                        html` <button
                          class="chip"
                          key=${f.label}
                          aria-pressed=${i === filterIdx}
                          onClick=${() => setFilterIdx(i)}
                        >
                          ${f.label}
                        </button>`,
                    )}
                  </div>
                </div>
                <div class="grid">
                  ${filtered.map(
                    (c) =>
                      html`<${Tile}
                        key=${cameraId(c)}
                        cam=${c}
                        onSelect=${onSelect}
                        registerIframe=${registerIframe}
                      />`,
                  )}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      /* ============================================================
       Weather card — IPMA primary, Open-Meteo for glyph + UV.
       Renders every stat individually, hiding any that the station
       reports as -99 (no data). The card only shows the unavailable
       state when the headline temperature itself is missing.
       ============================================================ */
      function WeatherCard({ cam, refreshKey }) {
        const [state, setState] = useState({ loading: true });

        useEffect(() => {
          let alive = true;
          setState({ loading: true });

          const ipmaP = cam.stationId
            ? fetchIpma()
                .then((map) => map[cam.stationId] || null)
                .catch(() => null)
            : Promise.resolve(null);
          const omP = fetchWeather(cam.lat, cam.lng).catch(() => null);

          Promise.all([ipmaP, omP]).then(([obs, om]) => {
            if (!alive) return;
            setState({ loading: false, obs, om });
          });
          return () => {
            alive = false;
          };
        }, [cam.stationId, cam.lat, cam.lng, refreshKey]);

        if (state.loading) {
          return html`
            <div class="weather">
              <div class="weather-skel-row"></div>
              <div class="weather-skel-row short"></div>
            </div>
          `;
        }
        const { om } = state;
        let { obs } = state;
        if (!obs || obs.temp == null) obs = omToObs(om);
        if (!obs || obs.temp == null) {
          return html`<div class="weather">
            <div class="weather-error">Weather unavailable.</div>
          </div>`;
        }

        const wx =
          om && om.weather_code != null ? wxInfo(om.weather_code) : null;
        const uv =
          om && om.uv_index != null
            ? Math.max(0, Math.round(om.uv_index))
            : null;
        const tRound = Math.round(obs.temp);

        // IPMA returns timezone-naive timestamps in Atlantic/Madeira local time
        // (UTC in winter, UTC+1 in summer). Treat as UTC for relative-time
        // display — a one-hour offset is acceptable for an "X ago" string.
        const obsTs = obs.time
          ? new Date(obs.time + "Z").getTime()
          : Date.now();

        // Build the stats grid. Each cell is only rendered when its source value exists.
        const stats = [];
        if (obs.windKM != null) {
          stats.push({
            k: "Wind",
            v: html`<span class="num">${Math.round(obs.windKM)}</span>
              <span class="weather-stat-unit">km/h</span>${obs.windDir
                ? html` <span class="weather-stat-dir">${obs.windDir}</span>`
                : null}`,
          });
        }
        if (obs.humidity != null) {
          stats.push({
            k: "Humidity",
            v: html`<span class="num">${Math.round(obs.humidity)}</span
              ><span class="weather-stat-unit">%</span>`,
          });
        }
        if (obs.precip != null) {
          stats.push({
            k: "Rain",
            v: html`<span class="num">${obs.precip.toFixed(1)}</span>
              <span class="weather-stat-unit">mm</span>`,
          });
        }
        if (obs.pressure != null) {
          stats.push({
            k: "Pressure",
            v: html`<span class="num">${Math.round(obs.pressure)}</span>
              <span class="weather-stat-unit">hPa</span>`,
          });
        }
        if (uv != null) {
          stats.push({
            k: "UV index",
            v: html`<span class="num">${uv}</span>`,
          });
        }

        return html`
          <div class="weather">
            <div class="weather-top">
              <div class="weather-temp num">${tRound}<sup>°C</sup></div>
              ${wx
                ? html`<div class="weather-glyph">
                    <${Icon} name=${wx.glyph} />
                  </div>`
                : null}
            </div>
            ${wx
              ? html` <div class="weather-condition">
                  <span>${wx.label}</span>
                </div>`
              : null}
            ${stats.length > 0 &&
            html` <div class="weather-stats" data-count=${stats.length}>
              ${stats.map(
                (s) =>
                  html` <div key=${s.k}>
                    <div class="weather-stat-key">${s.k}</div>
                    <div class="weather-stat-val">${s.v}</div>
                  </div>`,
              )}
            </div>`}
            <div class="weather-footer">
              <span class="weather-updated">Updated ${relTime(obsTs)}</span>
              ${cam.lat != null &&
              cam.lng != null &&
              html` <button
                class="weather-deeplink"
                type="button"
                onClick=${() =>
                  openExternal(
                    `https://www.accuweather.com/en/search-locations?query=${cam.lat},${cam.lng}`,
                  )}
                aria-label="Open this location in AccuWeather"
              >
                <span>Open in AccuWeather</span>
                <${Icon} name="external" />
              </button>`}
            </div>
          </div>
        `;
      }

      /* ============================================================
       useSheetDismiss — shared swipe-to-close behaviour.
       Pointer-events based (works for touch + mouse). The drag zone is the
       handle + header; the body also drags but only when scrolled to top.
       ============================================================ */
      function useSheetDismiss(onClose) {
        const [open, setOpen] = useState(false);
        const [dragY, setDragY] = useState(0);
        const [dragging, setDragging] = useState(false);
        const drag = useRef({
          active: false,
          startY: 0,
          dy: 0,
          fromBody: false,
        });

        useEffect(() => {
          const id = requestAnimationFrame(() => setOpen(true));
          document.body.style.overflow = "hidden";
          return () => {
            cancelAnimationFrame(id);
            document.body.style.overflow = "";
          };
        }, []);

        const requestClose = useCallback(() => {
          setDragY(0);
          setDragging(false);
          setOpen(false);
          setTimeout(onClose, 320);
        }, [onClose]);

        useEffect(() => {
          const onKey = (e) => {
            if (e.key === "Escape") requestClose();
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [requestClose]);

        const onPointerDown = useCallback((e) => {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          // If pointer starts inside .sheet-body, only drag when scrollTop is at 0.
          const body = e.target.closest(".sheet-body");
          if (body && body.scrollTop > 0) return;
          drag.current = {
            active: true,
            startY: e.clientY,
            dy: 0,
            fromBody: !!body,
          };
          setDragging(true);
          try {
            e.currentTarget.setPointerCapture(e.pointerId);
          } catch (_) {}
        }, []);

        const onPointerMove = useCallback((e) => {
          const d = drag.current;
          if (!d.active) return;
          const dy = e.clientY - d.startY;
          // From the body, only register a drag once it clearly outpaces a native fingertip jitter.
          if (d.fromBody && dy < 6) {
            setDragY(0);
            return;
          }
          if (dy <= 0) {
            d.dy = 0;
            setDragY(0);
            return;
          }
          d.dy = dy;
          setDragY(dy);
        }, []);

        const onPointerEnd = useCallback(() => {
          const d = drag.current;
          if (!d.active) return;
          d.active = false;
          setDragging(false);
          if (d.dy > 90) requestClose();
          else setDragY(0);
        }, [requestClose]);

        const dragProps = {
          onPointerDown,
          onPointerMove,
          onPointerUp: onPointerEnd,
          onPointerCancel: onPointerEnd,
        };

        return { open, dragY, dragging, requestClose, dragProps };
      }

      /* ============================================================
       Stream poster — paints behind the embedded iframe so the user sees
       the scene immediately, not a black/grey YouTube preroll. Starts with
       mqdefault (always present) and upgrades to maxresdefault if YouTube
       has actually generated it for this stream.
       ============================================================ */
      function useStreamPoster(cam) {
        const [poster, setPoster] = useState(() => thumbGrid(cam));
        useEffect(() => {
          if (!cam || cam.type !== "youtube") {
            setPoster(null);
            return;
          }
          const mq = thumbGrid(cam);
          setPoster(mq);
          const big = thumbLarge(cam);
          if (!big) return;
          const img = new Image();
          img.onload = () => {
            // YouTube serves a 120x90 sentinel when maxres is unavailable.
            if (img.naturalWidth > 320) setPoster(big);
          };
          img.onerror = () => {
            /* keep mqdefault */
          };
          img.src = big;
          return () => {
            img.onload = null;
            img.onerror = null;
          };
        }, [cam && cam.id, cam && cam.type]);
        return poster ? `url("${poster}")` : "none";
      }

      /* ============================================================
       Detail sheet
       ============================================================ */
      function DetailSheet({ cam, onClose, onFullscreen }) {
        const { open, dragY, dragging, requestClose, dragProps } =
          useSheetDismiss(onClose);
        const handleClose = requestClose;
        const posterBg = useStreamPoster(cam);
        const sheetStyle =
          dragY > 0
            ? {
                transform: `translate3d(0, ${dragY}px, 0)`,
                opacity: Math.max(0.55, 1 - dragY / 380),
              }
            : null;
        const scrimStyle =
          dragY > 0 ? { opacity: Math.max(0, 1 - dragY / 220) } : null;

        return html`
          <div class="sheet-portal" data-open=${open}>
            <div
              class="sheet-scrim"
              onClick=${handleClose}
              style=${scrimStyle}
            ></div>
            <div
              class="sheet ${dragging ? "dragging" : ""}"
              style=${sheetStyle}
              role="dialog"
              aria-modal="true"
              aria-label=${cam.name}
            >
              <div
                class="sheet-drag-zone"
                ...${dragProps}
                aria-label="Drag down to close"
              >
                <div class="sheet-grabber" aria-hidden="true"></div>
                <div class="sheet-head">
                  <div class="sheet-title-block">
                    <div class="sheet-region">${cam.region}</div>
                    <h2 class="sheet-title">${cam.name}</h2>
                  </div>
                  <button

      /* ============================================================
       Trails — list view + detail sheet
       ============================================================ */
      function parseDurationHours(raw) {
        if (!raw || typeof raw !== "string") return null;
        const nums = raw.match(/\d+(?:\.\d+)?/g);
        if (!nums || nums.length === 0) return null;
        const values = nums.map((n) => Number(n)).filter(Number.isFinite);
        if (!values.length) return null;
        return Math.max(...values);
      }

      function parseDifficultyRank(raw) {
        if (!raw || typeof raw !== "string") return null;
        const v = raw.toLowerCase();
        if (v.includes("very easy")) return 0;
        const tags = [];
        if (v.includes("easy-moderate")) tags.push(2);
        if (v.includes("moderate-hard")) tags.push(4);
        if (v.includes("easy")) tags.push(1);
        if (v.includes("moderate")) tags.push(3);
        if (v.includes("hard")) tags.push(5);
        if (!tags.length) return null;
        return Math.max(...tags);
      }

      function parsePopularityRank(raw) {
        if (!raw || typeof raw !== "string") return null;
        const v = raw.trim().toLowerCase();
        if (v === "very low") return 0;
        if (v === "low") return 1;
        if (v === "medium") return 2;
        if (v === "high") return 3;
        if (v === "very high") return 4;
        return null;
      }

      function parsePrSortKey(prCode) {
        if (!prCode || typeof prCode !== "string")
          return [Number.POSITIVE_INFINITY];
        const normalized = prCode
          .trim()
          .toLowerCase()
          .replace(/^pr\s*/i, "");
        const parts = normalized.match(/\d+|[a-z]+/g);
        if (!parts) return [Number.POSITIVE_INFINITY];
        return parts.map((part) => (/^\d+$/.test(part) ? Number(part) : part));
      }

      function comparePrCodes(aCode, bCode) {
        const a = parsePrSortKey(aCode);
        const b = parsePrSortKey(bCode);
        const len = Math.max(a.length, b.length);
        for (let i = 0; i < len; i += 1) {
          const av = a[i];
          const bv = b[i];
          if (av == null && bv == null) return 0;
          if (av == null) return -1;
          if (bv == null) return 1;
          const aNum = typeof av === "number";
          const bNum = typeof bv === "number";
          if (aNum && bNum) {
            if (av < bv) return -1;
            if (av > bv) return 1;
          } else if (aNum && !bNum) {
            return -1;
          } else if (!aNum && bNum) {
            return 1;
          } else {
            const cmp = String(av).localeCompare(String(bv));
            if (cmp !== 0) return cmp;
          }
        }
        return 0;
      }

      function trailSearchText(trail) {
        return [
          trail.name,
          trail.pr_code,
          trail.alternative_names,
          trail.highlights,
          trail.start_point,
          trail.end_point,
          trail.difficulty,
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
      }

      function TrailCard({ trail, onSelect, isFav, toggleFav }) {
        const [imgOk, setImgOk] = useState(true);
        const distance = trail.distance_km;
        const difficulty = trail.difficulty;
        const duration = trail.duration_hours;
        const bits = [];
        if (distance != null) bits.push(html`<strong>${distance}</strong> km`);
        if (difficulty) bits.push(difficulty);
        if (distance == null && duration) bits.push(`${duration} h`);
        return html`
          <div class="trail-card-wrap">
            <button
              class="trail-card"
              onClick=${() => onSelect(trail)}
              aria-label=${`Open ${trail.name}`}
            >
              ${imgOk && trail.image
                ? html`<img
                    class="trail-thumb"
                    src=${trail.image}
                    alt=""
                    loading="lazy"
                    decoding="async"
                    onerror=${() => setImgOk(false)}
                  />`
                : html`<div class="trail-thumb-fallback">
                    <${Icon} name="mountain" />
                  </div>`}
              <div class="trail-meta">
                <div class="trail-code">${trail.pr_code}</div>
                <h3 class="trail-name serif">${trail.name}</h3>
                <div class="trail-row">
                  ${bits.map(
                    (b, i) =>
                      html`<span class="trail-bit" key=${`b${i}`}>
                        ${i > 0 ? html`<span class="dot"></span>` : null}
                        <span>${b}</span>

                  )}

            <button
              class="trail-fav"
              aria-pressed=${isFav}
              aria-label=${isFav
                ? `Remove ${trail.name} from favorites`

              onClick=${(e) => {
                e.stopPropagation();
                toggleFav(trail.pr_code);
              }}

              <${Icon} name=${isFav ? "heart-fill" : "heart"} />
            </button>
          </div>
        `;
      }

      function TrailsView({ trails, onSelect, favs, toggleFav }) {
        const [showFavsOnly, setShowFavsOnly] = useState(false);
        const [query, setQuery] = useState("");
        const [sortField, setSortField] = useState("popularity");
        const [sortDir, setSortDir] = useState("desc");
        const [sortOpen, setSortOpen] = useState(false);
        const [toolsScrolled, setToolsScrolled] = useState(false);
        const sortRef = useRef(null);

        const onTrailsScroll = (e) => {
          const next = e.currentTarget.scrollTop > 0;
          setToolsScrolled((prev) => (prev === next ? prev : next));
        };

        const sortFieldLabels = {
          popularity: "Popularity",
          pr: "PR number",
          difficulty: "Difficulty",
          distance: "Distance",
          duration: "Duration",
          elevation: "Elevation",
        };

        const sortLabel = `Sort: ${sortFieldLabels[sortField]} (${sortDir === "asc" ? "Ascending" : "Descending"})`;

        useEffect(() => {
          if (!sortOpen) return;
          const onPointerDown = (e) => {
            const node = sortRef.current;
            if (node && !node.contains(e.target)) setSortOpen(false);
          };
          const onKeyDown = (e) => {
            if (e.key === "Escape") setSortOpen(false);
          };
          document.addEventListener("pointerdown", onPointerDown);
          window.addEventListener("keydown", onKeyDown);
          return () => {
            document.removeEventListener("pointerdown", onPointerDown);
            window.removeEventListener("keydown", onKeyDown);
          };
        }, [sortOpen]);

        const visible = useMemo(() => {
          const q = query.trim().toLowerCase();
          let base = showFavsOnly
            ? trails.filter((t) => favs.has(t.pr_code))
            : trails;
          if (q)
            base = base.filter((trail) => trailSearchText(trail).includes(q));

          const direction = sortDir === "desc" ? -1 : 1;
          const withIndex = base.map((trail, idx) => ({ trail, idx }));
          const valueOf = (trail) => {
            if (sortField === "popularity")
              return parsePopularityRank(trail.popularity);
            if (sortField === "pr") return parsePrSortKey(trail.pr_code);
            if (sortField === "distance") return trail.distance_km;
            if (sortField === "elevation") return trail.elevation_gain_m;
            if (sortField === "duration")
              return parseDurationHours(trail.duration_hours);
            if (sortField === "difficulty")
              return parseDifficultyRank(trail.difficulty);
            return null;
          };

          withIndex.sort((a, b) => {
            if (sortField === "pr") {
              const cmp = comparePrCodes(a.trail.pr_code, b.trail.pr_code);
              if (cmp !== 0) return cmp * direction;
              return a.idx - b.idx;
            }
            const av = valueOf(a.trail);
            const bv = valueOf(b.trail);
            if (av == null && bv == null) return a.idx - b.idx;
            if (av == null) return 1;
            if (bv == null) return -1;
            if (av < bv) return -1 * direction;
            if (av > bv) return 1 * direction;
            return a.idx - b.idx;
          });

          return withIndex.map((entry) => entry.trail);
        }, [trails, showFavsOnly, favs, query, sortField, sortDir]);
        // Auto-disable the filter if the user un-favorites their last trail
        // while the filter is active — otherwise they'd see an empty list with
        // no obvious way back.
        useEffect(() => {
          if (showFavsOnly && favs.size === 0) setShowFavsOnly(false);
        }, [favs.size, showFavsOnly]);

        return html`
          <div class="page page--trails">
            <div class="trails-scroll" onScroll=${onTrailsScroll}>
              <div class="trails-inner">
                <header class="trails-head">
                  <div class="trails-eyebrow">Mira · Trails</div>
                  <h1 class="trails-h1 serif">Walk the laurel.</h1>
                  <p class="trails-lede">
                    All ${trails.length} official PR hiking trails across
                    Madeira and Porto Santo.
                  </p>
                </header>
                <div
                  class=${`trails-tools${toolsScrolled ? " trails-tools--scrolled" : ""}`}
                >
                  <div class="trails-search-wrap">
                    <span class="trails-search-icon"
                      ><${Icon} name="search"
                    /></span>
                    <input
                      class="trails-search"
                      type="search"
                      value=${query}
                      onInput=${(e) => setQuery(e.target.value)}
                      placeholder="Search trails, codes, highlights, start/end, difficulty"
                    />
                  </div>
                  <div
                    class=${`trails-sort-row${favs.size > 0 ? "" : " trails-sort-row--single"}`}
                  >
                    <div class="trails-sort" ref=${sortRef}>
                      <button
                        class="trails-sort-trigger"
                        type="button"
                        data-open=${sortOpen}
                        aria-haspopup="menu"
                        aria-expanded=${sortOpen}
                        onClick=${() => setSortOpen((v) => !v)}
                      >
                        <span class="trails-sort-label">${sortLabel}</span>
                        <span class="trails-sort-chevron"
                          ><${Icon} name="chevron-down"
                        /></span>
                      </button>
                      <div
                        class="trails-sort-panel"
                        data-open=${sortOpen}
                        role="menu"
                        aria-label="Sort trails"
                      >
                        <div class="trails-sort-group">
                          <p class="trails-sort-k">Type</p>
                          <div class="trails-sort-options">
                            ${Object.entries(sortFieldLabels).map(
                              ([value, label]) =>
                                html` <button
                                  class="trails-sort-opt"
                                  type="button"
                                  key=${value}
                                  role="menuitemradio"
                                  aria-checked=${sortField === value}
                                  aria-pressed=${sortField === value}
                                  onClick=${() => setSortField(value)}
                                >
                                  ${label}
                                </button>`,
                            )}
                          </div>
                        </div>
                        <div class="trails-sort-group">
                          <p class="trails-sort-k">Order</p>
                          <div class="trails-sort-options">
                            <button
                              class="trails-sort-opt"
                              type="button"
                              role="menuitemradio"
                              aria-checked=${sortDir === "asc"}
                              aria-pressed=${sortDir === "asc"}
                              onClick=${() => setSortDir("asc")}
                            >
                              Ascending
                            </button>
                            <button
                              class="trails-sort-opt"
                              type="button"
                              role="menuitemradio"
                              aria-checked=${sortDir === "desc"}
                              aria-pressed=${sortDir === "desc"}
                              onClick=${() => setSortDir("desc")}
                            >
                              Descending
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                    ${favs.size > 0 &&
                    html` <button
                      class="chip-toggle trails-favs-toggle"
                      aria-pressed=${showFavsOnly}
                      aria-label=${showFavsOnly
                        ? `Show all trails (${favs.size} favorites saved)`
                        : `Show favorites only (${favs.size})`}
                      onClick=${() => setShowFavsOnly((v) => !v)}
                    >
                      <${Icon} name=${showFavsOnly ? "heart-fill" : "heart"} />
                    </button>`}
                  </div>
                </div>
                <div class="trails-list">
                  ${visible.map(
                    (t) =>
                      html`<${TrailCard}
                        key=${t.pr_code}
                        trail=${t}
                        onSelect=${onSelect}
                        isFav=${favs.has(t.pr_code)}
                        toggleFav=${toggleFav}
                      />`,
                  )}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function TrailSheet({ trail, onClose, isFav, toggleFav }) {
        const [imgOk, setImgOk] = useState(true);
        const { open, dragY, dragging, requestClose, dragProps } =
          useSheetDismiss(onClose);
        const handleClose = requestClose;
        const sheetStyle =
          dragY > 0
            ? {
                transform: `translate3d(0, ${dragY}px, 0)`,
                opacity: Math.max(0.55, 1 - dragY / 380),
              }
            : null;
        const scrimStyle =
          dragY > 0 ? { opacity: Math.max(0, 1 - dragY / 220) } : null;

        const stats = [];
        if (trail.popularity) stats.push(["Popularity", trail.popularity]);
        if (trail.difficulty) stats.push(["Difficulty", trail.difficulty]);
        if (trail.distance_km != null)
          stats.push(["Distance", `${trail.distance_km} km`]);
        if (trail.duration_hours)
          stats.push(["Duration", `${trail.duration_hours} h`]);
        if (trail.elevation_gain_m != null)
          stats.push(["Elevation", `${trail.elevation_gain_m} m`]);

        const kv = [];
        if (trail.type) kv.push(["Type", trail.type]);
        if (trail.start_point) kv.push(["Start", trail.start_point]);
        if (trail.end_point) kv.push(["End", trail.end_point]);
        if (trail.fee_amount) kv.push(["Fee", trail.fee_amount]);
        if (trail.parking_location)
          kv.push(["Parking", trail.parking_location]);
        if (trail.parking_cost) kv.push(["Parking cost", trail.parking_cost]);
        if (trail.exposure_rating != null)
          kv.push(["Exposure", `${trail.exposure_rating} / 5`]);
        if (trail.tunnels && trail.tunnels.has_tunnels) {
          kv.push([
            "Tunnels",
            trail.tunnels.headlamp_required ? "Yes — headlamp required" : "Yes",
          ]);
        }

        // Curated deep links per trail (set in hikes.json). Each button only
        // renders when its URL is present and non-empty — no fallback link.
        const externalCtas = [];
        if (trail.alltrails_url)
          externalCtas.push({ label: "AllTrails", href: trail.alltrails_url });
        if (trail.komoot_url)
          externalCtas.push({ label: "Komoot", href: trail.komoot_url });

        return html`
          <div class="sheet-portal" data-open=${open}>
            <div
              class="sheet-scrim"
              onClick=${handleClose}
              style=${scrimStyle}
            ></div>
            <div

              style=${sheetStyle}
              role="dialog"
              aria-modal="true"
              aria-label=${trail.name}
            >
              <div
                class="sheet-drag-zone"
                ...${dragProps}
                aria-label="Drag down to close"
              >
                <div class="sheet-grabber" aria-hidden="true"></div>
