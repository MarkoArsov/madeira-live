                  <div class="sheet-title-block">
                    <div class="sheet-region">${trail.pr_code}</div>
                    <h2 class="sheet-title">${trail.name}</h2>
                  </div>
                  <button
                    class="sheet-close"
                    onPointerDown=${(e) => e.stopPropagation()}
                    onClick=${handleClose}
                    aria-label="Close"
                  >
                    <${Icon} name="close" />
                  </button>
                </div>
              </div>
              <div class="sheet-body">
                <div class="trail-hero">
                  ${imgOk && trail.image
                    ? html`<img
                        src=${trail.image}
                        alt=""
                        loading="lazy"
                        decoding="async"
                        onerror=${() => setImgOk(false)}
                      />`
                    : html`<div class="trail-hero-fallback">
                        <${Icon} name="mountain" />
                      </div>`}
                  <button
                    class="trail-hero-fav"
                    aria-pressed=${isFav}
                    aria-label=${isFav
                      ? "Remove from favorites"
                      : "Add to favorites"}
                    onClick=${() => toggleFav(trail.pr_code)}
                  >
                    <${Icon} name=${isFav ? "heart-fill" : "heart"} />
                  </button>
                </div>

                ${trail.alternative_names &&
                html`<p class="trail-alt-name">${trail.alternative_names}</p>`}
                ${trail.highlights &&
                html`<p class="trail-highlights">${trail.highlights}</p>`}
                ${stats.length > 0 &&
                html`
                  <div class="trail-stats">
                    ${stats.map(
                      ([k, v]) =>
                        html` <div class="trail-stat" key=${k}>
                          <div class="trail-stat-key">${k}</div>
                          <div class="trail-stat-val">${v}</div>
                        </div>`,

                ${trail.safety_notes &&
                html` <section class="trail-section">
                  <div class="trail-section-label">Safety</div>
                  <p>${trail.safety_notes}</p>

                ${trail.equipment_needed &&
                html` <section class="trail-section">
                  <div class="trail-section-label">Equipment</div>
                  <p>${trail.equipment_needed}</p>
                </section>`}
                ${trail.best_season &&
                html` <section class="trail-section">

                  <p>${trail.best_season}</p>

                ${trail.exposure_notes &&
                html` <section class="trail-section">

                    class="trail-cta"

                    <${Icon} name="external" />

                      )}

                    <${Icon} name="external" />
                    Reservation
                  </button>
                </div>

                ${externalCtas.length > 0 &&
                html` <div
                  class="trail-cta-pair"
                  data-count=${externalCtas.length}
                >
                  ${externalCtas.map(
                    (c) =>
                      html` <button
                        class="trail-cta-secondary"

                        type="button"
                        onClick=${() => openExternal(c.href)}
                      >
                        <${Icon} name="external" />
                        ${c.label}
                      </button>`,
                  )}
                </div>`}
              </div>
            </div>
          </div>
        `;
      }

                    <span class="pref-switch" aria-hidden="true"></span>
                  </button>
                  <button
                    class="pref-row"
                    aria-pressed=${theme === "dark"}
                    onClick=${() =>
                      setTheme(theme === "dark" ? "light" : "dark")}
                  >
                    <span class="pref-text">
                      <span class="pref-title">Dark theme</span>
                      <span class="pref-sub"
                        >Switch between the cream daylight palette and the
                        basalt night palette.</span
                      >
                    </span>
                    <span class="pref-switch" aria-hidden="true"></span>
                  </button>
                </section>

                <section class="settings-group">
                  <div class="settings-group-label">By region</div>
                  <ul class="region-list">
                    ${regions.map(
                      ([r, n]) =>
                        html` <li class="region-row" key=${r}>
                          <span class="region-name">${r}</span>
                          <span class="region-count num">${n}</span>
                        </li>`,
                    )}
                  </ul>
                </section>

                <section class="settings-group">
                  <div class="settings-group-label">About</div>
                  <div class="about">
                    <p class="about-p">
                      Streams sourced openly via YouTube and madeirawebcams.com.
                      Observations by ${' '}
                      <a href="https://www.ipma.pt"
                         onClick=${(e) => { e.preventDefault(); openExternal("https://www.ipma.pt"); }}>IPMA</a>${' '}
                      with Open-Meteo as a fallback; condition icons and UV
                      index by ${' '}
                      <a href="https://open-meteo.com"
                         onClick=${(e) => { e.preventDefault(); openExternal("https://open-meteo.com"); }}>Open-Meteo</a>.
                      Map view toggle: Regular by OpenStreetMap, Satellite
                      imagery and labels by Esri.
                    </p>
                    <p class="about-meta">
                      Mira runs entirely on your device. No accounts, no
                      tracking, no servers between you and the cameras.
                    </p>
                    <div class="about-version">Version ${APP_VERSION}</div>
                  </div>
                </section>
              </div>
            </div>
          </div>
        `;
      }

      /* ============================================================
       Fullscreen viewer
       ============================================================ */
      function Fullscreen({ cam, onClose }) {
        const [open, setOpen] = useState(false);
        const posterBg = useStreamPoster(cam);
        useEffect(() => {
          const id = requestAnimationFrame(() => setOpen(true));
          document.body.style.overflow = "hidden";
          return () => {
            cancelAnimationFrame(id);
            document.body.style.overflow = "";
          };
        }, []);
        const handleClose = () => {
          setOpen(false);
          setTimeout(onClose, 240);
        };
        useEffect(() => {
          const onKey = (e) => {
            if (e.key === "Escape") handleClose();
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, []);
        return html`
          <div class="fs" data-open=${open}>
            <div class="fs-inner" style=${{ backgroundImage: posterBg }}>
              <iframe
                src=${embedUrlFull(cam)}
                title=${cam.name}
                allow="autoplay; encrypted-media; picture-in-picture"
                allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"
              ></iframe>
            </div>
            <button
              class="fs-close"
              onClick=${handleClose}
              aria-label="Close fullscreen"
            >
              <${Icon} name="close" />
            </button>
          </div>
        `;
      }

      /* ============================================================
       App
       ============================================================ */
      function App() {
        const [cameras, setCameras] = useState([]);
        const [trails, setTrails] = useState([]);
        const [sheetCam, setSheetCam] = useState(null);
        const [sheetTrail, setSheetTrail] = useState(null);
        const [fsCam, setFsCam] = useState(null);
        const pager = usePager(0);

        const openCam = useCallback((c) => {
          setSheetTrail(null);
          setSheetCam(c);
        }, []);
        const openTrail = useCallback((t) => {
          setSheetCam(null);
          setSheetTrail(t);
        }, []);

        // Theme preference — initialised from localStorage / OS, applied on mount
        // and on every change so the toggle in Settings is reflected immediately.
        const [theme, setThemeState] = useState(() => readStoredTheme());
        const setTheme = useCallback((t) => {
          setThemeState(t);
          writeStoredTheme(t);
          applyTheme(t);
        }, []);
        useEffect(() => {
          applyTheme(theme);
        }, [theme]);

        // Chrome-preference for external links.
        const [chromeLinks, setChromeLinksState] = useState(() => {
          try {
            return localStorage.getItem("mira:chromeLinks") !== "0";
          } catch {
            return true;
          }
        });
        const setChromeLinks = useCallback((v) => {
          setChromeLinksState(v);
          try {
            localStorage.setItem("mira:chromeLinks", v ? "1" : "0");
          } catch {}
        }, []);

        // Favourite trails — persisted to localStorage as an array of pr_codes.
        const [favs, setFavs] = useState(() => {
          try {
            return new Set(
              JSON.parse(localStorage.getItem("mira:favs") || "[]"),
            );
          } catch {
            return new Set();
          }
        });
        const toggleFav = useCallback((id) => {
          if (!id) return;
          setFavs((prev) => {
            const next = new Set(prev);
            if (next.has(id)) next.delete(id);
            else next.add(id);
            try {
              localStorage.setItem("mira:favs", JSON.stringify([...next]));
            } catch {}
            return next;
          });
        }, []);

        // Load cameras
        useEffect(() => {
          fetch("./cameras.json", { cache: "no-store" })
            .then((r) => r.json())
            .then((list) => {
              setCameras(list);
              // Preload the first handful of YouTube grid thumbnails so the
              // grid view renders crisp imagery the moment the user navigates
              // to it. mqdefault is ~12-20KB per image so the budget is small.
              const yts = list.filter((c) => c.type === "youtube").slice(0, 6);
              for (const c of yts) {
                const link = document.createElement("link");
                link.rel = "preload";
                link.as = "image";
                link.href = `https://i.ytimg.com/vi/${c.id}/mqdefault.jpg`;
                link.crossOrigin = "anonymous";
                document.head.appendChild(link);
              }
            })
            .catch(() => setCameras([]));
        }, []);

        // Load trails (non-fatal if missing)
        useEffect(() => {
          fetch("./hikes.json", { cache: "no-store" })
            .then((r) => r.json())
            .then((data) =>
              setTrails(Array.isArray(data?.trails) ? data.trails : []),
            )
            .catch(() => setTrails([]));
        }, []);

        // Hide splash once cameras have arrived, or after 1.5s fallback
        useEffect(() => {
          const hide = () => {
            const sp = document.getElementById("splash");
            if (!sp) return;
            sp.setAttribute("data-hidden", "true");
            setTimeout(() => sp.remove(), 320);
          };
          if (cameras.length) hide();
          const t = setTimeout(hide, 1500);
          return () => clearTimeout(t);
        }, [cameras.length]);

        /* ----- Horizontal swipe between pages -----------------------
           Mirrors the pointer-based pager in the-usual: axis-lock after
           14px, velocity-aware flick, rubber-band at edges. The map page
           opts out entirely so Leaflet keeps full control of touch. */
        const pageTrackRef = useRef(null);
        const pageDragRef = useRef({
          active: false,
          startX: 0,
          startY: 0,
          locked: null,
          width: 0,
          pointerId: null,
          pendingDx: 0,
          rafQueued: false,
          samples: [],
        });
        const PAGE_W_PCT = 100 / PAGE_COUNT;
        const MAX_RUBBER = 56;
        const rubberBand = (dx) => {
          const a = Math.abs(dx);
          return Math.sign(dx) * (a / (1 + a / MAX_RUBBER));
        };
        const flushTrackTransform = useCallback(() => {
          const st = pageDragRef.current;
          st.rafQueued = false;
          if (!st.active || st.locked !== "x") return;
          const el = pageTrackRef.current;
          if (!el) return;
          el.style.transition = "none";
          el.style.transform = `translate3d(calc(${-pager.page * PAGE_W_PCT}% + ${st.pendingDx}px), 0, 0)`;
        }, [pager.page]);
        const snapTrackToView = useCallback(() => {
          const el = pageTrackRef.current;
          if (!el) return;
          el.style.transition = "";
          el.style.transform = `translate3d(${-pager.page * PAGE_W_PCT}%, 0, 0)`;
        }, [pager.page]);
        const onPagePointerDown = (e) => {
          if (pager.page === 0) return; // map page: hand off to Leaflet
          if (e.pointerType === "mouse" && e.button !== 0) return;
          // Don't hijack horizontal scroll inside the grid's filter chips.
          if (e.target && e.target.closest && e.target.closest(".chips"))
            return;
          const st = pageDragRef.current;
          st.active = true;
          st.startX = e.clientX;
          st.startY = e.clientY;
          st.locked = null;
          st.width = e.currentTarget.getBoundingClientRect().width;
          st.pointerId = e.pointerId;
          st.pendingDx = 0;
          st.samples = [{ x: e.clientX, t: performance.now() }];
        };
        const onPagePointerMove = (e) => {
          const st = pageDragRef.current;
          if (!st.active) return;
          const dx = e.clientX - st.startX;
          const dy = e.clientY - st.startY;
          if (st.locked === null) {
            if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return;
            if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) >= 14) {
              st.locked = "x";
              try {
                e.currentTarget.setPointerCapture(st.pointerId);
              } catch (_) {}
              if (pageTrackRef.current)
                pageTrackRef.current.classList.add("dragging");
            } else {
              st.locked = "y";
            }
          }
          if (st.locked === "x") {
            if (e.cancelable) e.preventDefault();
            const atLeftEdge = pager.page === 0 && dx > 0;
            const atRightEdge = pager.page === PAGE_COUNT - 1 && dx < 0;
            const val = atLeftEdge || atRightEdge ? rubberBand(dx) : dx;
            st.pendingDx = val;
            const now = performance.now();
            st.samples.push({ x: e.clientX, t: now });
            while (st.samples.length > 1 && now - st.samples[0].t > 120)
              st.samples.shift();
            if (!st.rafQueued) {
              st.rafQueued = true;
              requestAnimationFrame(flushTrackTransform);
            }
          }
        };
        const onPagePointerEnd = (e) => {
          const st = pageDragRef.current;
          if (!st.active) return;
          const wasX = st.locked === "x";
          st.active = false;
          st.locked = null;
          if (pageTrackRef.current)
            pageTrackRef.current.classList.remove("dragging");
          if (!wasX) return;
          const dx = e.clientX - st.startX;
          const w = st.width || 320;
          let velocity = 0;
          if (st.samples.length >= 2) {
            const first = st.samples[0];
            const last = st.samples[st.samples.length - 1];
            const dt = Math.max(1, last.t - first.t);
            velocity = (last.x - first.x) / dt;
          }
          const flick = Math.abs(velocity) > 0.4;
          const threshold = w * 0.22;
          let next = pager.page;
          if (
            (dx < -threshold || (flick && velocity < 0)) &&
            pager.page < PAGE_COUNT - 1
          )
            next = pager.page + 1;
          else if (
            (dx > threshold || (flick && velocity > 0)) &&
            pager.page > 0
          )
            next = pager.page - 1;
          if (next !== pager.page) {
            pager.setPage(next);
          } else {
            snapTrackToView();
          }
        };
        useEffect(() => {
          const el = pageTrackRef.current;
          if (!el) return;
          el.style.transition = "";
          el.style.transform = `translate3d(${-pager.page * PAGE_W_PCT}%, 0, 0)`;
        }, [pager.page]);

        return html`
          <main
            class="pager"
            onPointerDown=${onPagePointerDown}
            onPointerMove=${onPagePointerMove}
            onPointerUp=${onPagePointerEnd}
            onPointerCancel=${onPagePointerEnd}
          >
            <div class="pages-track" ref=${pageTrackRef}>
              <${MapView}
                cameras=${cameras}
                trails=${trails}
                onSelect=${openCam}
                onSelectTrail=${openTrail}
                active=${pager.page === 0}
              />
              <${GridView}
                cameras=${cameras}
                onSelect=${openCam}
                active=${pager.page === 1}
              />
              <${TrailsView}
                trails=${trails}
                onSelect=${openTrail}
                active=${pager.page === 2}
                favs=${favs}
                toggleFav=${toggleFav}
              />
              <${LinksView} />
              <${SettingsPage}
                cameras=${cameras}
                trails=${trails}
                active=${pager.page === 4}
                theme=${theme}
                setTheme=${setTheme}
                chromeLinks=${chromeLinks}
                setChromeLinks=${setChromeLinks}
              />
            </div>
          </main>

          <div class="tabbar-wrap">
            <nav class="tabbar" role="tablist" aria-label="Pages">
              <button
                class="tab"
                role="tab"
                aria-selected=${pager.page === 0}
                onClick=${() => pager.setPage(0)}
              >
                <${Icon} name="map" /><span class="tab-label">Map</span>
              </button>
              <button
                class="tab"
                role="tab"
                aria-selected=${pager.page === 1}
                onClick=${() => pager.setPage(1)}
              >
                <${Icon} name="grid" /><span class="tab-label">Grid</span>
              </button>
              <button
                class="tab"
                role="tab"
                aria-selected=${pager.page === 2}
                onClick=${() => pager.setPage(2)}
              >
                <${Icon} name="trail" /><span class="tab-label">Trails</span>
              </button>
              <button
                class="tab"
                role="tab"
                aria-selected=${pager.page === 3}
                onClick=${() => pager.setPage(3)}
              >
                <${Icon} name="compass" /><span class="tab-label">Links</span>
              </button>
              <button
                class="tab"
                role="tab"
                aria-selected=${pager.page === 4}
                onClick=${() => pager.setPage(4)}
              >
                <${Icon} name="settings" /><span class="tab-label"
                  >Settings</span
                >
              </button>
            </nav>
          </div>

          ${sheetCam &&
          html`<${DetailSheet}
            cam=${sheetCam}
            onClose=${() => setSheetCam(null)}
            onFullscreen=${(c) => setFsCam(c)}
          />`}
          ${sheetTrail &&
          html`<${TrailSheet}
            trail=${sheetTrail}
            onClose=${() => setSheetTrail(null)}
            isFav=${favs.has(sheetTrail.pr_code)}
            toggleFav=${toggleFav}
          />`}
          ${fsCam &&
          html`<${Fullscreen} cam=${fsCam} onClose=${() => setFsCam(null)} />`}
        `;
      }

      /* ============================================================
       Boot
       ============================================================ */
      render(h(App), document.getElementById("app"));

      // Service worker registration (after main paint)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {
            /* offline-first not critical */
          });
        });
      }
    </script>
  </body>
</html>
