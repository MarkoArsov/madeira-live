<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

  <title>Mira — Madeira Live</title>
  <meta name="description" content="Live webcams across Madeira and Porto Santo, with local weather." />

  <meta name="theme-color" content="#FFF8EC" />
  <meta name="color-scheme" content="light" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mira" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.open-meteo.com" />
  <link rel="preconnect" href="https://server.arcgisonline.com" />
  <link rel="dns-prefetch" href="https://www.youtube.com" />

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       Mira — design tokens
       Light: limestone surface, basalt ink, ember accent.
       Dark : basalt surface, bone ink, ember accent lifted for night.
       ============================================================ */
    :root {
      /* Laurisilva — Madeira's UNESCO laurel forest above a sand cove.
         Forest deep + sage + sand + cream. One single theme, no dark mode. */

      /* Brand palette */
      --forest: #546B41;       /* primary action, brand */
      --forest-deep: #3F5331;
      --sage: #99AD7A;         /* secondary accent, hover */
      --sand: #DCCCAC;         /* warm sand, dividers, sunken */
      --cream: #FFF8EC;        /* surface */

      /* Semantic surfaces — cream world. Elevated cards step warmer (not pure white)
         so they read as embedded objects, not lifted-out-of-context. */
      --bg: #FFF8EC;
      --bg-elevated: #F4ECD8;   /* warm sand-cream card */
      --bg-sunken: #E5D8B8;     /* deeper sand for grabber / track */
      --bg-scrim: rgba(255, 248, 236, 0.86);
      --bg-overlay: rgba(42, 58, 31, 0.46);

      /* Ink */
      --ink: #2A3A1F;          /* deepest forest, primary text */
      --ink-soft: #546B41;     /* forest, secondary text */
      --ink-muted: #8AA070;    /* muted sage */

      /* Lines */
      --border: #E5D8B8;
      --hairline: rgba(84, 107, 65, 0.10);

      /* Accent (single, committed) */
      --accent: #546B41;
      --accent-deep: #3F5331;
      --accent-soft: rgba(84, 107, 65, 0.10);
      --accent-glow: rgba(84, 107, 65, 0.30);
      --on-accent: #FFF8EC;

      /* Secondary accent (used sparingly: chip border, hover) */
      --accent-2: #99AD7A;
      --accent-2-soft: rgba(153, 173, 122, 0.18);

      /* LIVE — the one warm tone in the system. Used ONLY on the live indicator. */
      --live: #C8412A;
      --live-glow: rgba(200, 65, 42, 0.34);

      --skel: linear-gradient(90deg, rgba(42,58,31,0.05), rgba(42,58,31,0.12), rgba(42,58,31,0.05));

      --shadow-sm: 0 1px 2px rgba(42, 58, 31, 0.06);
      --shadow-md: 0 8px 22px rgba(42, 58, 31, 0.10);
      --shadow-lg: 0 28px 64px rgba(42, 58, 31, 0.18);
      --shadow-forest: 0 8px 22px rgba(84, 107, 65, 0.22);

      --r-xs: 8px;
      --r-sm: 12px;
      --r-md: 16px;
      --r-lg: 22px;
      --r-xl: 30px;
      --r-pill: 999px;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 40px;

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-out-strong: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

      --nav-h: 58px;
    }

    /* ============================================================
       Reset + base
       ============================================================ */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-feature-settings: 'ss01', 'cv11';
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: contain;
    }
    .serif {
      font-family: 'Fraunces', 'Geist', system-ui, serif;
      font-optical-sizing: auto;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      transition: background 0.4s var(--ease-out), color 0.4s var(--ease-out);
    }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
    button, a { -webkit-touch-callout: none; }
    input, textarea, select { font-family: inherit; }
    img, svg { display: block; }
    .num { font-variant-numeric: tabular-nums; }

    #app {
      max-width: 520px;
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
    }
    @media (min-width: 768px) {
      #app {
        max-width: 720px;
        box-shadow: var(--shadow-lg);
      }
    }

    /* No header — pages own their top safe area. */

    /* ============================================================
       Pager
       ============================================================ */
    .pager {
      position: relative;
      width: 100%;
      height: 100vh; height: 100dvh;
      overflow: hidden;
    }
    .pages-track {
      display: flex;
      width: 400%;
      height: 100%;
      transform: translate3d(0, 0, 0);
      transition: transform 0.44s var(--ease-out-strong);
      will-change: transform;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .page {
      flex: 0 0 25%;
      min-width: 0;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* ============================================================
       Pill nav (floating bottom dock, icons-only)
       ============================================================ */
    .tabbar-wrap {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none;
      display: flex; justify-content: center;
    }
    .tabbar {
      pointer-events: auto;
      padding: 5px 10px;
      display: flex;
      align-items: stretch;
      gap: 6px;
      background: rgba(255, 248, 236, 0.94);
      border: 1px solid var(--hairline);
      border-radius: var(--r-pill);
      box-shadow:
        0 1px 2px rgba(42, 58, 31, 0.06),
        0 10px 22px rgba(42, 58, 31, 0.12),
        0 28px 52px rgba(42, 58, 31, 0.20);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
    }
    .tab {
      width: 62px; height: 38px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink-muted);
      border-radius: var(--r-pill);
      transition: color 0.22s var(--ease-out), background 0.28s var(--ease-out-strong), transform 0.12s var(--ease-out);
      position: relative;
    }
    .tab svg { width: 20px; height: 20px; transition: transform 0.22s var(--ease-out); }
    .tab:active { transform: scale(0.94); }
    .tab[aria-selected="true"] {
      background: var(--forest);
      color: var(--on-accent);
      box-shadow: 0 3px 10px rgba(84, 107, 65, 0.34);
    }
    .tab[aria-selected="true"] svg { transform: scale(1.05); }
    .tab-label { display: none; }

    /* ============================================================
       Map page
       ============================================================ */
    /* Map always shows light Positron tiles, so its loading bg is cream-warm
       regardless of app theme. */
    .map-root {
      position: absolute; inset: 0;
      background: #EFEAD9;
      isolation: isolate; /* contain Leaflet's high z-indexes so the FAB stays on top */
    }
    .leaflet-container {
      background: #EFEAD9 !important;
      font-family: inherit !important;
    }
    .leaflet-control-attribution {
      background: rgba(251, 246, 232, 0.86) !important;
      color: #4A5358 !important;
      font-size: 9px !important;
      padding: 2px 6px !important;
      border-radius: 6px 0 0 0 !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .leaflet-control-attribution a { color: #1B252A !important; }
    .leaflet-control-zoom { display: none !important; }

    /* Custom pin — forest dot on a soft sage halo, sand outer ring against light Positron tiles.
       Leaflet's iconAnchor handles positioning; never add transform on .pin / .pin-cluster. */
    .pin {
      width: 36px; height: 36px;
      position: relative;
      pointer-events: auto;
    }
    .pin-pulse {
      position: absolute;
      top: 50%; left: 50%;
      width: 32px; height: 32px;
      margin: -16px 0 0 -16px;
      border-radius: 50%;
      background: var(--forest);
      opacity: 0.30;
      animation: pin-pulse 2.6s var(--ease-out) infinite;
    }
    @keyframes pin-pulse {
      0%   { transform: scale(0.55); opacity: 0.45; }
      80%  { transform: scale(1.7); opacity: 0; }
      100% { transform: scale(1.7); opacity: 0; }
    }
    .pin-dot {
      position: absolute;
      top: 50%; left: 50%;
      width: 26px; height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 50%;
      background: var(--forest);
      color: var(--cream);
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(42, 58, 31, 0.40), 0 0 0 3px var(--cream);
      transition: transform 0.18s var(--ease-out);
    }
    .pin-dot svg { width: 11px; height: 11px; }
    .pin:active .pin-dot { transform: scale(1.12); }

    .pin-cluster {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--cream);
      color: var(--forest);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
      box-shadow: 0 2px 8px rgba(42, 58, 31, 0.25), 0 0 0 2px var(--forest);
      pointer-events: auto;
      transition: transform 0.18s var(--ease-out);
    }
    .pin-cluster:active { transform: scale(1.08); }

    /* Recentre FAB — forest on cream Positron map, always contrasting. */
    .map-fab {
      position: absolute;
      top: calc(env(safe-area-inset-top) + var(--space-3));
      right: var(--space-4);
      width: 44px; height: 44px;
      border-radius: var(--r-pill);
      background: var(--forest);
      color: var(--cream);
      border: 1px solid var(--forest-deep);
      box-shadow: var(--shadow-forest);
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform 0.12s var(--ease-out), background 0.18s var(--ease-out);
      z-index: 5;
    }
    .map-fab:active { transform: scale(0.94); background: var(--forest-deep); }
    .map-fab svg { width: 20px; height: 20px; }

    /* ============================================================
       Grid page
       ============================================================ */
    .grid-scroll {
      position: absolute; inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }
    .grid-pull-wrap {
      transform: translate3d(0, 0, 0);
      transition: transform 0.32s var(--ease-out-strong);
      will-change: transform;
    }
    .grid-pull-wrap.dragging { transition: none; }

    .pull-indicator {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      height: 56px;
      transform: translateY(-100%);
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .pull-spinner {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid var(--sand);
      border-top-color: var(--forest);
      margin-right: 8px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .chips {
      position: sticky;
      top: 0;
      z-index: 4;
      background: var(--bg-scrim);
      backdrop-filter: saturate(160%) blur(20px);
      -webkit-backdrop-filter: saturate(160%) blur(20px);
      padding-top: calc(env(safe-area-inset-top) + var(--space-3));
      padding-bottom: var(--space-3);
      padding-left: var(--space-4);
      padding-right: var(--space-4);
      display: flex; gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -ms-overflow-style: none;
      border-bottom: 1px solid var(--hairline);
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      height: 34px;
      padding: 0 14px;
      border-radius: var(--r-pill);
      background: var(--bg-elevated);
      color: var(--ink-soft);
      border: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: -0.005em;
      scroll-snap-align: start;
      transition: background 0.18s var(--ease-out), color 0.18s var(--ease-out), border-color 0.18s var(--ease-out), transform 0.12s var(--ease-out);
    }
    .chip:active { transform: scale(0.96); }
    .chip[aria-pressed="true"] {
      background: var(--forest);
      color: var(--on-accent);
      border-color: var(--forest);
    }

    .grid {
      padding: var(--space-3) var(--space-3);
      padding-bottom: calc(env(safe-area-inset-bottom) + var(--nav-h) + var(--space-7));
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
    }
    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 1fr 1fr 1fr;
        gap: var(--space-4);
        padding-left: var(--space-4);
        padding-right: var(--space-4);
        padding-bottom: calc(env(safe-area-inset-bottom) + var(--nav-h) + var(--space-8));
      }
    }

    .tile {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--forest);
      box-shadow: 0 1px 2px rgba(42, 58, 31, 0.08), 0 6px 18px rgba(42, 58, 31, 0.06);
      transition: transform 0.16s var(--ease-out), box-shadow 0.2s var(--ease-out);
      cursor: pointer;
    }
    .tile:active { transform: scale(0.985); }
    .tile-thumb {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
      background: linear-gradient(135deg, #3F5331 0%, #546B41 50%, #6F8856 100%);
    }
    .tile-thumb-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #3F5331 0%, #546B41 60%, #6F8856 100%);
      color: rgba(255, 248, 236, 0.45);
    }
    .tile-thumb-placeholder svg { width: 32px; height: 32px; }
    .tile-frame {
      position: absolute; inset: 0;
      border: 0;
      width: 100%; height: 100%;
      pointer-events: none; /* tap goes to overlay */
      background: transparent;
      opacity: 0;
      transition: opacity 0.45s var(--ease-out);
    }
    .tile-frame.mounted { opacity: 1; }

    .tile-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      padding: 8px 10px;
      pointer-events: auto;
    }
    .tile-overlay > .live { align-self: flex-end; }
    .tile-name {
      max-width: 100%;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.005em;
      line-height: 1.2;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      margin-top: auto;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.6) 90%);
      width: calc(100% + 20px); margin-left: -10px; margin-right: -10px;
      padding: 18px 12px 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Live dot — non-negotiable */
    .live {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 8px 4px 7px;
      border-radius: 999px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }
    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 0 0 var(--live-glow);
      animation: live-pulse 1.8s var(--ease-out) infinite;
    }
    @keyframes live-pulse {
      0%   { box-shadow: 0 0 0 0 var(--live-glow); transform: scale(1); }
      70%  { box-shadow: 0 0 0 6px rgba(200, 65, 42, 0); transform: scale(1.05); }
      100% { box-shadow: 0 0 0 0 rgba(200, 65, 42, 0); transform: scale(1); }
    }

    /* ============================================================
       Sheets (Detail + Settings + Fullscreen)
       ============================================================ */
    .sheet-portal {
      position: fixed; inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .sheet-scrim {
      position: absolute; inset: 0;
      background: var(--bg-overlay);
      opacity: 0;
      transition: opacity 0.32s var(--ease-out);
      backdrop-filter: blur(2px);
    }
    .sheet-portal[data-open="true"] .sheet-scrim { opacity: 1; }

    .sheet {
      position: relative;
      width: 100%; max-width: 520px;
      margin: 0 auto;
      background: var(--bg);
      border-top-left-radius: var(--r-xl);
      border-top-right-radius: var(--r-xl);
      box-shadow: var(--shadow-lg);
      transform: translate3d(0, 100%, 0);
      transition: transform 0.42s var(--ease-out-strong);
      will-change: transform;
      max-height: calc(100dvh - env(safe-area-inset-top) - 24px);
      overflow: hidden;
      display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }
    @media (min-width: 768px) { .sheet { max-width: 540px; } }
    .sheet.dragging { transition: none; }
    .sheet-portal[data-open="true"] .sheet { transform: translate3d(0, 0, 0); }

    .sheet-drag-zone {
      flex-shrink: 0;
      touch-action: none; /* exclusive pointer control for swipe-to-close */
      cursor: grab;
    }
    .sheet-drag-zone:active { cursor: grabbing; }
    .sheet-grabber {
      width: 36px; height: 5px;
      border-radius: 999px;
      background: var(--sand);
      margin: 8px auto 0;
      transition: background 0.2s var(--ease-out);
    }
    .sheet.dragging .sheet-grabber { background: var(--ink-muted); }
    .sheet-head {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px var(--space-5) 8px;
      flex-shrink: 0;
    }
    .sheet-title-block { flex: 1; min-width: 0; }
    .sheet-region {
      font-size: 10.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .sheet-title {
      font-family: 'Fraunces', 'Geist', serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--ink);
      margin: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sheet-close {
      width: 36px; height: 36px;
      border-radius: 999px;
      background: var(--bg-sunken);
      color: var(--ink-soft);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.18s var(--ease-out), transform 0.12s var(--ease-out);
    }
    .sheet-close svg { width: 18px; height: 18px; }
    .sheet-close:active { transform: scale(0.92); background: var(--border); }

    .sheet-body {
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 4px var(--space-4) var(--space-5);
    }

    .stream {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--forest);
      box-shadow: var(--shadow-sm);
    }
    /* Detail-sheet stream: iframe receives no taps (controls=0 anyway), so the
       overlay buttons always win on iOS. */
    .stream iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      z-index: 1; pointer-events: none;
    }
    .stream-live { position: absolute; top: 10px; right: 10px; z-index: 3; pointer-events: none; }

    .stream-actions {
      position: absolute;
      bottom: 10px; right: 10px;
      z-index: 3;
      display: flex; gap: 6px;
      pointer-events: auto;
    }
    .stream-act {
      width: 36px; height: 36px;
      border-radius: var(--r-pill);
      background: rgba(42, 58, 31, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #FFF8EC;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background 0.16s var(--ease-out), transform 0.12s var(--ease-out);
    }
    .stream-act svg { width: 16px; height: 16px; }
    .stream-act:active { transform: scale(0.94); background: rgba(42, 58, 31, 0.88); }

    .weather {
      margin-top: var(--space-4);
      padding: var(--space-4) var(--space-4) var(--space-4);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
    }
    .weather-top {
      display: flex; align-items: flex-start; gap: 16px;
      margin-bottom: 14px;
    }
    .weather-temp {
      font-family: 'Fraunces', 'Geist', serif;
      font-size: 68px;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.9;
      color: var(--ink);
      flex: 1;
      min-width: 0;
    }
    .weather-temp sup {

      font-weight: 500;
      letter-spacing: 0;

    }
    .weather-glyph {
      width: 56px; height: 56px;
      flex-shrink: 0;
      color: var(--forest);

    .weather-glyph svg { width: 100%; height: 100%; }
    .weather-condition {
      font-size: 13px;
      color: var(--ink-soft);
      font-weight: 500;
      letter-spacing: -0.005em;
      margin-bottom: 14px;
    }
    .weather-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;

      border-top: 1px solid var(--hairline);

    .weather-stat-key {

    .weather-skel-row {

    }
    .weather-error {

    /* Fullscreen viewer */
    .fs {
      position: fixed; inset: 0;

    .fs-close {
      position: absolute;

      width: 44px; height: 44px;

      backdrop-filter: blur(10px);

      display: inline-flex; align-items: center; justify-content: center;
      z-index: 2;

    .fs-close svg { width: 22px; height: 22px; }

    /* ============================================================
       Trails page
       ============================================================ */
    .page--trails { background: var(--bg); }
    .trails-scroll {
      position: absolute; inset: 0;
      overflow-y: auto;
      overflow-x: hidden;

    }
    .trails-inner {
      padding-top: calc(env(safe-area-inset-top) + var(--space-7));

      margin: 0 auto;
    }
    .trails-head { margin-bottom: var(--space-6); }
    .trails-eyebrow {
      font-size: 10.5px;
      letter-spacing: 0.24em;

      color: var(--forest);

      margin-bottom: 12px;
    }
    .trails-h1 {
      margin: 0 0 10px;
      font-size: 36px;
      font-weight: 500;

      color: var(--ink);
    }
    .trails-lede {
      margin: 0;

    .trails-list {
      display: flex; flex-direction: column;

    .trail-card {

    }
    .trail-card:active { transform: scale(0.985); }
    .trail-thumb {
      width: 84px; height: 84px;

    .trail-thumb-fallback {

    .trail-meta {
      flex: 1; min-width: 0;

    .trail-code {

    .trail-name {
      font-family: 'Fraunces', 'Geist', serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.01em;

      -webkit-box-orient: vertical;

    }
    .trail-row {
      display: flex; align-items: center;
      gap: 10px;
      flex-wrap: wrap;

    }

    .status {
      display: inline-flex; align-items: center;

    .status[data-status="Open"]       { background: var(--accent-soft); color: var(--forest-deep); }

    /* Trail detail sheet */
    .trail-hero {
      width: 100%;

    .trail-hero-fallback {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #3F5331 0%, #546B41 60%, #99AD7A 100%);

      color: rgba(255, 248, 236, 0.7);

    .trail-status-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: var(--space-4);
    }
    .trail-highlights {
      font-size: 15px;
      line-height: 1.5;

      margin: 0 0 var(--space-5);

    .trail-cta {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;

    .trail-cta:active { transform: scale(0.98); background: var(--forest-deep); }
    .trail-cta svg { width: 16px; height: 16px; }

    /* Trail map pin — sand fill with forest ring to distinguish from camera pins. */
    .pin-trail {
      width: 30px; height: 30px;
      position: relative;
      pointer-events: auto;
    }
    .pin-trail-dot {
      position: absolute; top: 50%; left: 50%;
      width: 26px; height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 50%;
      background: var(--sand);
      color: var(--forest-deep);
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(42, 58, 31, 0.28), 0 0 0 2.5px var(--forest);
      transition: transform 0.18s var(--ease-out);
    }
    .pin-trail-dot svg { width: 13px; height: 13px; }
    .pin-trail:active .pin-trail-dot { transform: scale(1.12); }

    /* Second map FAB — trails toggle, stacked below recentre. */
    .map-fab.fab-trails {
      top: calc(env(safe-area-inset-top) + var(--space-3) + 52px);
      background: var(--bg-elevated);
      color: var(--forest);
      border-color: var(--border);
    }
    .map-fab.fab-trails[aria-pressed="true"] {
      background: var(--forest);
      color: var(--on-accent);
      border-color: var(--forest-deep);
    }
    .map-fab.fab-style {
      top: calc(env(safe-area-inset-top) + var(--space-3) + 104px);
      background: var(--bg-elevated);
      color: var(--forest);
      border-color: var(--border);
    }
    .map-fab.fab-style[aria-pressed="true"] {
      background: var(--forest);
      color: var(--on-accent);
      border-color: var(--forest-deep);
    }

    /* ============================================================
       Settings page — editorial, not a settings form
       ============================================================ */
    .page--settings { background: var(--bg); }
    .settings-scroll {
      position: absolute; inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .settings-inner {
      padding-top: calc(env(safe-area-inset-top) + var(--space-7));
      padding-left: var(--space-5);
      padding-right: var(--space-5);
      padding-bottom: calc(env(safe-area-inset-bottom) + var(--nav-h) + var(--space-8));
      max-width: 480px;
      margin: 0 auto;
    }
    .settings-head { margin-bottom: var(--space-7); }
    .settings-eyebrow {
      font-size: 10.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--forest);
      font-weight: 700;
      margin-bottom: 14px;
    }
    .settings-h1 {
      margin: 0 0 12px;
      font-size: 44px;
      font-weight: 500;
      letter-spacing: -0.024em;
      line-height: 1.02;
      color: var(--ink);
    }
    .settings-lede {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink-soft);
      max-width: 32ch;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      margin: 0 0 var(--space-6);
      background: var(--hairline);
      border-radius: var(--r-md);
      overflow: hidden;
      border: 1px solid var(--hairline);
    }
    .stat {
      background: var(--bg-elevated);
      padding: 18px 14px 16px;
      display: flex; flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .stat-num {
      font-size: 32px;
      line-height: 1;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .stat-unit {
      font-size: 17px;
      color: var(--ink-muted);
      font-weight: 500;
      margin-left: -2px;
    }
    .stat-key {
      font-size: 10.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-weight: 600;
    }

    .settings-group { margin-bottom: var(--space-7); }
    .settings-group-label {
      font-size: 10.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-weight: 700;
      margin: 0 0 12px;
    }
    .region-list {
      list-style: none; margin: 0; padding: 0;
      border-top: 1px solid var(--hairline);
    }
    .region-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 12px 4px;
      border-bottom: 1px solid var(--hairline);
    }
    .region-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.005em;

    .region-count {
      font-size: 13px;
      color: var(--ink-muted);
      font-weight: 600;
    }
    .about {
      padding: var(--space-4);
      background: var(--bg-elevated);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--ink-soft);
    }
    .about a { color: var(--forest); text-decoration: underline; text-decoration-color: rgba(84,107,65,0.35); text-underline-offset: 2px; }
    .about-meta {
      margin-top: 10px;
      color: var(--ink-muted);
      font-size: 12.5px;
    }
    .about-version {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--hairline);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }

    /* Splash before Preact mounts */
    .splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      z-index: 200;
      transition: opacity 0.3s var(--ease-out);
    }
    .splash[data-hidden="true"] { opacity: 0; pointer-events: none; }
    .splash-mark {
      width: 60px; height: 60px;
      border-radius: 16px;
      background: var(--forest);
      display: flex; align-items: center; justify-content: center;
      animation: splash-breath 1.6s var(--ease-out) infinite alternate;
      box-shadow: 0 12px 30px rgba(84, 107, 65, 0.28);
    }
    .splash-mark svg { width: 30px; height: 30px; color: var(--cream); }
    @keyframes splash-breath {
      from { transform: scale(0.96); opacity: 0.85; }
      to   { transform: scale(1.04); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001s !important;
        transition-duration: 0.001s !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="splash" id="splash">
    <div class="splash-mark" aria-label="Mira">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6 L9 18 L18 12 Z" fill="currentColor"/></svg>
    </div>
  </div>

  <script type="module">
    /* ============================================================
       Imports
       ============================================================ */
    import { h, render } from 'https://esm.sh/preact@10.22.0';
    import { useState, useEffect, useRef, useMemo, useCallback } from 'https://esm.sh/preact@10.22.0/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    const html = htm.bind(h);

    /* ============================================================
       Constants
       ============================================================ */
    const APP_VERSION = '1.0.0';
    const MADEIRA_CENTER = [32.75, -16.95];
    const MADEIRA_ZOOM = 10;
    const MAX_MOUNTED_TILES = 6;
    const UNMOUNT_DELAY_MS = 2000;
    const WX_TTL_MS = 10 * 60 * 1000;

    const REGION_FILTERS = [
      { label: 'All',         match: () => true },
      { label: 'Funchal',     match: (c) => c.region === 'Funchal' },
      { label: 'North Coast', match: (c) => c.region === 'North Coast' },
      { label: 'South Coast', match: (c) => c.region === 'South' },
      { label: 'Beaches',     match: (c) => c.region === 'Beaches' },
      { label: 'Porto Santo', match: (c) => c.region === 'Porto Santo' },
    ];

    /* ============================================================
       Theme management
       ============================================================ */
    function readStoredTheme() {
      // legacy: Mira is single-theme now. Kept as a no-op for any older stored value.
      return 'light';
    }
    function writeStoredTheme(_) { /* no-op, single theme */ }
    function applyTheme(_) { /* no-op, single theme */ }

    /* ============================================================
       Weather (Open-Meteo) — sessionStorage cache, 10 min TTL.
       ============================================================ */
    function wxKey(lat, lng) {
      return `wx:${lat.toFixed(3)},${lng.toFixed(3)}`;
    }
    function wxRead(lat, lng) {
      try {
        const raw = sessionStorage.getItem(wxKey(lat, lng));
        if (!raw) return null;
        const v = JSON.parse(raw);
        if (Date.now() - v.t > WX_TTL_MS) return null;
        return v;
      } catch { return null; }
    }
    function wxWrite(lat, lng, data) {
      try { sessionStorage.setItem(wxKey(lat, lng), JSON.stringify({ t: Date.now(), data })); } catch {}
    }
    async function fetchWeather(lat, lng, force = false) {
      if (!force) {
        const cached = wxRead(lat, lng);
        if (cached) return { ...cached.data, _ts: cached.t, _cached: true };
      }
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&timezone=Atlantic%2FMadeira`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('weather fetch failed');
      const json = await res.json();
      const data = json.current;
      wxWrite(lat, lng, data);
      return { ...data, _ts: Date.now(), _cached: false };
    }

    const WMO = {
      0:  { label: 'Clear', glyph: 'sun' },
      1:  { label: 'Mostly clear', glyph: 'sun-cloud' },
      2:  { label: 'Partly cloudy', glyph: 'sun-cloud' },
      3:  { label: 'Overcast', glyph: 'cloud' },
      45: { label: 'Fog', glyph: 'fog' },
      48: { label: 'Rime fog', glyph: 'fog' },
      51: { label: 'Light drizzle', glyph: 'drizzle' },
      53: { label: 'Drizzle', glyph: 'drizzle' },
      55: { label: 'Dense drizzle', glyph: 'drizzle' },
      61: { label: 'Light rain', glyph: 'rain' },
      63: { label: 'Rain', glyph: 'rain' },
      65: { label: 'Heavy rain', glyph: 'rain' },
      71: { label: 'Light snow', glyph: 'snow' },
      73: { label: 'Snow', glyph: 'snow' },
      75: { label: 'Heavy snow', glyph: 'snow' },
      80: { label: 'Showers', glyph: 'showers' },
      81: { label: 'Showers', glyph: 'showers' },
      82: { label: 'Heavy showers', glyph: 'showers' },
      95: { label: 'Thunderstorm', glyph: 'storm' },
      96: { label: 'Thunderstorm + hail', glyph: 'storm' },
      99: { label: 'Thunderstorm + hail', glyph: 'storm' },
    };

    function wxInfo(code) { return WMO[code] || { label: '—', glyph: 'cloud' }; }

    function relTime(ts) {
      if (!ts) return '';
      const sec = Math.max(0, Math.round((Date.now() - ts) / 1000));
      if (sec < 30) return 'just now';
      if (sec < 90) return '1m ago';
      if (sec < 3600) return `${Math.round(sec / 60)}m ago`;
      const hr = Math.round(sec / 3600);
      return `${hr}h ago`;
    }

    /* ============================================================
       Icons (SVG)
       ============================================================ */
    function Icon({ name, ...rest }) {
      const paths = ICONS[name];
      return html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ...${rest}>${paths}</svg>`;
    }
    const ICONS = {
      map: html`<path d="M9 4 3 6.5v13L9 17l6 2.5L21 17V4l-6 2.5z"/><path d="M9 4v13M15 6.5v13"/>`,
      grid: html`<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>`,

      camera: html`<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z" fill="currentColor"/>`,
      trail: html`<path d="M3 19l5-9 3.5 5 2.5-3 7 7z"/><circle cx="16" cy="6" r="2"/>`,

      'sun-cloud': html`<circle cx="8" cy="9" r="3.2"/><path d="M8 2.4V4M2.4 9H4M3.5 4.5l1 1M12.5 4.5l-1 1"/><path d="M9 17a3 3 0 0 1 .5-5.9 4.5 4.5 0 0 1 8.4 1.4A3 3 0 0 1 17.5 18z" fill="none"/>`,
      'cloud': html`<path d="M7 17a3.5 3.5 0 0 1 .5-6.9 5 5 0 0 1 9.4 1.5A3.5 3.5 0 0 1 16.5 18z"/>`,
      'fog': html`<path d="M5 9a3 3 0 0 1 .4-6 4.5 4.5 0 0 1 8.5 1.4A3 3 0 0 1 13.5 10z"/><path d="M3 14h18M3 18h18M5 22h14" />`,
