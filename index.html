      'rain': html`<path d="M7 12a3.5 3.5 0 0 1 .5-6.9 5 5 0 0 1 9.4 1.5A3.5 3.5 0 0 1 16.5 13z"/><path d="M8 17v3M12 17v3M16 17v3"/>`,
      'showers': html`<path d="M7 11a3.5 3.5 0 0 1 .5-6.9 5 5 0 0 1 9.4 1.5A3.5 3.5 0 0 1 16.5 12z"/><path d="M6 16l-1 3M10 16l-1 3M14 16l-1 3M18 16l-1 3"/>`,
      'snow': html`<path d="M7 12a3.5 3.5 0 0 1 .5-6.9 5 5 0 0 1 9.4 1.5A3.5 3.5 0 0 1 16.5 13z"/><path d="M8 17v2.5M12 17v2.5M16 17v2.5M7.2 18.5l1.6 1M11.2 18.5l1.6 1M15.2 18.5l1.6 1M8.8 18.5l-1.6 1M12.8 18.5l-1.6 1M16.8 18.5l-1.6 1"/>`,
      'storm': html`<path d="M7 10a3.5 3.5 0 0 1 .5-6.9 5 5 0 0 1 9.4 1.5A3.5 3.5 0 0 1 16.5 11z"/><path d="M11 13l-2 4h3l-2 4" />`,
    };

    /* ============================================================
       Stream URLs
       ============================================================ */
    function embedUrl(cam) {
      if (cam.type === 'youtube') {
        return `https://www.youtube.com/embed/${cam.id}?autoplay=1&mute=1&controls=0&modestbranding=1&playsinline=1&rel=0&loop=1&playlist=${cam.id}`;
      }
      return cam.url;
    }
    function embedUrlFull(cam) {
      // Fullscreen viewer: show controls + allow scrubbing
      if (cam.type === 'youtube') {
        return `https://www.youtube.com/embed/${cam.id}?autoplay=1&mute=1&controls=1&modestbranding=1&playsinline=1&rel=0`;
      }
      return cam.url;
    }
    function cameraId(cam) {
      return cam.type === 'youtube' ? `yt:${cam.id}` : `if:${cam.url}`;
    }
    function sourceUrl(cam) {
      return cam.type === 'youtube' ? `https://www.youtube.com/watch?v=${cam.id}` : cam.url;
    }

    /* ============================================================
       Leaflet loader — lazy
       ============================================================ */
    let leafletPromise = null;
    function loadLeaflet() {
      if (leafletPromise) return leafletPromise;
      leafletPromise = new Promise((resolve, reject) => {
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
        document.head.appendChild(css);

        const s = document.createElement('script');
        s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        s.onload = () => resolve(window.L);
        s.onerror = reject;
        document.head.appendChild(s);
      });
      return leafletPromise;
    }

    /* ============================================================
       Pager — tap-only (swipe gestures intentionally disabled).
       Track width is 400% across 4 pages; transform shifts by 25% per page.
       ============================================================ */
    const PAGE_COUNT = 4;
    function usePager(initial = 0) {
      const [page, setPage] = useState(initial);
      const transform = useMemo(() => `translate3d(-${page * (100 / PAGE_COUNT)}%, 0, 0)`, [page]);
      return { page, setPage, transform };
    }

    /* ============================================================
       Pin-cluster algorithm — pixel-space greedy.
       ============================================================ */
    function clusterCameras(cams, map, threshold = 36) {
      const points = cams.map((c, i) => ({
        cam: c, idx: i, pt: map.latLngToContainerPoint([c.lat, c.lng])
      }));
      const used = new Set();
      const clusters = [];
      for (let i = 0; i < points.length; i++) {
        if (used.has(i)) continue;
        const group = [points[i]];
        used.add(i);
        for (let j = i + 1; j < points.length; j++) {
          if (used.has(j)) continue;
          const dx = points[i].pt.x - points[j].pt.x;
          const dy = points[i].pt.y - points[j].pt.y;
          if (Math.hypot(dx, dy) < threshold) {
            group.push(points[j]);
            used.add(j);
          }
        }
        clusters.push(group);
      }
      return clusters;
    }

    /* ============================================================
       Map view
       ============================================================ */
    function MapView({ cameras, trails, onSelect, onSelectTrail, active }) {
      const containerRef = useRef(null);
      const mapRef = useRef(null);
      const layersRef = useRef({ regular: null, satellite: null, labels: null });
      const markersRef = useRef([]);
      const trailMarkersRef = useRef([]);
      const camerasRef = useRef(cameras);
      const trailsRef = useRef(trails);
      const onSelectRef = useRef(onSelect);
      const onSelectTrailRef = useRef(onSelectTrail);
      const [showTrails, setShowTrails] = useState(true);
      const showTrailsRef = useRef(showTrails);
      const [mapMode, setMapMode] = useState(() => {
        try {
          const raw = localStorage.getItem('mira:mapmode');
          return raw === 'satellite' ? 'satellite' : 'regular';
        } catch {}
        return 'regular';
      });
      useEffect(() => { camerasRef.current = cameras; }, [cameras]);
      useEffect(() => { trailsRef.current = trails; }, [trails]);
      useEffect(() => { onSelectRef.current = onSelect; }, [onSelect]);
      useEffect(() => { onSelectTrailRef.current = onSelectTrail; }, [onSelectTrail]);
      useEffect(() => { showTrailsRef.current = showTrails; }, [showTrails]);

      // Persisted view
      const initialView = useMemo(() => {
        try {
          const raw = localStorage.getItem('mira:mapview');
          if (raw) return JSON.parse(raw);
        } catch {}
        return { center: MADEIRA_CENTER, zoom: MADEIRA_ZOOM };
      }, []);

      const TILE_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
      const LABELS_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';
      const OSM_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

      const applyMapMode = useCallback((mode) => {
        const map = mapRef.current;
        const layers = layersRef.current;
        if (!map || !layers.regular || !layers.satellite || !layers.labels) return;
        const isSatellite = mode === 'satellite';

        if (isSatellite) {
          if (map.hasLayer(layers.regular)) map.removeLayer(layers.regular);
          if (!map.hasLayer(layers.satellite)) map.addLayer(layers.satellite);
          if (!map.hasLayer(layers.labels)) map.addLayer(layers.labels);
          return;
        }

        if (map.hasLayer(layers.satellite)) map.removeLayer(layers.satellite);
        if (map.hasLayer(layers.labels)) map.removeLayer(layers.labels);
        if (!map.hasLayer(layers.regular)) map.addLayer(layers.regular);
      }, []);

      const rebuildPins = useCallback(() => {
        const L = window.L;
        const cams = camerasRef.current;
        if (!L || !mapRef.current || !cams.length) return;
        const map = mapRef.current;
        markersRef.current.forEach((m) => map.removeLayer(m));
        markersRef.current = [];

        const clusters = clusterCameras(cams, map, 36);
        for (const group of clusters) {
          if (group.length === 1) {
            const { cam } = group[0];
            const ic = L.divIcon({
              className: '',
              html: `<div class="pin"><span class="pin-pulse"></span><span class="pin-dot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 7l9 5-9 5z"/></svg></span></div>`,
              iconSize: [36, 36],
              iconAnchor: [18, 36],
            });
            const m = L.marker([cam.lat, cam.lng], { icon: ic, keyboard: false });
            m.on('click', () => onSelectRef.current(cam));
            m.addTo(map);
            markersRef.current.push(m);
          } else {
            const cx = group.reduce((s, p) => s + p.cam.lat, 0) / group.length;
            const cy = group.reduce((s, p) => s + p.cam.lng, 0) / group.length;
            const ic = L.divIcon({
              className: '',
              html: `<div class="pin-cluster">${group.length}</div>`,
              iconSize: [40, 40],
              iconAnchor: [20, 20],
            });
            const m = L.marker([cx, cy], { icon: ic, keyboard: false });
            m.on('click', () => {
              // zoom into cluster
              const bounds = L.latLngBounds(group.map((p) => [p.cam.lat, p.cam.lng]));
              map.flyToBounds(bounds, { padding: [60, 60], maxZoom: 14, duration: 0.6 });
            });
            m.addTo(map);
            markersRef.current.push(m);
          }
        }
      }, []);

      const rebuildTrails = useCallback(() => {
        const L = window.L;
        if (!L || !mapRef.current) return;
        const map = mapRef.current;
        trailMarkersRef.current.forEach((m) => map.removeLayer(m));
        trailMarkersRef.current = [];
        if (!showTrailsRef.current) return;
        const list = trailsRef.current || [];
        for (const t of list) {
          if (!t.location || typeof t.location.lat !== 'number') continue;
          const ic = L.divIcon({
            className: '',
            html: `<div class="pin-trail"><span class="pin-trail-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l5-9 3.5 5 2.5-3 7 7z"/></svg></span></div>`,
            iconSize: [30, 30],
            iconAnchor: [15, 30],
          });
          const m = L.marker([t.location.lat, t.location.lng], { icon: ic, keyboard: false });
          m.on('click', () => onSelectTrailRef.current && onSelectTrailRef.current(t));
          m.addTo(map);
          trailMarkersRef.current.push(m);
        }
      }, []);

      useEffect(() => {
        let cancelled = false;
        loadLeaflet().then((L) => {
          if (cancelled || !containerRef.current) return;
          const map = L.map(containerRef.current, {
            zoomControl: false,
            attributionControl: true,
            preferCanvas: false,
            maxBounds: [[32.2, -17.8], [33.4, -15.8]],
            maxBoundsViscosity: 0.7,
          }).setView(initialView.center, initialView.zoom);
          mapRef.current = map;

          layersRef.current.satellite = L.tileLayer(TILE_URL, {
            attribution: 'Imagery &copy; Esri',
            detectRetina: true,
            minZoom: 0,
            maxZoom: 19,
          });

          layersRef.current.labels = L.tileLayer(LABELS_URL, {
            attribution: '&copy; Esri',
            detectRetina: true,
            minZoom: 0,
            maxZoom: 19,
            pane: 'overlayPane',
          });

          layersRef.current.regular = L.tileLayer(OSM_URL, {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          });

          applyMapMode(mapMode);

          map.on('moveend zoomend', () => {
            const c = map.getCenter();
            try {
              localStorage.setItem('mira:mapview', JSON.stringify({ center: [c.lat, c.lng], zoom: map.getZoom() }));
            } catch {}
            rebuildPins();
          });

          rebuildPins();
          rebuildTrails();
        }).catch(() => { /* offline; map cannot load */ });

        return () => { cancelled = true; };
      // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      useEffect(() => {
        try { localStorage.setItem('mira:mapmode', mapMode); } catch {}
        applyMapMode(mapMode);
      }, [mapMode, applyMapMode]);

      // Rebuild pins when cameras list changes
      useEffect(() => { rebuildPins(); }, [cameras, rebuildPins]);

      // Rebuild trail pins when trails list or visibility toggle changes
      useEffect(() => { rebuildTrails(); }, [trails, showTrails, rebuildTrails]);

      // Invalidate size when map page becomes active (avoid grey tiles after orientation/visibility)
      useEffect(() => {
        if (active && mapRef.current) {
          requestAnimationFrame(() => mapRef.current.invalidateSize());
        }
      }, [active]);

      const recentre = useCallback(() => {
        if (mapRef.current) mapRef.current.flyTo(MADEIRA_CENTER, MADEIRA_ZOOM, { duration: 0.7 });
      }, []);

      return html`
        <div class="page page--map">
          <div class="map-root" ref=${containerRef}></div>
          <button class="map-fab" onClick=${recentre} aria-label="Recentre to Madeira">
            <${Icon} name="target" />
          </button>
          <button class="map-fab fab-trails"
                  aria-pressed=${showTrails}
                  aria-label=${showTrails ? 'Hide trails' : 'Show trails'}
                  onClick=${() => setShowTrails((v) => !v)}>
            <${Icon} name="mountain" />
          </button>
          <button class="map-fab fab-style"
                  aria-pressed=${mapMode === 'satellite'}
                  aria-label=${mapMode === 'satellite' ? 'Switch to regular map' : 'Switch to satellite map'}
                  onClick=${() => setMapMode((m) => (m === 'satellite' ? 'regular' : 'satellite'))}>
            <${Icon} name="map" />
          </button>
        </div>
      `;
    }

    /* ============================================================
       Grid tile — Preact renders the shell, iframe src toggled imperatively
       to avoid teardown on parent re-renders.
       ============================================================ */
    function Tile({ cam, onSelect, registerIframe }) {
      const ref = useRef(null);
      const iframeRef = useRef(null);
      const id = cameraId(cam);

      useEffect(() => {
        if (ref.current && iframeRef.current) {
          registerIframe(id, ref.current, iframeRef.current, cam);
        }
        return () => registerIframe(id, null, null, null);
      }, [id]);

      const thumb = cam.type === 'youtube'
        ? `https://i.ytimg.com/vi/${cam.id}/hqdefault.jpg`
        : null;

      return html`
        <div class="tile" ref=${ref} data-cam-id=${id} onClick=${() => onSelect(cam)} role="button" aria-label=${`Open ${cam.name}`}>
          ${thumb
            ? html`<img class="tile-thumb" src=${thumb} alt="" loading="lazy" decoding="async" />`
            : html`<div class="tile-thumb-placeholder"><${Icon} name="camera" /></div>`}
          <iframe class="tile-frame" ref=${iframeRef}
            title=${cam.name}
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
          <div class="tile-overlay">
            <span class="live"><span class="live-dot"></span>LIVE</span>
            <span class="tile-name">${cam.name}</span>
          </div>
        </div>
      `;
    }

    /* ============================================================
       Grid view: filter + tile mounting orchestration
       ============================================================ */
    function GridView({ cameras, onSelect, active, refreshKey }) {
      const [filterIdx, setFilterIdx] = useState(0);
      const filtered = useMemo(() => cameras.filter(REGION_FILTERS[filterIdx].match), [cameras, filterIdx]);

      const scrollRef = useRef(null);
      const pullRef = useRef(null);
      const tilesRef = useRef(new Map()); // id -> { el, iframe, cam, visible, unmountTimer }
      const mountedQueueRef = useRef([]); // ids in mount order (LRU)
      const ioRef = useRef(null);

      const mountIframe = (id, src) => {
        const e = tilesRef.current.get(id);
        if (!e || !e.iframe) return;
        if (e.iframe.src === src) return;
        e.iframe.src = src;
        // YouTube's iframe fires `load` while still showing its own grey loading screen.
        // Keep the thumbnail visible until the video has had a beat to start playing.
        setTimeout(() => {
          if (mountedQueueRef.current.includes(id) && e.iframe) {
            e.iframe.classList.add('mounted');
          }
        }, 1800);
      };
      const unmountIframe = (id) => {
        const e = tilesRef.current.get(id);
        if (!e || !e.iframe) return;
        e.iframe.classList.remove('mounted');
        // Wait for the cross-fade out before swapping src back to blank,
        // so the thumbnail underneath is the visible state during the transition.
        setTimeout(() => {
          if (!mountedQueueRef.current.includes(id) && e.iframe) {
            e.iframe.src = 'about:blank';
          }
        }, 450);
      };

      const mountTile = (id) => {
        const e = tilesRef.current.get(id);
        if (!e || !e.cam) return;
        if (mountedQueueRef.current.includes(id)) {
          mountedQueueRef.current = mountedQueueRef.current.filter((x) => x !== id);
          mountedQueueRef.current.push(id);
          return;
        }
        while (mountedQueueRef.current.length >= MAX_MOUNTED_TILES) {
          let evictId = mountedQueueRef.current.find((m) => !tilesRef.current.get(m)?.visible);
          if (!evictId) evictId = mountedQueueRef.current[0];
          mountedQueueRef.current = mountedQueueRef.current.filter((x) => x !== evictId);
          unmountIframe(evictId);
        }
        mountedQueueRef.current.push(id);
        mountIframe(id, embedUrl(e.cam));
      };

      const scheduleUnmount = (id) => {
        const e = tilesRef.current.get(id);
        if (!e) return;
        if (e.unmountTimer) clearTimeout(e.unmountTimer);
        e.unmountTimer = setTimeout(() => {
          if (!tilesRef.current.get(id)?.visible) {
            mountedQueueRef.current = mountedQueueRef.current.filter((x) => x !== id);
            unmountIframe(id);
          }
        }, UNMOUNT_DELAY_MS);
      };

      const cancelUnmount = (id) => {
        const e = tilesRef.current.get(id);
        if (e && e.unmountTimer) { clearTimeout(e.unmountTimer); e.unmountTimer = null; }
      };

      // Initialise IO once
      useEffect(() => {
        ioRef.current = new IntersectionObserver((entries) => {
          for (const en of entries) {
            const id = en.target.dataset.camId;
            const e = tilesRef.current.get(id);
            if (!e) continue;
            e.visible = en.isIntersecting;
            if (en.isIntersecting) {
              cancelUnmount(id);
              mountTile(id);
            } else {
              scheduleUnmount(id);
            }
          }
        }, { root: scrollRef.current, rootMargin: '200px 0px', threshold: 0 });
        return () => ioRef.current && ioRef.current.disconnect();
      }, []);

      const registerIframe = useCallback((id, el, iframe, cam) => {
        if (!el) {
          // tile is unmounting
          const e = tilesRef.current.get(id);
          if (e && e.unmountTimer) clearTimeout(e.unmountTimer);
          tilesRef.current.delete(id);
          mountedQueueRef.current = mountedQueueRef.current.filter((x) => x !== id);
          return;
        }
        if (ioRef.current) ioRef.current.unobserve(el);
        tilesRef.current.set(id, { el, iframe, cam, visible: false, unmountTimer: null });
        if (ioRef.current) ioRef.current.observe(el);
      }, []);

      // Pause all tile iframes when grid is not the active page (battery).
      useEffect(() => {
        if (!active) {
          // Unmount all mounted iframes after a short delay so re-entry is fast for top tiles
          const ids = [...mountedQueueRef.current];
          mountedQueueRef.current = [];
          const t = setTimeout(() => { ids.forEach(unmountIframe); }, 600);
          return () => clearTimeout(t);
        } else {
          // Re-evaluate visibility — IO will not fire if elements are already in view at mount time
          // because we re-observed them. Trigger a re-eval by scrolling 0px.
          if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollTop;
        }
      }, [active]);

      /* ----- Pull to refresh ----- */
      const pullState = useRef({ active: false, startY: 0, dy: 0, refreshing: false });
      const [pullPx, setPullPx] = useState(0);
      const [refreshing, setRefreshing] = useState(false);

      const onTouchStart = (e) => {
        const sc = scrollRef.current;
        if (!sc || sc.scrollTop > 0) return;
        if (e.touches.length !== 1) return;
        pullState.current.active = true;
        pullState.current.startY = e.touches[0].clientY;
        pullState.current.dy = 0;
      };
      const onTouchMove = (e) => {
        const ps = pullState.current;
        if (!ps.active) return;
        const dy = e.touches[0].clientY - ps.startY;
        if (dy < 0) { ps.dy = 0; setPullPx(0); return; }
        ps.dy = Math.min(120, dy * 0.5);
        setPullPx(ps.dy);
      };
      const onTouchEnd = async () => {
        const ps = pullState.current;
        if (!ps.active) return;
        ps.active = false;
        const trigger = ps.dy > 56;
        if (trigger && !refreshing) {
          setRefreshing(true);
          setPullPx(56);
          await refreshWeather();
          setRefreshing(false);
          setPullPx(0);
        } else {
          setPullPx(0);
        }
      };
      const refreshWeather = async () => {
        // Force re-fetch for currently visible cameras
        const visible = filtered.filter((c) => tilesRef.current.get(cameraId(c))?.visible);
        await Promise.all(visible.map((c) => fetchWeather(c.lat, c.lng, true).catch(() => null)));
      };

      // Re-fetch on refreshKey change (theme toggles etc. won't trigger; only pull)
      useEffect(() => {}, [refreshKey]);

      return html`
        <div class="page page--grid">
          <div class="grid-scroll" ref=${scrollRef}
               onTouchStart=${onTouchStart} onTouchMove=${onTouchMove} onTouchEnd=${onTouchEnd}>
            <div class="pull-indicator" style=${{ transform: `translateY(${pullPx - 56}px)`, opacity: pullPx > 8 ? 1 : 0 }}>
              ${refreshing ? html`<span class="pull-spinner"></span>Refreshing weather` : 'Pull to refresh'}
            </div>
            <div class="grid-pull-wrap ${refreshing ? 'dragging' : ''}" ref=${pullRef}
                 style=${{ transform: `translate3d(0, ${pullPx}px, 0)` }}>
              <div class="chips" role="tablist" aria-label="Region filter">
                ${REGION_FILTERS.map((f, i) => html`
                  <button class="chip" key=${f.label}
                          aria-pressed=${i === filterIdx}
                          onClick=${() => setFilterIdx(i)}>${f.label}</button>`)}
              </div>
              <div class="grid">
                ${filtered.map((c) => html`<${Tile} key=${cameraId(c)} cam=${c}
                                              onSelect=${onSelect}
                                              registerIframe=${registerIframe} />`)}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /* ============================================================
       Weather card
       ============================================================ */
    function WeatherCard({ lat, lng, refreshKey }) {
      const [state, setState] = useState({ loading: true });

      useEffect(() => {
        let alive = true;
        setState({ loading: true });
        fetchWeather(lat, lng).then((d) => {
          if (alive) setState({ loading: false, data: d });
        }).catch(() => {
          if (alive) setState({ loading: false, error: true });
        });
        return () => { alive = false; };
      }, [lat, lng, refreshKey]);

      if (state.loading) {
        return html`
          <div class="weather">
            <div class="weather-skel-row"></div>
            <div class="weather-skel-row short"></div>
          </div>
        `;
      }
      if (state.error || !state.data) {
        return html`<div class="weather"><div class="weather-error">Weather unavailable.</div></div>`;
      }
      const d = state.data;
      const wx = wxInfo(d.weather_code);
      const t = Math.round(d.temperature_2m);
      const feels = Math.round(d.apparent_temperature);
      const wind = Math.round(d.wind_speed_10m);
      const hum = Math.round(d.relative_humidity_2m);

      return html`
        <div class="weather">
          <div class="weather-top">
            <div class="weather-temp num">${t}<sup>°C</sup></div>
            <div class="weather-glyph"><${Icon} name=${wx.glyph} /></div>
          </div>
          <div class="weather-condition">${wx.label} · feels like <span class="num">${feels}°</span></div>
          <div class="weather-stats">
            <div>
              <div class="weather-stat-key">Wind</div>
              <div class="weather-stat-val num">${wind} <span style="font-size:11px;color:var(--ink-muted);font-weight:500;">km/h</span></div>
            </div>
            <div>
              <div class="weather-stat-key">Humidity</div>
              <div class="weather-stat-val num">${hum}<span style="font-size:11px;color:var(--ink-muted);font-weight:500;">%</span></div>
            </div>
            <div>
              <div class="weather-stat-key">Rain</div>
              <div class="weather-stat-val num">${(d.precipitation ?? 0).toFixed(1)} <span style="font-size:11px;color:var(--ink-muted);font-weight:500;">mm</span></div>
            </div>
          </div>
          <div class="weather-updated">Updated ${relTime(d._ts)}</div>
        </div>
      `;
    }

    /* ============================================================
       useSheetDismiss — shared swipe-to-close behaviour.
       Pointer-events based (works for touch + mouse). The drag zone is the
       handle + header; the body also drags but only when scrolled to top.
       ============================================================ */
    function useSheetDismiss(onClose) {
      const [open, setOpen] = useState(false);
      const [dragY, setDragY] = useState(0);
      const [dragging, setDragging] = useState(false);
      const drag = useRef({ active: false, startY: 0, dy: 0, fromBody: false });

      useEffect(() => {
        const id = requestAnimationFrame(() => setOpen(true));
        document.body.style.overflow = 'hidden';
        return () => { cancelAnimationFrame(id); document.body.style.overflow = ''; };
      }, []);

      const requestClose = useCallback(() => {
        setDragY(0);
        setDragging(false);
        setOpen(false);
        setTimeout(onClose, 320);
      }, [onClose]);

      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') requestClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [requestClose]);

      const onPointerDown = useCallback((e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        // If pointer starts inside .sheet-body, only drag when scrollTop is at 0.
        const body = e.target.closest('.sheet-body');
        if (body && body.scrollTop > 0) return;
        drag.current = { active: true, startY: e.clientY, dy: 0, fromBody: !!body };
        setDragging(true);
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      }, []);

      const onPointerMove = useCallback((e) => {
        const d = drag.current;
        if (!d.active) return;
        const dy = e.clientY - d.startY;
        // From the body, only register a drag once it clearly outpaces a native fingertip jitter.
        if (d.fromBody && dy < 6) { setDragY(0); return; }
        if (dy <= 0) { d.dy = 0; setDragY(0); return; }
        d.dy = dy;
        setDragY(dy);
      }, []);

      const onPointerEnd = useCallback(() => {
        const d = drag.current;
        if (!d.active) return;
        d.active = false;
        setDragging(false);
        if (d.dy > 90) requestClose();
        else setDragY(0);
      }, [requestClose]);

      const dragProps = {
        onPointerDown,
        onPointerMove,
        onPointerUp: onPointerEnd,
        onPointerCancel: onPointerEnd,
      };

      return { open, dragY, dragging, requestClose, dragProps };
    }

    /* ============================================================
       Detail sheet
       ============================================================ */
    function DetailSheet({ cam, onClose, onFullscreen }) {
      const { open, dragY, dragging, requestClose, dragProps } = useSheetDismiss(onClose);
      const handleClose = requestClose;
      const sheetStyle = dragY > 0
        ? { transform: `translate3d(0, ${dragY}px, 0)`, opacity: Math.max(0.55, 1 - dragY / 380) }
        : null;
      const scrimStyle = dragY > 0
        ? { opacity: Math.max(0, 1 - dragY / 220) }
        : null;

      return html`
        <div class="sheet-portal" data-open=${open}>
          <div class="sheet-scrim" onClick=${handleClose} style=${scrimStyle}></div>
          <div class="sheet ${dragging ? 'dragging' : ''}"
               style=${sheetStyle}
               role="dialog" aria-modal="true" aria-label=${cam.name}>
            <div class="sheet-drag-zone" ...${dragProps} aria-label="Drag down to close">
              <div class="sheet-grabber" aria-hidden="true"></div>
              <div class="sheet-head">
                <div class="sheet-title-block">
                  <div class="sheet-region">${cam.region}</div>
                  <h2 class="sheet-title">${cam.name}</h2>
                </div>
                <button class="sheet-close" onPointerDown=${(e) => e.stopPropagation()} onClick=${handleClose} aria-label="Close">
                  <${Icon} name="close" />
                </button>
              </div>
            </div>
            <div class="sheet-body">
              <div class="stream">
                <iframe
                  src=${embedUrl(cam)}
                  title=${cam.name}
                  allow="autoplay; encrypted-media; picture-in-picture"
                  allowfullscreen
                  referrerpolicy="no-referrer-when-downgrade"
                ></iframe>
                <span class="live stream-live"><span class="live-dot"></span>LIVE</span>
                <div class="stream-actions">
                  <button class="stream-act" onClick=${() => window.open(sourceUrl(cam), '_blank', 'noopener')} aria-label="Open original source">
                    <${Icon} name="external" />
                  </button>
                  <button class="stream-act" onClick=${() => onFullscreen(cam)} aria-label="Open fullscreen">
                    <${Icon} name="expand" />
                  </button>
                </div>
              </div>
              <${WeatherCard} lat=${cam.lat} lng=${cam.lng} />
            </div>
          </div>
        </div>
      `;
    }

    /* ============================================================
       Trails — list view + detail sheet
       ============================================================ */
    function TrailCard({ trail, onSelect }) {
      const [imgOk, setImgOk] = useState(true);
      const distance = trail.distance_km;
      const difficulty = trail.difficulty;
      const duration = trail.duration_hours;
      const bits = [];
      if (distance != null) bits.push(html`<strong>${distance}</strong> km`);
      if (difficulty)       bits.push(difficulty);
      if (distance == null && duration) bits.push(`${duration} h`);
      return html`
        <button class="trail-card" onClick=${() => onSelect(trail)} aria-label=${`Open ${trail.name}`}>
          ${imgOk && trail.image
            ? html`<img class="trail-thumb" src=${trail.image} alt="" loading="lazy" decoding="async"
                        onerror=${() => setImgOk(false)} />`
            : html`<div class="trail-thumb-fallback"><${Icon} name="mountain" /></div>`}
          <div class="trail-meta">
            <div class="trail-code">${trail.pr_code}</div>
            <h3 class="trail-name serif">${trail.name}</h3>
            <div class="trail-row">
              <span class="status" data-status=${trail.status}>${trail.status}</span>
              ${bits.map((b, i) => html`<span class="trail-bit" key=${`b${i}`}><span class="dot"></span><span>${b}</span></span>`)}
            </div>
          </div>
        </button>
      `;
    }

    function TrailsView({ trails, onSelect }) {
      return html`
        <div class="page page--trails">
          <div class="trails-scroll">
            <div class="trails-inner">
              <header class="trails-head">
                <div class="trails-eyebrow">Mira · Trails</div>
                <h1 class="trails-h1 serif">Walk the laurel.</h1>
                <p class="trails-lede">All ${trails.length} official PR hiking trails across Madeira and Porto Santo.</p>
              </header>
              <div class="trails-list">
                ${trails.map((t) => html`<${TrailCard} key=${t.pr_code} trail=${t} onSelect=${onSelect} />`)}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function TrailSheet({ trail, onClose }) {
      const [imgOk, setImgOk] = useState(true);
      const { open, dragY, dragging, requestClose, dragProps } = useSheetDismiss(onClose);
      const handleClose = requestClose;
      const sheetStyle = dragY > 0
        ? { transform: `translate3d(0, ${dragY}px, 0)`, opacity: Math.max(0.55, 1 - dragY / 380) }
        : null;
      const scrimStyle = dragY > 0
        ? { opacity: Math.max(0, 1 - dragY / 220) }
        : null;

      const stats = [];
      if (trail.difficulty)         stats.push(['Difficulty', trail.difficulty]);
      if (trail.distance_km != null) stats.push(['Distance', `${trail.distance_km} km`]);
      if (trail.duration_hours)     stats.push(['Duration', `${trail.duration_hours} h`]);
      if (trail.elevation_gain_m != null) stats.push(['Elevation', `${trail.elevation_gain_m} m`]);

      const kv = [];
      if (trail.type)             kv.push(['Type', trail.type]);
      if (trail.start_point)      kv.push(['Start', trail.start_point]);
      if (trail.end_point)        kv.push(['End', trail.end_point]);
      if (trail.fee_amount)       kv.push(['Fee', trail.fee_amount]);
      if (trail.parking_location) kv.push(['Parking', trail.parking_location]);
      if (trail.parking_cost)     kv.push(['Parking cost', trail.parking_cost]);
      if (trail.exposure_rating != null) kv.push(['Exposure', `${trail.exposure_rating} / 5`]);
      if (trail.tunnels && trail.tunnels.has_tunnels) {
        kv.push(['Tunnels', trail.tunnels.headlamp_required ? 'Yes — headlamp required' : 'Yes']);
      }

      return html`
        <div class="sheet-portal" data-open=${open}>
          <div class="sheet-scrim" onClick=${handleClose} style=${scrimStyle}></div>
          <div class="sheet ${dragging ? 'dragging' : ''}"
               style=${sheetStyle}
               role="dialog" aria-modal="true" aria-label=${trail.name}>
            <div class="sheet-drag-zone" ...${dragProps} aria-label="Drag down to close">
              <div class="sheet-grabber" aria-hidden="true"></div>
              <div class="sheet-head">
                <div class="sheet-title-block">
                  <div class="sheet-region">${trail.pr_code}</div>
                  <h2 class="sheet-title">${trail.name}</h2>
                </div>
                <button class="sheet-close" onPointerDown=${(e) => e.stopPropagation()} onClick=${handleClose} aria-label="Close">
                  <${Icon} name="close" />
                </button>
              </div>
            </div>
            <div class="sheet-body">
              <div class="trail-hero">
                ${imgOk && trail.image
                  ? html`<img src=${trail.image} alt="" loading="lazy" decoding="async"
                              onerror=${() => setImgOk(false)} />`
                  : html`<div class="trail-hero-fallback"><${Icon} name="mountain" /></div>`}
              </div>

              <div class="trail-status-row">
                <span class="status" data-status=${trail.status}>${trail.status}</span>
                ${trail.alternative_names && html`<span style="font-size:13px;color:var(--ink-muted);">${trail.alternative_names}</span>`}
              </div>

              ${trail.highlights && html`<p class="trail-highlights">${trail.highlights}</p>`}

              ${stats.length > 0 && html`
                <div class="trail-stats">
                  ${stats.map(([k, v]) => html`
                    <div class="trail-stat" key=${k}>
                      <div class="trail-stat-key">${k}</div>
                      <div class="trail-stat-val">${v}</div>
                    </div>`)}
                </div>
              `}

              ${trail.safety_notes && html`
                <section class="trail-section">
                  <div class="trail-section-label">Safety</div>
                  <p>${trail.safety_notes}</p>
                </section>`}

              ${trail.equipment_needed && html`
                <section class="trail-section">
                  <div class="trail-section-label">Equipment</div>
                  <p>${trail.equipment_needed}</p>
                </section>`}

              ${trail.best_season && html`
                <section class="trail-section">
                  <div class="trail-section-label">Best season</div>
                  <p>${trail.best_season}</p>
                </section>`}

              ${trail.exposure_notes && html`
                <section class="trail-section">
                  <div class="trail-section-label">Exposure</div>
                  <p>${trail.exposure_notes}</p>
                </section>`}

              ${kv.length > 0 && html`
                <section class="trail-section">
                  <div class="trail-section-label">Practical</div>
                  ${kv.map(([k, v]) => html`
                    <div class="trail-kv" key=${k}>
                      <span class="trail-kv-key">${k}</span>
                      <span class="trail-kv-val">${v}</span>
                    </div>`)}
                </section>`}

              ${trail.official_url && html`
                <a class="trail-cta" href=${trail.official_url} target="_blank" rel="noopener noreferrer">
                  <${Icon} name="external" />
                  View on Visit Madeira
                </a>`}
            </div>
          </div>
        </div>
      `;
    }

    /* ============================================================
       Settings sheet
       ============================================================ */
    function SettingsPage({ cameras }) {
      const counts = useMemo(() => {
        const c = { total: cameras.length, byRegion: {} };
        for (const cam of cameras) c.byRegion[cam.region] = (c.byRegion[cam.region] || 0) + 1;
        return c;
      }, [cameras]);
      const regions = Object.entries(counts.byRegion).sort((a, b) => b[1] - a[1]);

      return html`
        <div class="page page--settings">
          <div class="settings-scroll">
            <div class="settings-inner">
              <header class="settings-head">
                <div class="settings-eyebrow">Mira · Laurisilva</div>
                <h1 class="settings-h1 serif">A view on Madeira.</h1>
                <p class="settings-lede">Sixteen live cameras across the island and Porto Santo, with current weather at each spot.</p>
              </header>

              <section class="stat-row">
                <div class="stat">
                  <div class="stat-num num serif">${counts.total}</div>
                  <div class="stat-key">Cameras</div>
                </div>
                <div class="stat">
                  <div class="stat-num num serif">${regions.length}</div>
                  <div class="stat-key">Regions</div>
                </div>
                <div class="stat">
                  <div class="stat-num num serif">24<span class="stat-unit">/7</span></div>
                  <div class="stat-key">Live</div>
                </div>
              </section>

              <section class="settings-group">
                <div class="settings-group-label">By region</div>
                <ul class="region-list">
                  ${regions.map(([r, n]) => html`
                    <li class="region-row" key=${r}>
                      <span class="region-name">${r}</span>
                      <span class="region-count num">${n}</span>
                    </li>`)}
                </ul>
              </section>

              <section class="settings-group">
                <div class="settings-group-label">About</div>
                <div class="about">
                  Streams sourced openly via YouTube and madeirawebcams.com.
                  Weather by <a href="https://open-meteo.com" target="_blank" rel="noreferrer">Open-Meteo</a>.
                  Map view toggle: Regular by OpenStreetMap, Satellite imagery and labels by Esri.
                  <div class="about-meta">Mira runs entirely on your device. No accounts, no tracking, no servers between you and the cameras.</div>
                  <div class="about-version">Version ${APP_VERSION}</div>
                </div>
              </section>
            </div>
          </div>
        </div>
      `;
    }

    /* ============================================================
       Fullscreen viewer
       ============================================================ */
    function Fullscreen({ cam, onClose }) {
      const [open, setOpen] = useState(false);
      useEffect(() => {
        const id = requestAnimationFrame(() => setOpen(true));
        document.body.style.overflow = 'hidden';
        return () => { cancelAnimationFrame(id); document.body.style.overflow = ''; };
      }, []);
      const handleClose = () => { setOpen(false); setTimeout(onClose, 240); };
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') handleClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      return html`
        <div class="fs" data-open=${open}>
          <div class="fs-inner">
            <iframe src=${embedUrlFull(cam)} title=${cam.name}
                    allow="autoplay; encrypted-media; picture-in-picture"
                    allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <button class="fs-close" onClick=${handleClose} aria-label="Close fullscreen">
            <${Icon} name="close" />
          </button>
        </div>
      `;
    }

    /* ============================================================
       App
       ============================================================ */
    function App() {
      const [cameras, setCameras] = useState([]);
      const [trails, setTrails] = useState([]);
      const [sheetCam, setSheetCam] = useState(null);
      const [sheetTrail, setSheetTrail] = useState(null);
      const [fsCam, setFsCam] = useState(null);
      const pager = usePager(0);

      const openCam = useCallback((c) => { setSheetTrail(null); setSheetCam(c); }, []);
      const openTrail = useCallback((t) => { setSheetCam(null); setSheetTrail(t); }, []);

      // Load cameras
      useEffect(() => {
        fetch('./cameras.json', { cache: 'no-store' })
          .then((r) => r.json())
          .then((list) => setCameras(list))
          .catch(() => setCameras([]));
      }, []);

      // Load trails (non-fatal if missing)
      useEffect(() => {
        fetch('./hikes.json', { cache: 'no-store' })
          .then((r) => r.json())
          .then((data) => setTrails(Array.isArray(data?.trails) ? data.trails : []))
          .catch(() => setTrails([]));
      }, []);

      // Hide splash once cameras have arrived, or after 1.5s fallback
      useEffect(() => {
        const hide = () => {
          const sp = document.getElementById('splash');
          if (!sp) return;
          sp.setAttribute('data-hidden', 'true');
          setTimeout(() => sp.remove(), 320);
        };
        if (cameras.length) hide();
        const t = setTimeout(hide, 1500);
        return () => clearTimeout(t);
      }, [cameras.length]);


      return html`
        <main class="pager">
          <div class="pages-track" style=${{ transform: pager.transform }}>
            <${MapView} cameras=${cameras} trails=${trails} onSelect=${openCam} onSelectTrail=${openTrail} active=${pager.page === 0} />
            <${GridView} cameras=${cameras} onSelect=${openCam} active=${pager.page === 1} />
            <${TrailsView} trails=${trails} onSelect=${openTrail} active=${pager.page === 2} />
            <${SettingsPage} cameras=${cameras} active=${pager.page === 3} />
          </div>
        </main>

        <div class="tabbar-wrap">
          <nav class="tabbar" role="tablist" aria-label="Pages">
            <button class="tab" role="tab" aria-selected=${pager.page === 0} onClick=${() => pager.setPage(0)}>
              <${Icon} name="map" /><span class="tab-label">Map</span>
            </button>
            <button class="tab" role="tab" aria-selected=${pager.page === 1} onClick=${() => pager.setPage(1)}>
              <${Icon} name="grid" /><span class="tab-label">Grid</span>
            </button>
            <button class="tab" role="tab" aria-selected=${pager.page === 2} onClick=${() => pager.setPage(2)}>
              <${Icon} name="trail" /><span class="tab-label">Trails</span>
            </button>
            <button class="tab" role="tab" aria-selected=${pager.page === 3} onClick=${() => pager.setPage(3)}>
              <${Icon} name="settings" /><span class="tab-label">Settings</span>
            </button>
          </nav>
        </div>

        ${sheetCam && html`<${DetailSheet} cam=${sheetCam} onClose=${() => setSheetCam(null)} onFullscreen=${(c) => setFsCam(c)} />`}
        ${sheetTrail && html`<${TrailSheet} trail=${sheetTrail} onClose=${() => setSheetTrail(null)} />`}
        ${fsCam && html`<${Fullscreen} cam=${fsCam} onClose=${() => setFsCam(null)} />`}
      `;
    }

    /* ============================================================
       Boot
       ============================================================ */
    render(h(App), document.getElementById('app'));

    // Service worker registration (after main paint)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => { /* offline-first not critical */ });
      });
    }
  </script>
</body>
</html>
